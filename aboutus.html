<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公告📢</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d1a;
    /* 去掉 overflow: hidden，防止文字太长被截断 */
    padding-top: 100px; /* 给顶部的蓝框留出空间 */
    padding-bottom: 50px;
  }

  /* 顶部的蓝色导航栏（保持和你之前一样） */
  .topbar {
    position: absolute;
    left: 0;
    top: 80px;
    width: 100%;
    height: 30px;
    background: linear-gradient(90deg, rgba(30,58,138,0.8) 0%, rgba(37,99,235,0.8) 50%, rgba(30,58,138,0.8) 100%);
    box-shadow: 0 2px 12px rgba(37, 99, 235, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  .topbar a {
    color: #ffffff;
    text-decoration: none;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 15px;
    letter-spacing: 0.15em;
    display: inline-block;
    transition: transform 0.2s ease; 
  }

  .topbar a:hover {
    transform: scale(1.15);
  }

  /* --- 下面是文章内容的样式 --- */
  .article {
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 48px; /* 和首页的 Happy new year 一样大 */
    color: #ffffff; /* 纯白色 */
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.4); /* 略微发光 */
    line-height: 1.5;
    
    /* 用 flex 纵向排版，让文字看起来更整齐 */
    display: flex;
    flex-direction: column;
    gap: 50px; /* 两段文字之间的间距 */
    
    /* 整体居中，但文字内部左对齐 */
    margin: 0 auto;
  }

  .post {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .post .text {
    margin-bottom: 10px; /* 文字和日期的间距 */
  }

  .post .date {
    font-size: 20px; /* 日期字号稍微小一点，更有层次感（如果你也想 48px 就改成 48px） */
    color: rgba(255, 255, 255, 0.6); /* 日期颜色稍微暗一点，发光效果不刺眼 */
    text-shadow: none; /* 日期不加发光 */
  }
</style>
</head>
<body>
  <!-- 顶部蓝框 -->
  <div class="topbar">
    <a href="index.html">返回首页</a>
  </div>

  <!-- 文章内容 -->
  <div class="article">
    <div class="post">
      <div class="text">完成公告功能。</div>
      <div class="text">------------</div>
      <div class="text">以下是预计更新的内容：</div>
      <div class="text">1.歌曲（11.15以前）</div>
      <div class="text">2.聊天社交（预计2027年暑假）</div>
      <div class="text">3.小游戏（预计2027年寒假）</div>
      <div class="text">4.ai对话（预计2027年暑假）</div>
      <div class="text">5.资源下载（2026年12月）</div>
      <div class="text">6.工具箱toolbox(11月末上线,后续陆续更新）</div>
      <div class="text">------------</div>
      <div class="text">其余内容持续更新中，不急不急慢慢来^v^……</div>
      <div class="date">11.01</div>
    </div>
    
    <div class="post">
      <div class="text">于2026.10.31开始编辑</div>
      <div class="date">10.31</div>
    </div>
  </div>

</body>
</html>
