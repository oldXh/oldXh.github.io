<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>渡鸦小游戏</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none;
        }
        canvas {
            background-color: #121216;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            max-height: 100vh;
            max-width: 100vw;
            display: block;
            margin-top: 42px;
            border-radius: 10px;
        }
        
        .topbar {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 42px;
            background: linear-gradient(90deg, rgba(30,58,138,0.6) 0%, rgba(37,99,235,0.7) 50%, rgba(30,58,138,0.6) 100%);
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .topbar a {
            color: #ffffff;
            text-decoration: none;
            font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
            font-size: 16px;
            letter-spacing: 0.15em;
            display: inline-block;
            transition: transform 0.2s ease;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        .topbar a:hover { transform: scale(1.15); }

        #auth-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .auth-box {
            background: #1c1c22;
            border: 1px solid #3a3a44;
            padding: 30px;
            border-radius: 12px;
            width: 300px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            color: #e8e8ed;
            margin-top: 42px;
        }
        .auth-box h2 { margin-top: 0; font-size: 22px; letter-spacing: 2px; color: #fff; }
        .auth-box input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            background: #121216;
            border: 1px solid #3a3a44;
            border-radius: 8px;
            color: #e8e8ed;
            outline: none;
            font-size: 16px;
            font-family: inherit;
            transition: border 0.2s;
        }
        .auth-box input:focus { border-color: #5b8cff; }
        .auth-btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #2e5bff;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: background 0.2s;
        }
        .auth-btn:hover { background: #4a72ff; }
        .auth-switch {
            margin-top: 15px;
            font-size: 13px;
            color: #8a8a96;
            cursor: pointer;
        }
        .auth-error { color: #ff453a; font-size: 13px; margin-top: 10px; height: 15px; font-weight: 500; }

        #user-info {
            position: absolute;
            top: 55px; right: 15px;
            background: rgba(18, 18, 22, 0.9);
            border: 1px solid #3a3a44;
            color: #e8e8ed;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 10;
            display: none;
            text-align: right;
            line-height: 1.5;
        }
        #highscore-display { color: #f0b429; font-weight: bold; }
        #logout-btn {
            color: #ff453a;
            cursor: pointer;
            font-size: 11px;
            margin-top: 4px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="topbar">
    <a href="index.html">← 返回首页</a>
</div>

<div id="user-info">
    <div id="username-display">未登录</div>
    <div id="highscore-display">蜡烛: 0</div>
    <span id="logout-btn">退出登录</span>
</div>

<canvas id="gameCanvas" width="360" height="600"></canvas>

<div id="auth-modal">
    <div class="auth-box">
        <h2 id="auth-title">干员登录</h2>
        <input type="text" id="username" placeholder="干员代号" autocomplete="off">
        <input type="password" id="password" placeholder="密码" autocomplete="off">
        <button class="auth-btn" id="btn-auth-submit">登 录</button>
        <div class="auth-switch" id="auth-switch">没有账号？去注册</div>
        <div class="auth-error" id="auth-error"></div>
    </div>
</div>

<script>
    // ================= 账号系统 =================
    const authModal = document.getElementById('auth-modal');
    const authTitle = document.getElementById('auth-title');
    const inputUser = document.getElementById('username');
    const inputPass = document.getElementById('password');
    const btnSubmit = document.getElementById('btn-auth-submit');
    const authSwitch = document.getElementById('auth-switch');
    const authError = document.getElementById('auth-error');
    const userInfoBar = document.getElementById('user-info');
    const usernameDisplay = document.getElementById('username-display');
    const highscoreDisplay = document.getElementById('highscore-display');
    const logoutBtn = document.getElementById('logout-btn');

    let isLoginMode = true;
    let currentUser = null;

    function checkAuth() {
        const savedUser = localStorage.getItem('bird_current_user');
        if (savedUser) {
            currentUser = savedUser;
            authModal.style.display = 'none';
            updateUserInfoUI();
        } else {
            authModal.style.display = 'flex';
        }
    }

    authSwitch.addEventListener('click', () => {
        isLoginMode = !isLoginMode;
        authTitle.textContent = isLoginMode ? '干员登录' : '干员注册';
        btnSubmit.textContent = isLoginMode ? '登 录' : '注 册';
        authSwitch.textContent = isLoginMode ? '没有账号？去注册' : '已有账号？去登录';
        authError.textContent = '';
    });

    btnSubmit.addEventListener('click', () => {
        const u = inputUser.value.trim();
        const p = inputPass.value.trim();
        authError.textContent = '';
        if (!u || !p) { authError.textContent = '代号和密码不能为空'; return; }

        let users = JSON.parse(localStorage.getItem('bird_users') || '{}');

        if (isLoginMode) {
            if (!users[u]) authError.textContent = '该干员不存在';
            else if (users[u].password !== p) authError.textContent = '密码错误';
            else {
                currentUser = u;
                localStorage.setItem('bird_current_user', u);
                authModal.style.display = 'none';
                updateUserInfoUI();
            }
        } else {
            if (users[u]) authError.textContent = '该代号已被注册';
            else {
                users[u] = { password: p, highScore: 0 };
                localStorage.setItem('bird_users', JSON.stringify(users));
                authError.style.color = '#34c759';
                authError.textContent = '注册成功！请登录';
                isLoginMode = true;
                authTitle.textContent = '干员登录';
                btnSubmit.textContent = '登 录';
                authSwitch.textContent = '没有账号？去注册';
            }
        }
    });

    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('bird_current_user');
        currentUser = null;
        userInfoBar.style.display = 'none';
        authModal.style.display = 'flex';
        inputPass.value = '';
        score = 0;
        currentState = State.START;
    });

    function updateUserInfoUI() {
        if (!currentUser) return;
        userInfoBar.style.display = 'block';
        usernameDisplay.textContent = `🦅 ${currentUser}`;
        let users = JSON.parse(localStorage.getItem('bird_users') || '{}');
        highscoreDisplay.textContent = `蜡烛: ${users[currentUser].highScore || 0}`;
    }

    function getCurrentUserHighScore() {
        if (!currentUser) return 0;
        let users = JSON.parse(localStorage.getItem('bird_users') || '{}');
        return users[currentUser]?.highScore || 0;
    }

    function saveHighScore(newScore) {
        if (!currentUser) return;
        let users = JSON.parse(localStorage.getItem('bird_users') || '{}');
        if (newScore > (users[currentUser].highScore || 0)) {
            users[currentUser].highScore = newScore;
            localStorage.setItem('bird_users', JSON.stringify(users));
            updateUserInfoUI();
            return true;
        }
        return false;
    }

    // ================= 渡鸦游戏核心 =================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const State = { START: 0, PLAYING: 1, GAMEOVER: 2 };
    let currentState = State.START;

    const CONFIG = {
        gravity: 0.25,
        jumpForce: -4.5,
        pipeWidth: 50,
        pipeGap: 140,
        pipeSpeed: 2.5,
        pipeSpawnInterval: 90,
        groundHeight: 60
    };

    let score = 0;
    let frames = 0;
    let isNewRecord = false;

    // 渡鸦嘲讽台词（死亡时随机弹出一句）
    const ravenTaunts = [
        "皇室特供，欢迎品尝。",
        "游戏开始了，小老鼠们。",
        "这点藏品，也配喂渡鸦？",
        "蜡烛灭了，你也该走了。",
        "疯批王子，从不做亏本买卖。"
    ];
    let deathTaunt = "";

    // 渡鸦方块
    const bird = {
        x: 60,
        y: canvas.height / 2,
        size: 24,
        velocity: 0,
        rotation: 0,
        reset: function() {
            this.y = canvas.height / 2;
            this.velocity = 0;
            this.rotation = 0;
        },
        update: function() {
            if (currentState === State.PLAYING) {
                this.velocity += CONFIG.gravity;
                this.y += this.velocity;
                this.rotation = this.velocity < 0 ? -0.2 : Math.min(Math.PI / 4, this.velocity * 0.05);
            }
        },
        draw: function() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);

            // 渡鸦本体：黑灰渐变方块（对应渡鸦的战术面具色调）
            const grad = ctx.createLinearGradient(-this.size/2, -this.size/2, this.size/2, this.size/2);
            grad.addColorStop(0, '#2a2a32');
            grad.addColorStop(1, '#0d0d10');
            ctx.fillStyle = grad;
            ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);

            // 细边框，增加战术感
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#4a4a56';
            ctx.strokeRect(-this.size / 2, -this.size / 2, this.size, this.size);

            // 渡鸦的“面具”符号：白色小矩形作为眼睛/面具标识
            ctx.fillStyle = '#e8e8ed';
            ctx.fillRect(-4, -6, 8, 6);
            // 面具上的黑色细线（类似全覆盖式面具的观察缝）
            ctx.fillStyle = '#0d0d10';
            ctx.fillRect(-3, -4, 6, 1.5);

            ctx.restore();
        }
    };

    let pipes = [];
    function spawnPipe() {
        let minHeight = 40;
        let maxHeight = canvas.height - CONFIG.groundHeight - CONFIG.pipeGap - minHeight;
        let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
        pipes.push({
            x: canvas.width,
            topHeight: topHeight,
            bottomHeight: canvas.height - CONFIG.groundHeight - topHeight - CONFIG.pipeGap,
            passed: false
        });
    }

    // 障碍物：渡鸦的“毒雾屏障”（对应迷幻毒雾）
    function drawPipe(x, y, width, height) {
        // 深紫色渐变，象征致幻毒雾
        const grad = ctx.createLinearGradient(x, y, x + width, y + height);
        grad.addColorStop(0, '#1f1428');
        grad.addColorStop(1, '#0f0a14');
        ctx.fillStyle = grad;
        ctx.fillRect(x, y, width, height);

        // 毒雾的“边缘光”，让黑色矩形不至于完全隐形
        ctx.strokeStyle = 'rgba(120, 80, 180, 0.35)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x, y, width, height);

        // 内部纹理线，增加战术屏障的质感
        ctx.strokeStyle = 'rgba(120, 80, 180, 0.12)';
        ctx.lineWidth = 1;
        for (let i = 8; i < height; i += 16) {
            ctx.beginPath();
            ctx.moveTo(x + 4, y + i);
            ctx.lineTo(x + width - 4, y + i);
            ctx.stroke();
        }
    }

    function drawBackground() {
        // 极简暗色背景，不画任何东西（canvas 底色已经是 #121216）
    }

    function drawGround() {
        // 底部警戒线：暗红/琥珀色细线
        ctx.fillStyle = '#f0b429';
        ctx.fillRect(0, canvas.height - CONFIG.groundHeight, canvas.width, 1.5);
    }

    function checkCollision(pipe) {
        let birdLeft = bird.x - bird.size / 2;
        let birdRight = bird.x + bird.size / 2;
        let birdTop = bird.y - bird.size / 2;
        let birdBottom = bird.y + bird.size / 2;

        let pipeTopRect = { x: pipe.x, y: 0, w: CONFIG.pipeWidth, h: pipe.topHeight };
        let pipeBottomRect = { x: pipe.x, y: canvas.height - CONFIG.groundHeight - pipe.bottomHeight, w: CONFIG.pipeWidth, h: pipe.bottomHeight };

        function rectIntersect(r1, r2) {
            return !(r2.x > r1.x + bird.size || r2.x + r2.w < r1.x || r2.y > r1.y + bird.size || r2.y + r2.h < r1.y);
        }

        let birdRect = { x: birdLeft, y: birdTop, w: bird.size, h: bird.size };
        return rectIntersect(birdRect, pipeTopRect) || rectIntersect(birdRect, pipeBottomRect);
    }

    function gameLoop() {
        bird.update();

        if (currentState === State.PLAYING) {
            frames++;
            if (frames % CONFIG.pipeSpawnInterval === 0) spawnPipe();

            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                p.x -= CONFIG.pipeSpeed;
                if (!p.passed && p.x + CONFIG.pipeWidth < bird.x) { p.passed = true; score++; }
                if (checkCollision(p)) {
                    currentState = State.GAMEOVER;
                    deathTaunt = ravenTaunts[Math.floor(Math.random() * ravenTaunts.length)];
                }
                if (p.x + CONFIG.pipeWidth < 0) pipes.splice(i, 1);
            }

            if (bird.y + bird.size / 2 >= canvas.height - CONFIG.groundHeight || bird.y - bird.size / 2 <= 0) {
                currentState = State.GAMEOVER;
                deathTaunt = ravenTaunts[Math.floor(Math.random() * ravenTaunts.length)];
            }
        } else if (currentState === State.GAMEOVER) {
            if (bird.y + bird.size / 2 < canvas.height - CONFIG.groundHeight) {
                bird.velocity += CONFIG.gravity;
                bird.y += bird.velocity;
            } else if (isNewRecord) {
                isNewRecord = saveHighScore(score);
            }
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();

        pipes.forEach(p => {
            drawPipe(p.x, 0, CONFIG.pipeWidth, p.topHeight);
            drawPipe(p.x, canvas.height - CONFIG.groundHeight - p.bottomHeight, CONFIG.pipeWidth, p.bottomHeight);
        });

        drawGround();
        bird.draw();

        // 计分板
        ctx.fillStyle = '#f0b429';
        ctx.font = 'bold 36px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        if (currentState === State.PLAYING) {
            ctx.fillText(score, canvas.width / 2, 45);
        }

        if (currentState === State.START) {
            ctx.fillStyle = 'rgba(10, 10, 12, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#e8e8ed';
            ctx.font = 'bold 26px -apple-system, sans-serif';
            ctx.fillText('渡 鸦', canvas.width / 2, canvas.height / 2 - 70);
            ctx.font = '14px -apple-system, sans-serif';
            ctx.fillStyle = '#8a8a96';
            ctx.fillText('点击或按空格 开始供奉蜡烛', canvas.width / 2, canvas.height / 2 + 20);
            ctx.fillStyle = '#4a4a56';
            ctx.font = '12px -apple-system, sans-serif';
            ctx.fillText('“游戏开始了，小老鼠们。”', canvas.width / 2, canvas.height / 2 + 60);
        } else if (currentState === State.GAMEOVER) {
            if (isNewRecord === false && bird.y + bird.size / 2 >= canvas.height - CONFIG.groundHeight) {
                isNewRecord = saveHighScore(score);
            }

            ctx.fillStyle = 'rgba(10, 10, 12, 0.9)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff453a';
            ctx.font = 'bold 28px -apple-system, sans-serif';
            ctx.fillText('蜡烛全灭', canvas.width / 2, canvas.height / 2 - 90);

            // 渡鸦嘲讽台词
            ctx.fillStyle = '#8a8a96';
            ctx.font = 'italic 14px -apple-system, sans-serif';
            ctx.fillText(`“${deathTaunt}”`, canvas.width / 2, canvas.height / 2 - 45);

            ctx.fillStyle = '#e8e8ed';
            ctx.font = 'bold 22px -apple-system, sans-serif';
            ctx.fillText(`本局蜡烛: ${score}`, canvas.width / 2, canvas.height / 2 + 10);

            let high = getCurrentUserHighScore();
            if (score >= high && score > 0) {
                ctx.fillStyle = '#f0b429';
                ctx.fillText('🎉 新纪录', canvas.width / 2, canvas.height / 2 + 50);
            } else {
                ctx.fillStyle = '#8a8a96';
                ctx.fillText(`最佳纪录: ${high}`, canvas.width / 2, canvas.height / 2 + 50);
            }

            ctx.fillStyle = '#2e5bff';
            ctx.font = '16px -apple-system, sans-serif';
            ctx.fillText('点击重试', canvas.width / 2, canvas.height / 2 + 100);
        }
        requestAnimationFrame(gameLoop);
    }

    function handleInput() {
        if (!currentUser) { authModal.style.display = 'flex'; return; }

        if (currentState === State.START) {
            currentState = State.PLAYING;
            bird.velocity = CONFIG.jumpForce;
        } else if (currentState === State.PLAYING) {
            bird.velocity = CONFIG.jumpForce;
        } else if (currentState === State.GAMEOVER) {
            currentState = State.START;
            bird.reset(); pipes = []; score = 0; frames = 0; isNewRecord = false;
        }
    }

    canvas.addEventListener('mousedown', (e) => { e.preventDefault(); handleInput(); });
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(); }, { passive: false });
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') { e.preventDefault(); handleInput(); }
    });

    checkAuth();
    gameLoop();
</script>
</body>
</html>
