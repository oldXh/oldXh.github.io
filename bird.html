<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 定位练习 - Aim Trainer Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050508; height: 100vh; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }
        .topbar {
            position: fixed; left: 0; top: 0; width: 100%; height: 42px;
            background: linear-gradient(90deg, rgba(30,58,138,0.6) 0%, rgba(37,99,235,0.7) 50%, rgba(30,58,138,0.6) 100%);
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; backdrop-filter: blur(6px);
        }
        .topbar a {
            color: #fff; text-decoration: none; font-size: 16px;
            font-family: "Songti SC", "SimSun", serif;
            letter-spacing: 0.15em; transition: transform 0.2s ease;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }
        .topbar a:hover { transform: scale(1.15); }
        #game-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; cursor: none; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 20px; height: 20px;
            pointer-events: none; z-index: 10;
            opacity: 0; transition: opacity 0.3s;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #60a5fa; }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
        #crosshair .dot { position: absolute; top: 8px; left: 8px; width: 4px; height: 4px; background: #fff; border-radius: 50%; }
        #hud {
            position: absolute; top: 60px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
            pointer-events: none; z-index: 10;
            color: #f2ead8; font-size: 20px;
            opacity: 0; transition: opacity 0.3s;
        }
        #hud span { color: #60a5fa; font-weight: bold; font-size: 28px; }
        #accuracy { font-size: 14px; color: #cdbf9e; margin-top: 5px;}
        #overlay {
            position: absolute; inset: 0;
            background: rgba(5, 5, 8, 0.85); backdrop-filter: blur(8px);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100; color: #f2ead8; transition: opacity 0.3s;
        }
        #overlay.hidden { opacity: 0; pointer-events: none; }
        #overlay h1 { font-size: 36px; letter-spacing: 4px; margin-bottom: 10px; }
        #overlay p { color: #cdbf9e; margin-bottom: 20px; font-size: 15px; letter-spacing: 1px; text-align: center; line-height: 1.6; }
        .settings-panel {
            display: flex; gap: 30px; margin-bottom: 30px;
            background: rgba(255,255,255,0.03);
            padding: 20px 40px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .setting-item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .setting-item label { font-size: 14px; color: #8a8a96; letter-spacing: 1px; }
        .setting-item span { color: #60a5fa; font-weight: bold; font-size: 16px; }
        .select-wrapper { position: relative; display: inline-block; }
        .select-wrapper::after {
            content: '▼'; font-size: 10px; color: #cdbf9e;
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none;
        }
        select {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 220, 150, 0.3);
            border-radius: 8px; padding: 8px 30px 8px 16px;
            color: #f2ead8; font-size: 15px; outline: none;
            cursor: pointer; appearance: none; -webkit-appearance: none;
            transition: all 0.3s ease; font-family: inherit;
        }
        select:hover, select:focus { border-color: rgba(96, 165, 250, 0.8); box-shadow: 0 0 15px rgba(96, 165, 250, 0.3); }
        select option { background: #1c1c20; color: #f2ead8; }
        input[type=range] { -webkit-appearance: none; width: 150px; background: transparent; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb {
            height: 18px; width: 18px; border-radius: 50%; background: #60a5fa;
            cursor: pointer; -webkit-appearance: none; margin-top: -6px;
            box-shadow: 0 0 10px rgba(96,165,250,0.5);
        }
        .stats-box { display: flex; gap: 40px; margin-bottom: 30px; text-align: center; }
        .stats-box div { font-size: 16px; color: #8a8a96; }
        .stats-box strong { display: block; font-size: 32px; color: #60a5fa; margin-top: 5px; }
        .btn {
            padding: 14px 48px; background: rgba(37, 99, 235, 0.2);
            border: 1px solid rgba(96, 165, 250, 0.5); color: #60a5fa;
            border-radius: 30px; font-size: 18px; letter-spacing: 2px;
            cursor: pointer; transition: all 0.3s; font-family: inherit;
        }
        .btn:hover { background: rgba(37, 99, 235, 0.5); color: #fff; box-shadow: 0 0 20px rgba(96, 165, 250, 0.4); }
        .hit-marker {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(1);
            color: #ff453a; font-size: 24px; font-weight: bold;
            pointer-events: none; z-index: 11; opacity: 0;
            transition: opacity 0.1s, transform 0.1s;
        }
        .hit-marker.active { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    </style>
</head>
<body>

<div class="topbar">
    <a href="index.html">← 返回首页</a>
</div>

<div id="game-container"></div>
<div id="crosshair"><div class="dot"></div></div>
<div class="hit-marker" id="hit-marker">×</div>

<div id="hud">
    <div>命中: <span id="score">0</span><div id="accuracy">准确率: 100%</div></div>
    <div>时间: <span id="time">30</span>s</div>
</div>

<div id="overlay">
    <h1>3D 定位训练</h1>
    <p>移动鼠标控制视角，<strong>点击左键</strong>射击蓝色靶子。<br>建议使用电脑游玩。</p>
    
    <div class="settings-panel">
        <div class="setting-item">
            <label>鼠标灵敏度</label>
            <div style="display:flex; align-items:center; gap:10px;">
                <input type="range" id="sens-slider" min="0.5" max="5.0" step="0.1" value="2.0">
                <span id="sens-value">2.0</span>
            </div>
        </div>
        <div class="setting-item">
            <label>选择主武器</label>
            <div class="select-wrapper">
                <select id="gun-select">
                    <option value="ak47">AK-47</option>
                    <option value="guardian">戍卫 (Guardian)</option>
                </select>
            </div>
        </div>
    </div>

    <div id="result-stats" class="stats-box" style="display:none;">
        <div>最终得分<strong id="final-score">0</strong></div>
        <div>命中率<strong id="final-accuracy">0%</strong></div>
    </div>
    
    <button class="btn" id="btn-start">点击开始</button>
</div>

<script>
    const container = document.getElementById('game-container');
    const overlay = document.getElementById('overlay');
    const btnStart = document.getElementById('btn-start');
    const crosshair = document.getElementById('crosshair');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const accEl = document.getElementById('accuracy');
    const hitMarker = document.getElementById('hit-marker');
    const finalScoreEl = document.getElementById('final-score');
    const finalAccuracyEl = document.getElementById('final-accuracy');
    const resultStats = document.getElementById('result-stats');
    const sensSlider = document.getElementById('sens-slider');
    const sensValue = document.getElementById('sens-value');
    const gunSelect = document.getElementById('gun-select');

    let scene, camera, renderer, raycaster;
    let targets = [];
    let isPlaying = false;
    let score = 0, shotsFired = 0, shotsHit = 0, timeLeft = 30;
    let timerInterval;

    let yaw = 0, pitch = 0; 
    let userSensitivity = parseFloat(localStorage.getItem('aim_sens')) || 2.0;
    let mouseSensitivity = userSensitivity * 0.001;
    let isLocked = false;

    // 武器视图组
    let viewModelGroup = new THREE.Group();
    let currentGunMesh = null;
    
    // 动效参数
    let bobTime = 0;
    let recoilOffset = 0;
    // 基础位置（靠右下角）
    const BASE_POS = { x: 0.25, y: -0.22, z: -0.5 }; 
    const BASE_ROT = { x: 0.05, y: -0.1, z: 0 };

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0c);
        scene.fog = new THREE.FogExp2(0x0a0a0c, 0.02);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);
        camera.rotation.order = 'YXZ';
        
        camera.add(viewModelGroup);
        viewModelGroup.position.set(BASE_POS.x, BASE_POS.y, BASE_POS.z);
        viewModelGroup.rotation.set(BASE_ROT.x, BASE_ROT.y, BASE_ROT.z);
        scene.add(camera); 

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(1, 2, 1);
        camera.add(dirLight); // 跟随相机的光，保证枪械永远明亮

        // 靶场网格
        const gridHelper = new THREE.GridHelper(100, 100, 0x1c1c20, 0x111116);
        scene.add(gridHelper);

        raycaster = new THREE.Raycaster();

        window.addEventListener('resize', onWindowResize);
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mousedown', onMouseDown);
        document.addEventListener('pointerlockchange', onPointerLockChange);
        
        sensSlider.value = userSensitivity;
        sensValue.textContent = userSensitivity.toFixed(1);
        
        switchGun(gunSelect.value);
    }

    // ================= 材质定义 =================
    const matSkin = new THREE.MeshStandardMaterial({ color: 0xffe4e1, roughness: 0.4, metalness: 0.05 }); // 少女肤色
    const matNail = new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.1, metalness: 0.2 }); // 指甲油
    const matGunBlack = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4, metalness: 0.8 });
    const matGunWood = new THREE.MeshStandardMaterial({ color: 0x6b3e1b, roughness: 0.7, metalness: 0.1 });
    const matGunWhite = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.2, metalness: 0.7 });
    const matGunGold = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.3, metalness: 0.9 });
    const matGunGlow = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00aaff, emissiveIntensity: 1.5 });

    // ================= 辅助建模函数 =================
    function createBox(w, h, d, material, pos=[0,0,0], rot=[0,0,0]) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
        mesh.position.set(...pos);
        mesh.rotation.set(...rot);
        return mesh;
    }
    function createCylinder(rTop, rBottom, height, material, pos=[0,0,0], rot=[0,0,0]) {
        const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBottom, height, 16), material);
        mesh.position.set(...pos);
        mesh.rotation.set(...rot);
        return mesh;
    }

    // ================= 构建右手 (握把) =================
    function buildRightHand(gripPos, gripRot) {
        const handGroup = new THREE.Group();
        
        // 手腕与手背
        const wrist = createCylinder(0.03, 0.04, 0.15, matSkin, [0, -0.08, 0.05], [Math.PI/4, 0, 0]);
        const palm = createBox(0.06, 0.08, 0.05, matSkin, [0, 0, 0]);
        handGroup.add(wrist, palm);

        // 手指 (环绕握把)
        for(let i=0; i<4; i++) {
            const finger = createCylinder(0.012, 0.012, 0.06, matSkin, [0.02, -0.02 - i*0.018, -0.02], [0, 0, -0.6]);
            const nail = createBox(0.012, 0.012, 0.01, matNail, [0.04, -0.02 - i*0.018, -0.02], [0, 0, -0.6]);
            handGroup.add(finger, nail);
        }
        // 大拇指
        const thumb = createCylinder(0.014, 0.014, 0.05, matSkin, [-0.03, 0.02, -0.01], [0, 0, 0.8]);
        handGroup.add(thumb);

        handGroup.position.set(...gripPos);
        handGroup.rotation.set(...gripRot);
        return handGroup;
    }

    // ================= 构建左手 (托护木) =================
    function buildLeftHand(foregripPos, foregripRot) {
        const handGroup = new THREE.Group();
        
        const wrist = createCylinder(0.03, 0.04, 0.2, matSkin, [0, -0.1, 0.1], [Math.PI/3, 0.5, 0]);
        const palm = createBox(0.05, 0.06, 0.07, matSkin, [0, 0, 0]);
        handGroup.add(wrist, palm);

        // 手指 (平铺托住)
        for(let i=0; i<4; i++) {
            const finger = createCylinder(0.011, 0.011, 0.06, matSkin, [0.02, 0, -0.03 + i*0.02], [Math.PI/2, 0, 0]);
            const nail = createBox(0.01, 0.01, 0.012, matNail, [0.02, 0, -0.06 + i*0.02], [Math.PI/2, 0, 0]);
            handGroup.add(finger, nail);
        }

        handGroup.position.set(...foregripPos);
        handGroup.rotation.set(...foregripRot);
        return handGroup;
    }

    // ================= 构建 AK47 =================
    function buildAK47() {
        const group = new THREE.Group();
        
        // 枪体核心
        const receiver = createBox(0.05, 0.08, 0.3, matGunBlack, [0, 0, 0]);
        // 枪管
        const barrel = createCylinder(0.012, 0.012, 0.4, matGunBlack, [0, 0.02, -0.35], [Math.PI/2, 0, 0]);
        // 导气管
        const gasTube = createCylinder(0.01, 0.01, 0.2, matGunBlack, [0, 0.05, -0.2], [Math.PI/2, 0, 0]);
        // 木质护木
        const handguard = createBox(0.045, 0.05, 0.15, matGunWood, [0, 0.01, -0.18]);
        // 弯曲弹匣 (用几个方块错位模拟)
        const mag1 = createBox(0.035, 0.1, 0.06, matGunBlack, [0, -0.08, 0.02], [0.2, 0, 0]);
        const mag2 = createBox(0.035, 0.1, 0.06, matGunBlack, [0, -0.16, 0.06], [0.5, 0, 0]);
        // 木质枪托
        const stock = createBox(0.04, 0.06, 0.2, matGunWood, [0, -0.02, 0.22]);
        // 照门/准星
        const sight = createBox(0.015, 0.03, 0.02, matGunBlack, [0, 0.06, -0.1]);

        group.add(receiver, barrel, gasTube, handguard, mag1, mag2, stock, sight);

        // 装配手模
        // 右手握把 (机匣后方下方)
        group.add(buildRightHand([0, -0.08, 0.1], [0, 0, 0]));
        // 左手托护木 (木制部分下方)
        group.add(buildLeftHand([0, -0.05, -0.18], [0, 0, 0]));

        return group;
    }

    // ================= 构建 戍卫 (Guardian) =================
    function buildGuardian() {
        const group = new THREE.Group();
        
        // 主体 (拼接白色的模块)
        const bodyBack = createBox(0.06, 0.09, 0.15, matGunWhite, [0, 0, 0.1]);
        const bodyMid = createBox(0.055, 0.08, 0.2, matGunBlack, [0, 0, -0.08]);
        const bodyFront = createBox(0.06, 0.07, 0.15, matGunWhite, [0, 0, -0.25]);
        
        // 枪管
        const barrel = createCylinder(0.01, 0.01, 0.25, matGunBlack, [0, 0.01, -0.4], [Math.PI/2, 0, 0]);
        
        // 瞄准镜
        const scopeBase = createBox(0.03, 0.03, 0.15, matGunBlack, [0, 0.06, -0.05]);
        const scope = createCylinder(0.025, 0.025, 0.15, matGunBlack, [0, 0.08, -0.05], [Math.PI/2, 0, 0]);
        const scopeLens = createCylinder(0.02, 0.02, 0.01, matGunGlow, [0, 0.08, -0.12], [Math.PI/2, 0, 0]);

        // 侧边发光条与金色点缀
        const glowStripL = createBox(0.005, 0.02, 0.15, matGunGlow, [0.032, 0, -0.08]);
        const glowStripR = createBox(0.005, 0.02, 0.15, matGunGlow, [-0.032, 0, -0.08]);
        const goldAccent = createBox(0.065, 0.02, 0.08, matGunGold, [0, -0.01, -0.1]);

        // 弹匣
        const mag = createBox(0.035, 0.1, 0.06, matGunBlack, [0, -0.08, -0.02], [0.1, 0, 0]);

        group.add(bodyBack, bodyMid, bodyFront, barrel, scopeBase, scope, scopeLens, glowStripL, glowStripR, goldAccent, mag);

        // 装配手模
        // 右手握把
        group.add(buildRightHand([0, -0.08, 0.1], [0, 0, 0]));
        // 左手托护木
        group.add(buildLeftHand([0, -0.05, -0.25], [0, 0, 0]));

        return group;
    }

    function switchGun(type) {
        if (currentGunMesh) viewModelGroup.remove(currentGunMesh);
        currentGunMesh = (type === 'ak47') ? buildAK47() : buildGuardian();
        // 统一缩放比例，防止太占屏幕
        currentGunMesh.scale.set(0.8, 0.8, 0.8); 
        viewModelGroup.add(currentGunMesh);
    }

    // ================= 交互控制 =================
    gunSelect.addEventListener('change', (e) => switchGun(e.target.value));
    sensSlider.addEventListener('input', (e) => {
        userSensitivity = parseFloat(e.target.value);
        mouseSensitivity = userSensitivity * 0.001;
        sensValue.textContent = userSensitivity.toFixed(1);
        localStorage.setItem('aim_sens', userSensitivity);
    });

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    function onPointerLockChange() {
        if (document.pointerLockElement === renderer.domElement) isLocked = true;
        else { isLocked = false; if (isPlaying) endGame(); }
    }
    function onMouseMove(e) {
        if (!isLocked || !isPlaying) return;
        yaw -= (e.movementX || 0) * mouseSensitivity;
        pitch -= (e.movementY || 0) * mouseSensitivity;
        pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;
    }
    function onMouseDown(e) {
        if (e.button !== 0 || !isLocked || !isPlaying) return;
        recoilOffset = 0.05; // 开火后退距离
        shotsFired++;
        updateAccuracy();

        raycaster.setFromCamera({ x: 0, y: 0 }, camera);
        const intersects = raycaster.intersectObjects(targets);

        if (intersects.length > 0) {
            shotsHit++;
            score++;
            scoreEl.textContent = score;
            updateAccuracy();
            hitMarker.classList.add('active');
            setTimeout(() => hitMarker.classList.remove('active'), 100);
            const hitTarget = intersects[0].object;
            scene.remove(hitTarget);
            targets = targets.filter(t => t !== hitTarget);
            spawnTarget();
        }
    }

    // ================= 游戏流程 =================
    function spawnTarget() {
        const radius = Math.random() * 0.3 + 0.4; 
        const geometry = new THREE.SphereGeometry(radius, 32, 32);
        const material = new THREE.MeshStandardMaterial({
            color: 0x2e5bff, emissive: 0x60a5fa, emissiveIntensity: 0.8, roughness: 0.2, metalness: 0.8
        });
        const sphere = new THREE.Mesh(geometry, material);
        const distance = Math.random() * 10 + 10;
        const angleY = (Math.random() - 0.5) * Math.PI / 2;
        const angleX = (Math.random() - 0.5) * 0.8;
        sphere.position.x = Math.sin(angleY) * Math.cos(angleX) * distance;
        sphere.position.y = Math.sin(angleX) * distance + 1.6;
        sphere.position.z = -Math.cos(angleY) * Math.cos(angleX) * distance;
        scene.add(sphere);
        targets.push(sphere);
    }

    function startGame() {
        score = 0; shotsFired = 0; shotsHit = 0; timeLeft = 30;
        scoreEl.textContent = score; timeEl.textContent = Math.ceil(timeLeft);
        updateAccuracy();
        targets.forEach(t => scene.remove(t));
        targets = [];
        yaw = 0; pitch = 0; camera.rotation.set(0, 0, 0);
        for (let i = 0; i < 3; i++) spawnTarget();
        overlay.classList.add('hidden');
        crosshair.style.opacity = 1;
        hud.style.opacity = 1;
        isPlaying = true;
        renderer.domElement.requestPointerLock();
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!isPlaying) return;
            timeLeft -= 1;
            timeEl.textContent = timeLeft;
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function endGame() {
        isPlaying = false;
        clearInterval(timerInterval);
        document.exitPointerLock();
        crosshair.style.opacity = 0; hud.style.opacity = 0;
        overlay.classList.remove('hidden');
        overlay.querySelector('h1').textContent = '训练结束';
        overlay.querySelector('p').style.display = 'none';
        resultStats.style.display = 'flex';
        finalScoreEl.textContent = score;
        finalAccuracyEl.textContent = accEl.textContent.replace('准确率: ', '');
        btnStart.textContent = '再试一次';
    }

    function updateAccuracy() {
        if (shotsFired === 0) { accEl.textContent = '准确率: 100%'; return; }
        const acc = Math.round((shotsHit / shotsFired) * 100);
        accEl.textContent = `准确率: ${acc}%`;
    }

    // ================= 渲染与动效 =================
    function animate() {
        requestAnimationFrame(animate);
        
        // 靶子浮动
        const time = Date.now() * 0.002;
        targets.forEach((t, index) => { t.position.y += Math.sin(time + index) * 0.002; });

        // 枪械动效
        if (isPlaying && currentGunMesh) {
            bobTime += 0.05;
            // 呼吸摇摆
            const swayX = Math.sin(bobTime) * 0.002;
            const swayY = Math.cos(bobTime * 2) * 0.002;
            
            // 后坐力平滑恢复
            recoilOffset = THREE.MathUtils.lerp(recoilOffset, 0, 0.15);

            // 应用位置偏移：基础位置 + 摇摆 + 后坐力
            viewModelGroup.position.x = BASE_POS.x + swayX;
            viewModelGroup.position.y = BASE_POS.y + swayY;
            // 后坐力往后退（Z轴正向移动是靠近相机，这里设置z偏移）
            viewModelGroup.position.z = BASE_POS.z + recoilOffset;
            
            // 应用旋转偏移：枪口上跳
            viewModelGroup.rotation.x = BASE_ROT.x + recoilOffset * 3;
        }

        renderer.render(scene, camera);
    }

    btnStart.addEventListener('click', startGame);
    init();
    animate();
</script>
</body>
</html>
