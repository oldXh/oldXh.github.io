<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird - Web版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
        }
        canvas {
            background-color: #4EC0CA;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-height: 100vh;
            max-width: 100vw;
            display: block;
        }
        /* 返回按钮 */
        .back-btn {
            position: absolute; top: 15px; left: 15px; 
            color: #fff; text-decoration: none; 
            background: rgba(0,0,0,0.5); padding: 8px 15px; 
            border-radius: 5px; font-size: 14px; font-family: sans-serif;
            z-index: 10; border: 1px solid rgba(255,255,255,0.2);
            transition: background 0.3s;
        }
        .back-btn:hover { background: rgba(0,0,0,0.8); }

        /* ======= 登录/注册弹窗样式 ======= */
        #auth-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s ease;
        }
        .auth-box {
            background: #1c1c20;
            border: 1px solid rgba(255, 220, 150, 0.3);
            padding: 30px;
            border-radius: 12px;
            width: 300px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            color: #f2ead8;
            font-family: "Songti SC", "SimSun", serif;
        }
        .auth-box h2 { margin-top: 0; font-family: "ZCOOL KuaiLe", cursive; letter-spacing: 2px; }
        .auth-box input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,220,150,0.2);
            border-radius: 6px;
            color: #fff;
            outline: none;
            font-family: inherit;
        }
        .auth-box input:focus { border-color: #60a5fa; }
        .auth-btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            letter-spacing: 2px;
            transition: background 0.2s;
        }
        .auth-btn:hover { background: #3b82f6; }
        .auth-switch {
            margin-top: 15px;
            font-size: 13px;
            color: #cdbf9e;
            cursor: pointer;
            text-decoration: underline;
        }
        .auth-error { color: #ef4444; font-size: 13px; margin-top: 10px; height: 15px; }

        /* 右上角用户信息栏 */
        #user-info {
            position: absolute;
            top: 15px; right: 15px;
            background: rgba(0,0,0,0.6);
            color: #FFD700;
            padding: 8px 15px;
            border-radius: 5px;
            font-family: "Songti SC", serif;
            font-size: 14px;
            z-index: 10;
            display: none; /* 默认隐藏，登录后显示 */
            border: 1px solid rgba(255, 215, 0, 0.3);
            text-align: right;
            line-height: 1.4;
        }
        #logout-btn {
            color: #ef4444;
            cursor: pointer;
            font-size: 12px;
            text-decoration: underline;
            margin-top: 4px;
            display: inline-block;
        }
    </style>
</head>
<body>

<!-- 返回首页按钮 -->
<a href="index.html" class="back-btn">← 返回首页</a>

<!-- 用户信息显示 -->
<div id="user-info">
    <div id="username-display">未登录</div>
    <div id="highscore-display">最高分: 0</div>
    <span id="logout-btn">退出登录</span>
</div>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<!-- 登录/注册遮罩层 -->
<div id="auth-modal">
    <div class="auth-box">
        <h2 id="auth-title">玩家登录</h2>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="off">
        <input type="password" id="password" placeholder="请输入密码" autocomplete="off">
        <button class="auth-btn" id="btn-auth-submit">登 录</button>
        <div class="auth-switch" id="auth-switch">没有账号？去注册</div>
        <div class="auth-error" id="auth-error"></div>
    </div>
</div>

<script>
    // ================= 账号系统逻辑 =================
    const authModal = document.getElementById('auth-modal');
    const authTitle = document.getElementById('auth-title');
    const inputUser = document.getElementById('username');
    const inputPass = document.getElementById('password');
    const btnSubmit = document.getElementById('btn-auth-submit');
    const authSwitch = document.getElementById('auth-switch');
    const authError = document.getElementById('auth-error');
    const userInfoBar = document.getElementById('user-info');
    const usernameDisplay = document.getElementById('username-display');
    const highscoreDisplay = document.getElementById('highscore-display');
    const logoutBtn = document.getElementById('logout-btn');

    let isLoginMode = true; // 当前模式：true 登录，false 注册
    let currentUser = null;

    // 初始化检查登录状态
    function checkAuth() {
        const savedUser = localStorage.getItem('bird_current_user');
        if (savedUser) {
            currentUser = savedUser;
            authModal.style.display = 'none';
            updateUserInfoUI();
        } else {
            authModal.style.display = 'flex';
        }
    }

    // 切换登录/注册模式
    authSwitch.addEventListener('click', () => {
        isLoginMode = !isLoginMode;
        authTitle.textContent = isLoginMode ? '玩家登录' : '玩家注册';
        btnSubmit.textContent = isLoginMode ? '登 录' : '注 册';
        authSwitch.textContent = isLoginMode ? '没有账号？去注册' : '已有账号？去登录';
        authError.textContent = '';
    });

    // 提交表单
    btnSubmit.addEventListener('click', () => {
        const u = inputUser.value.trim();
        const p = inputPass.value.trim();
        authError.textContent = '';

        if (!u || !p) {
            authError.textContent = '用户名和密码不能为空';
            return;
        }

        // 获取所有已注册用户
        let users = JSON.parse(localStorage.getItem('bird_users') || '{}');

        if (isLoginMode) {
            // 登录逻辑
            if (!users[u]) {
                authError.textContent = '该用户不存在';
            } else if (users[u].password !== p) {
                authError.textContent = '密码错误';
            } else {
                // 登录成功
                currentUser = u;
                localStorage.setItem('bird_current_user', u);
                authModal.style.display = 'none';
                updateUserInfoUI();
            }
        } else {
            // 注册逻辑
            if (users[u]) {
                authError.textContent = '该用户名已被注册';
            } else {
                // 创建新用户
                users[u] = { password: p, highScore: 0 };
                localStorage.setItem('bird_users', JSON.stringify(users));
                authError.style.color = '#27c93f';
                authError.textContent = '注册成功！请登录';
                isLoginMode = true;
                authTitle.textContent = '玩家登录';
                btnSubmit.textContent = '登 录';
                authSwitch.textContent = '没有账号？去注册';
            }
        }
    });

    // 退出登录
    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('bird_current_user');
        currentUser = null;
        userInfoBar.style.display = 'none';
        authModal.style.display = 'flex';
        inputPass.value = '';
        score = 0;
        currentState = State.START;
    });

    // 更新右上角UI
    function updateUserInfoUI() {
        if (!currentUser) return;
        userInfoBar.style.display = 'block';
        usernameDisplay.textContent = `👤 ${currentUser}`;
        
        let users = JSON.parse(localStorage.getItem('bird_users') || '{}');
        let high = users[currentUser].highScore || 0;
        highscoreDisplay.textContent = `最高分: ${high}`;
    }

    // 获取当前用户的最高分
    function getCurrentUserHighScore() {
        if (!currentUser) return 0;
        let users = JSON.parse(localStorage.getItem('bird_users') || '{}');
        return users[currentUser]?.highScore || 0;
    }

    // 保存最高分
    function saveHighScore(newScore) {
        if (!currentUser) return;
        let users = JSON.parse(localStorage.getItem('bird_users') || '{}');
        if (newScore > (users[currentUser].highScore || 0)) {
            users[currentUser].highScore = newScore;
            localStorage.setItem('bird_users', JSON.stringify(users));
            updateUserInfoUI();
            return true; // 破纪录了
        }
        return false;
    }

    // ================= 游戏核心逻辑 =================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const State = { START: 0, PLAYING: 1, GAMEOVER: 2 };
    let currentState = State.START;

    const CONFIG = {
        gravity: 0.25,
        jumpForce: -4.6,
        pipeWidth: 52,
        pipeGap: 130,
        pipeSpeed: 2,
        pipeSpawnInterval: 100,
        groundHeight: 90
    };

    let score = 0;
    let frames = 0;
    let bgOffset = 0;
    let groundOffset = 0;
    let isNewRecord = false;

    const bird = {
        x: 50, y: canvas.height / 2, radius: 12, velocity: 0, rotation: 0,
        reset: function() { this.y = canvas.height / 2; this.velocity = 0; this.rotation = 0; },
        update: function() {
            if (currentState === State.PLAYING) {
                this.velocity += CONFIG.gravity;
                this.y += this.velocity;
                this.rotation = this.velocity < 0 ? -0.4 : Math.min(Math.PI / 2, this.velocity * 0.1);
            }
        },
        draw: function() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);

            ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fillStyle = '#FFD700'; ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.stroke();

            ctx.beginPath(); ctx.arc(5, -4, 4, 0, Math.PI * 2); ctx.fillStyle = '#FFF'; ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(7, -4, 1.5, 0, Math.PI * 2); ctx.fillStyle = '#000'; ctx.fill();

            ctx.beginPath(); ctx.moveTo(10, 2); ctx.lineTo(18, 4); ctx.lineTo(10, 8); ctx.fillStyle = '#FF4500'; ctx.fill(); ctx.stroke();

            let wingY = currentState === State.PLAYING ? (frames % 10 < 5 ? 2 : -2) : 2;
            ctx.beginPath(); ctx.ellipse(-5, wingY, 6, 4, 0, 0, Math.PI * 2); ctx.fillStyle = '#FFF'; ctx.fill(); ctx.stroke();
            ctx.restore();
        }
    };

    let pipes = [];
    function spawnPipe() {
        let minHeight = 50;
        let maxHeight = canvas.height - CONFIG.groundHeight - CONFIG.pipeGap - minHeight;
        let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
        pipes.push({ x: canvas.width, topHeight: topHeight, bottomHeight: canvas.height - CONFIG.groundHeight - topHeight - CONFIG.pipeGap, passed: false });
    }

    function drawPipe(x, y, width, height, isTop) {
        ctx.fillStyle = '#73BF2E'; ctx.fillRect(x, y, width, height);
        ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.strokeRect(x, y, width, height);
        if (isTop) {
            ctx.fillRect(x - 2, y + height - 24, width + 4, 24); ctx.strokeRect(x - 2, y + height - 24, width + 4, 24);
        } else {
            ctx.fillRect(x - 2, y, width + 4, 24); ctx.strokeRect(x - 2, y, width + 4, 24);
        }
    }

    function drawBackground() {
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(100 - bgOffset * 0.2, 100, 30, 0, Math.PI * 2);
        ctx.arc(130 - bgOffset * 0.2, 90, 40, 0, Math.PI * 2);
        ctx.arc(160 - bgOffset * 0.2, 100, 30, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawGround() {
        ctx.fillStyle = '#DED895'; ctx.fillRect(0, canvas.height - CONFIG.groundHeight, canvas.width, CONFIG.groundHeight);
        ctx.fillStyle = '#73BF2E'; ctx.fillRect(0, canvas.height - CONFIG.groundHeight, canvas.width, 10);
        ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.strokeRect(0, canvas.height - CONFIG.groundHeight, canvas.width, 10);
        ctx.strokeStyle = '#C0B86F'; ctx.lineWidth = 4;
        for (let i = 0; i < canvas.width; i += 20) {
            ctx.beginPath(); ctx.moveTo(i - groundOffset % 20, canvas.height - CONFIG.groundHeight + 20);
            ctx.lineTo(i - groundOffset % 20 + 10, canvas.height - CONFIG.groundHeight + 20); ctx.stroke();
        }
    }

    function checkCollision(pipe) {
        let birdRect = { x: bird.x - bird.radius, y: bird.y - bird.radius, w: bird.radius * 2, h: bird.radius * 2 };
        let pipeTopRect = { x: pipe.x, y: 0, w: CONFIG.pipeWidth, h: pipe.topHeight };
        let pipeBottomRect = { x: pipe.x, y: canvas.height - CONFIG.groundHeight - pipe.bottomHeight, w: CONFIG.pipeWidth, h: pipe.bottomHeight };
        function rectIntersect(r1, r2) { return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y); }
        return rectIntersect(birdRect, pipeTopRect) || rectIntersect(birdRect, pipeBottomRect);
    }

    function gameLoop() {
        bird.update();

        if (currentState === State.PLAYING) {
            bgOffset += 0.5; groundOffset += CONFIG.pipeSpeed; frames++;
            if (frames % CONFIG.pipeSpawnInterval === 0) spawnPipe();

            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                p.x -= CONFIG.pipeSpeed;
                if (!p.passed && p.x + CONFIG.pipeWidth < bird.x) { p.passed = true; score++; }
                if (checkCollision(p)) { currentState = State.GAMEOVER; }
                if (p.x + CONFIG.pipeWidth < 0) pipes.splice(i, 1);
            }

            if (bird.y + bird.radius >= canvas.height - CONFIG.groundHeight || bird.y - bird.radius <= 0) {
                currentState = State.GAMEOVER;
            }
        } else if (currentState === State.GAMEOVER) {
            if (bird.y + bird.radius < canvas.height - CONFIG.groundHeight) {
                bird.velocity += CONFIG.gravity; bird.y += bird.velocity;
                bird.rotation = Math.min(Math.PI / 2, bird.velocity * 0.1);
            } else if (isNewRecord) {
                isNewRecord = saveHighScore(score);
            }
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();
        pipes.forEach(p => {
            drawPipe(p.x, 0, CONFIG.pipeWidth, p.topHeight, true);
            drawPipe(p.x, canvas.height - CONFIG.groundHeight - p.bottomHeight, CONFIG.pipeWidth, p.bottomHeight, false);
        });
        drawGround();
        bird.draw();

        // 显示分数
        ctx.fillStyle = '#FFF'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.font = 'bold 40px "Courier New"';
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        if (currentState === State.PLAYING) {
            ctx.strokeText(score, canvas.width / 2, 50); ctx.fillText(score, canvas.width / 2, 50);
        }

        if (currentState === State.START) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FFF'; ctx.font = 'bold 30px "Courier New"';
            ctx.strokeText('FLAPPY BIRD', canvas.width / 2, canvas.height / 2 - 60);
            ctx.fillText('FLAPPY BIRD', canvas.width / 2, canvas.height / 2 - 60);
            ctx.font = 'bold 20px "Courier New"';
            ctx.fillText('点击或按空格开始', canvas.width / 2, canvas.height / 2 + 20);
            ctx.fillText('移动端请触摸屏幕', canvas.width / 2, canvas.height / 2 + 50);
        } else if (currentState === State.GAMEOVER) {
            // 如果刚刚撞毁，判断一次是否破纪录
            if (isNewRecord === false && bird.y + bird.radius >= canvas.height - CONFIG.groundHeight) {
                isNewRecord = saveHighScore(score); // 这里会返回是否破纪录
            }

            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FFF'; ctx.font = 'bold 30px "Courier New"';
            ctx.strokeText('游戏结束', canvas.width / 2, canvas.height / 2 - 100);
            ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 100);

            ctx.font = 'bold 40px "Courier New"';
            ctx.strokeText('得分: ' + score, canvas.width / 2, canvas.height / 2 - 30);
            ctx.fillText('得分: ' + score, canvas.width / 2, canvas.height / 2 - 30);

            // 显示最高分
            ctx.font = 'bold 20px "Courier New"';
            ctx.fillStyle = '#FFD700';
            let high = getCurrentUserHighScore();
            if (score >= high && score > 0) {
                ctx.fillText('🎉 新纪录！', canvas.width / 2, canvas.height / 2 + 20);
            } else {
                ctx.fillText('最高分: ' + high, canvas.width / 2, canvas.height / 2 + 20);
            }

            ctx.fillStyle = '#FFD700'; ctx.font = 'bold 20px "Courier New"';
            ctx.fillText('点击重试', canvas.width / 2, canvas.height / 2 + 80);
        }
        requestAnimationFrame(gameLoop);
    }

    function handleInput() {
        // 如果没登录，拦截输入
        if (!currentUser) {
            authModal.style.display = 'flex';
            return;
        }

        if (currentState === State.START) {
            currentState = State.PLAYING;
            bird.velocity = CONFIG.jumpForce;
        } else if (currentState === State.PLAYING) {
            bird.velocity = CONFIG.jumpForce;
        } else if (currentState === State.GAMEOVER) {
            currentState = State.START;
            bird.reset(); pipes = []; score = 0; frames = 0; isNewRecord = false;
        }
    }

    canvas.addEventListener('mousedown', (e) => { e.preventDefault(); handleInput(); });
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(); }, { passive: false });
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') { e.preventDefault(); handleInput(); }
    });

    // 启动
    checkAuth();
    gameLoop();
</script>
</body>
</html>
