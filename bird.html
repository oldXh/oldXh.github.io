<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>渡鸦路灯</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #0a0a0c;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }

  /* ===== 统一导航栏 ===== */
  .topbar {
    position: fixed; left: 0; top: 0; width: 100%; height: 42px;
    background: linear-gradient(90deg, rgba(30,58,138,0.6) 0%, rgba(37,99,235,0.7) 50%, rgba(30,58,138,0.6) 100%);
    box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .topbar a {
    color: #fff; text-decoration: none;
    font-family: "Songti SC", "SimSun", serif;
    font-size: 16px; letter-spacing: 0.15em;
    transition: transform 0.2s ease;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .topbar a:hover { transform: scale(1.15); }

  /* ===== 主容器 ===== */
  .stage {
    position: relative;
    width: 400px; max-width: 100vw;
    height: 640px; max-height: 100vh;
    margin-top: 42px;
    background: radial-gradient(circle at 50% 30%, #1a1a22 0%, #0a0a0c 70%);
    border-radius: 12px;
    box-shadow: 0 10px 50px rgba(0,0,0,0.8);
    overflow: hidden;
    display: flex; flex-direction: column;
    color: #e8e8ed;
  }

  /* ===== 顶部状态区 ===== */
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px 8px;
    font-size: 13px; color: #8a8a96;
  }
  .candle-slots {
    display: flex; gap: 6px; align-items: center;
  }
  .candle {
    width: 10px; height: 22px;
    background: #2a2a32;
    border-radius: 3px;
    position: relative;
    transition: background 0.4s, box-shadow 0.4s;
  }
  .candle.lit {
    background: linear-gradient(to top, #f0b429, #ffdd66);
    box-shadow: 0 0 10px rgba(240, 180, 41, 0.7);
  }
  .candle.lit::after {
    content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 6px; background: #ffdd66;
    border-radius: 50%; box-shadow: 0 0 6px #ffdd66;
  }

  .risk-label {
    font-size: 12px; letter-spacing: 0.05em;
    padding: 4px 10px; border-radius: 20px;
    background: rgba(255,255,255,0.06);
    transition: color 0.3s, background 0.3s;
  }
  .risk-label[data-level="safe"]   { color: #34c759; background: rgba(52,199,89,0.1); }
  .risk-label[data-level="warn"]   { color: #f0b429; background: rgba(240,180,41,0.1); }
  .risk-label[data-level="danger"] { color: #ff453a; background: rgba(255,69,58,0.15); }

  /* ===== 渡鸦路灯视觉区 ===== */
  .raven-scene {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
    padding: 10px 20px;
  }
  .raven-silhouette {
    font-size: 64px;
    filter: drop-shadow(0 0 20px rgba(240,180,41,0.25));
    transition: transform 0.3s ease, opacity 0.3s;
    user-select: none;
  }
  .raven-silhouette.gone { transform: translateY(-40px) scale(0.6); opacity: 0; }
  .raven-taunt {
    margin-top: 8px;
    font-size: 13px; font-style: italic;
    color: #8a8a96; text-align: center;
    min-height: 20px;
    max-width: 280px;
    line-height: 1.5;
  }

  /* ===== 当前物资卡片 ===== */
  .loot-card {
    margin: 12px 20px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 16px 18px;
    display: flex; align-items: center; justify-content: space-between;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .loot-card[data-rarity="purple"] { border-color: rgba(175,130,255,0.5); box-shadow: 0 0 20px rgba(175,130,255,0.08); }
  .loot-card[data-rarity="gold"]   { border-color: rgba(240,180,41,0.5); box-shadow: 0 0 20px rgba(240,180,41,0.12); }
  .loot-card[data-rarity="red"]    { border-color: rgba(255,69,58,0.6);  box-shadow: 0 0 24px rgba(255,69,58,0.15); }

  .loot-info { display: flex; flex-direction: column; gap: 4px; }
  .loot-name { font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
  .loot-rarity { font-size: 12px; letter-spacing: 0.1em; }
  .loot-card[data-rarity="purple"] .loot-rarity { color: #af82ff; }
  .loot-card[data-rarity="gold"]   .loot-rarity { color: #f0b429; }
  .loot-card[data-rarity="red"]    .loot-rarity { color: #ff453a; }
  .loot-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .loot-value span { font-size: 12px; color: #8a8a96; font-weight: 400; margin-left: 3px; }

  /* ===== 操作按钮区 ===== */
  .actions {
    display: flex; gap: 10px;
    padding: 12px 20px 24px;
  }
  .btn {
    flex: 1;
    padding: 14px 10px;
    border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s, opacity 0.2s;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  .btn-feed {
    background: #2e5bff; color: #fff;
  }
  .btn-feed:hover:not(:disabled) { background: #4a72ff; }

  .btn-cashout {
    background: rgba(255,255,255,0.08); color: #e8e8ed;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .btn-cashout:hover:not(:disabled) { background: rgba(255,255,255,0.14); }

  .btn-new {
    background: #f0b429; color: #0a0a0c;
  }
  .btn-new:hover:not(:disabled) { background: #ffcc4d; }

  /* ===== 结算遮罩 ===== */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(10,10,12,0.92);
    backdrop-filter: blur(6px);
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    padding: 30px;
    text-align: center;
    z-index: 50;
  }
  .overlay.show { display: flex; }
  .overlay h2 { font-size: 24px; letter-spacing: 0.08em; margin-bottom: 8px; }
  .overlay .sub { font-size: 14px; color: #8a8a96; margin-bottom: 24px; line-height: 1.6; }
  .overlay .result-value {
    font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums;
    margin-bottom: 20px;
  }
  .overlay .result-value.up   { color: #34c759; }
  .overlay .result-value.down { color: #ff453a; }
  .overlay .taunt {
    font-size: 13px; font-style: italic; color: #8a8a96;
    margin-bottom: 24px; max-width: 300px; line-height: 1.6;
  }

  /* 登录框复用之前的深色风格，略 */
  #auth-modal {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(8px);
  }
  .auth-box {
    background: #1c1c22; border: 1px solid #3a3a44;
    padding: 28px 24px; border-radius: 14px; width: 300px;
    text-align: center; color: #e8e8ed;
  }
  .auth-box h2 { font-size: 20px; letter-spacing: 2px; margin-bottom: 18px; }
  .auth-box input {
    width: 100%; padding: 11px 12px; margin: 6px 0;
    background: #121216; border: 1px solid #3a3a44; border-radius: 8px;
    color: #e8e8ed; outline: none; font-size: 15px; font-family: inherit;
  }
  .auth-box input:focus { border-color: #5b8cff; }
  .auth-btn {
    width: 100%; padding: 12px; margin-top: 12px;
    background: #2e5bff; color: #fff; border: none; border-radius: 8px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .auth-switch { margin-top: 12px; font-size: 12px; color: #8a8a96; cursor: pointer; }
  .auth-error { color: #ff453a; font-size: 12px; margin-top: 8px; min-height: 16px; }

  .highscore-tag {
    position: absolute; top: 58px; right: 16px;
    font-size: 12px; color: #f0b429;
    background: rgba(18,18,22,0.8);
    padding: 5px 10px; border-radius: 6px;
    border: 1px solid rgba(240,180,41,0.2);
    z-index: 10;
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html">← 返回首页</a>
</div>

<div class="highscore-tag" id="highscore-tag">最佳撤离: —</div>

<div class="stage">

  <!-- 状态栏：蜡烛 + 风险 -->
  <div class="status-bar">
    <div class="candle-slots" id="candle-slots">
      <div class="candle"></div><div class="candle"></div><div class="candle"></div>
      <div class="candle"></div><div class="candle"></div><div class="candle"></div>
    </div>
    <span class="risk-label" id="risk-label" data-level="safe">安全</span>
  </div>

  <!-- 渡鸦场景 -->
  <div class="raven-scene">
    <div class="raven-silhouette" id="raven">🦅</div>
    <div class="raven-taunt" id="raven-taunt">“把东西放下，让我看看你的诚意。”</div>
  </div>

  <!-- 当前物资 -->
  <div class="loot-card" id="loot-card" data-rarity="purple">
    <div class="loot-info">
      <div class="loot-name" id="loot-name">紫货·战术手电</div>
      <div class="loot-rarity" id="loot-rarity">紫色品质</div>
    </div>
    <div class="loot-value"><span id="loot-value-num">1,200</span><span>哈夫币</span></div>
  </div>

  <!-- 操作按钮 -->
  <div class="actions">
    <button class="btn btn-cashout" id="btn-cashout" disabled>带着撤离</button>
    <button class="btn btn-feed" id="btn-feed">投喂渡鸦</button>
  </div>

  <!-- 结算遮罩 -->
  <div class="overlay" id="overlay">
    <h2 id="overlay-title">撤离成功</h2>
    <div class="sub" id="overlay-sub"></div>
    <div class="result-value" id="overlay-value"></div>
    <div class="taunt" id="overlay-taunt"></div>
    <button class="btn btn-new" id="btn-new" style="width:180px;">下一盏路灯</button>
  </div>

</div>

<!-- 登录框（复用逻辑，样式略调） -->
<div id="auth-modal">
  <div class="auth-box">
    <h2 id="auth-title">干员登录</h2>
    <input type="text" id="username" placeholder="干员代号" autocomplete="off">
    <input type="password" id="password" placeholder="密码" autocomplete="off">
    <button class="auth-btn" id="btn-auth-submit">登 录</button>
    <div class="auth-switch" id="auth-switch">没有账号？去注册</div>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<script>
/* ================= 账号系统（与原 bird.html 一致，仅最高分含义改为“最佳撤离价值”） ================= */
const authModal = document.getElementById('auth-modal');
const authTitle = document.getElementById('auth-title');
const inputUser = document.getElementById('username');
const inputPass = document.getElementById('password');
const btnSubmit = document.getElementById('btn-auth-submit');
const authSwitch = document.getElementById('auth-switch');
const authError = document.getElementById('auth-error');
const highscoreTag = document.getElementById('highscore-tag');

let isLoginMode = true;
let currentUser = null;

function checkAuth() {
  const savedUser = localStorage.getItem('bird_current_user');
  if (savedUser) {
    currentUser = savedUser;
    authModal.style.display = 'none';
    updateHighscoreUI();
  } else {
    authModal.style.display = 'flex';
  }
}

authSwitch.addEventListener('click', () => {
  isLoginMode = !isLoginMode;
  authTitle.textContent = isLoginMode ? '干员登录' : '干员注册';
  btnSubmit.textContent = isLoginMode ? '登 录' : '注 册';
  authSwitch.textContent = isLoginMode ? '没有账号？去注册' : '已有账号？去登录';
  authError.textContent = '';
});

btnSubmit.addEventListener('click', () => {
  const u = inputUser.value.trim();
  const p = inputPass.value.trim();
  authError.textContent = '';
  if (!u || !p) { authError.textContent = '代号和密码不能为空'; return; }

  let users = JSON.parse(localStorage.getItem('bird_users') || '{}');

  if (isLoginMode) {
    if (!users[u]) authError.textContent = '该干员不存在';
    else if (users[u].password !== p) authError.textContent = '密码错误';
    else {
      currentUser = u;
      localStorage.setItem('bird_current_user', u);
      authModal.style.display = 'none';
      updateHighscoreUI();
    }
  } else {
    if (users[u]) authError.textContent = '该代号已被注册';
    else {
      users[u] = { password: p, highScore: 0 };
      localStorage.setItem('bird_users', JSON.stringify(users));
      authError.style.color = '#34c759';
      authError.textContent = '注册成功！请登录';
      isLoginMode = true;
      authTitle.textContent = '干员登录';
      btnSubmit.textContent = '登 录';
      authSwitch.textContent = '没有账号？去注册';
    }
  }
});

function getBestValue() {
  if (!currentUser) return 0;
  const users = JSON.parse(localStorage.getItem('bird_users') || '{}');
  return users[currentUser]?.highScore || 0;
}

function saveBestValue(v) {
  if (!currentUser) return;
  const users = JSON.parse(localStorage.getItem('bird_users') || '{}');
  if (v > (users[currentUser].highScore || 0)) {
    users[currentUser].highScore = v;
    localStorage.setItem('bird_users', JSON.stringify(users));
    updateHighscoreUI();
  }
}

function updateHighscoreUI() {
  const best = getBestValue();
  highscoreTag.textContent = best > 0
    ? `最佳撤离: ${best.toLocaleString()} 哈夫币`
    : '最佳撤离: —';
}

/* ================= 渡鸦路灯博弈核心 ================= */

// 品质档位：数值区间与显示名称（模拟紫 / 金 / 红）
const RARITY = {
  purple: { label: '紫色品质', min: 800,   max: 2500,   color: '#af82ff' },
  gold:   { label: '金色品质', min: 2600,  max: 9000,   color: '#f0b429' },
  red:    { label: '红色品质', min: 9500,  max: 30000,  color: '#ff453a' }
};

const LOOT_NAMES = {
  purple: ['战术手电', '便携电台', '加密硬盘', '防弹插板', '战术匕首', '信号放大器', '夜视模块'],
  gold:   ['军用处理器', '精密陀螺仪', '钛合金箱', '目标指示器', '高级光学镜头', '无人机核心'],
  red:    ['非洲之心', '复苏呼吸机', '炫彩干员手办', '原型反应炉', '量子芯片']
};

const TAUNTS = [
  '“皇室特供，欢迎品尝。”',
  '“这点东西，也配喂渡鸦？”',
  '“游戏开始了，小老鼠。”',
  '“见好就收？你舍得吗。”',
  '“再来一次，也许就翻身了。”'
];

const MAX_CANDLES = 6;

const state = {
  candles: 0,          // 已点亮蜡烛数
  currentRarity: 'purple',
  currentValue: 0,
  currentName: '',
  lampDead: false,     // 渡鸦已飞走，这盏灯报废
  active: true         // 当前是否还能操作
};

// DOM
const candleEls = document.querySelectorAll('#candle-slots .candle');
const riskLabel = document.getElementById('risk-label');
const ravenEl = document.getElementById('raven');
const ravenTauntEl = document.getElementById('raven-taunt');
const lootCard = document.getElementById('loot-card');
const lootNameEl = document.getElementById('loot-name');
const lootRarityEl = document.getElementById('loot-rarity');
const lootValueEl = document.getElementById('loot-value-num');
const btnFeed = document.getElementById('btn-feed');
const btnCashout = document.getElementById('btn-cashout');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlaySub = document.getElementById('overlay-sub');
const overlayValue = document.getElementById('overlay-value');
const overlayTaunt = document.getElementById('overlay-taunt');
const btnNew = document.getElementById('btn-new');

/* ---------- 工具函数 ---------- */
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function pickRarityForStart() {
  // 开局固定给紫货，符合游戏设定：只能投喂紫色及以上
  return 'purple';
}

function randomLoot(rarity) {
  const r = RARITY[rarity];
  const value = rand(r.min, r.max);
  const pool = LOOT_NAMES[rarity];
  const name = pool[rand(0, pool.length - 1)];
  return { rarity, name, value };
}

function formatNum(n) { return n.toLocaleString('zh-CN'); }

/* ---------- 渲染 ---------- */
function renderCandles() {
  candleEls.forEach((el, i) => {
    el.classList.toggle('lit', i < state.candles);
  });

  const ratio = state.candles / MAX_CANDLES;
  let level = 'safe';
  if (ratio >= 0.7) level = 'danger';
  else if (ratio >= 0.4) level = 'warn';

  riskLabel.dataset.level = level;
  riskLabel.textContent = level === 'safe' ? '安全' : level === 'warn' ? '风险上升' : '高风险';
}

function renderLoot() {
  const r = RARITY[state.currentRarity];
  lootCard.dataset.rarity = state.currentRarity;
  lootNameEl.textContent = state.currentName;
  lootRarityEl.textContent = r.label;
  lootRarityEl.style.color = r.color;
  lootValueEl.textContent = formatNum(state.currentValue);
}

function renderButtons() {
  btnFeed.disabled = !state.active || state.lampDead || state.candles >= MAX_CANDLES;
  btnCashout.disabled = !state.active || state.candles === 0 || state.lampDead;
}

/* ---------- 核心：投喂判定 ---------- */
function feed() {
  if (!state.active || state.lampDead || state.candles >= MAX_CANDLES) return;

  // 消耗 1 根蜡烛的额度，先点亮
  state.candles++;
  renderCandles();

  // 当前蜡烛数对应风险：没收概率从 ~8% 线性升至 ~55%（6根时）
  const confiscateChance = 0.08 + (state.candles / MAX_CANDLES) * 0.47;
  // 升级概率：基础 45%，蜡烛每多一根 +5%，与没收概率独立判定
  const upgradeChance = 0.45 + state.candles * 0.05;

  const roll = Math.random();

  if (roll < confiscateChance) {
    // —— 整蛊没收：渡鸦叼走物资，路灯报废 ——
    state.lampDead = true;
    state.active = false;
    ravenEl.classList.add('gone');
    ravenTauntEl.textContent = '“咕——多谢款待。”';

    renderButtons();
    showOverlay('looted');
    return;
  }

  // 未没收：判定升级还是平换/降级
  const upgradeRoll = Math.random();
  let nextRarity = state.currentRarity;

  if (upgradeRoll < upgradeChance) {
    // 升级：紫→金，金→红；红不再升（封顶）
    if (state.currentRarity === 'purple') nextRarity = 'gold';
    else if (state.currentRarity === 'gold') nextRarity = 'red';
    // 红保持红，但价值可能走高，算“升级惊喜”
  } else {
    // 平换 / 降级：同档位内重新随机，有几率掉一档（但不会掉回紫色以下）
    const downgradeRoll = Math.random();
    if (downgradeRoll < 0.4) {
      // 降一档（红→金，金→紫；紫保持紫但取低值）
      if (state.currentRarity === 'red') nextRarity = 'gold';
      else if (state.currentRarity === 'gold') nextRarity = 'purple';
      else nextRarity = 'purple';
    }
    // 否则同档位重 roll
  }

  const newLoot = randomLoot(nextRarity);
  // 如果同档位且重 roll 后价值低于原值，算平换/降级，仍然接受
  state.currentRarity = newLoot.rarity;
  state.currentName = newLoot.name;
  state.currentValue = newLoot.value;

  renderLoot();
  renderButtons();

  // 渡鸦反馈台词
  const tauntPool = state.candles >= 4
    ? ['“蜡烛越多，我越饿。”', '“你还敢继续？”', '“再来一根，就告诉你。”']
    : ['“还行，继续。”', '“有点意思了。”', '“下一个。”'];
  ravenTauntEl.textContent = tauntPool[rand(0, tauntPool.length - 1)];
}

/* ---------- 撤离 ---------- */
function cashout() {
  if (!state.active || state.candles === 0 || state.lampDead) return;
  state.active = false;
  renderButtons();
  showOverlay('cashout');
}

/* ---------- 结算遮罩 ---------- */
function showOverlay(type) {
  overlay.classList.add('show');

  if (type === 'looted') {
    overlayTitle.textContent = '渡鸦带着物资飞走了';
    overlaySub.textContent = '这盏路灯的蜡烛全部熄灭，无法再投喂。';
    overlayValue.textContent = '—';
    overlayValue.className = 'result-value';
    overlayTaunt.textContent = `“${TAUNTS[rand(0, TAUNTS.length - 1)]}”`;
  } else if (type === 'cashout') {
    const best = getBestValue();
    const isNew = state.currentValue > best;
    if (isNew) saveBestValue(state.currentValue);

    overlayTitle.textContent = '撤离成功';
    overlaySub.textContent = `你带着 ${state.currentName} 离开了渡鸦路灯。`;
    overlayValue.textContent = `+${formatNum(state.currentValue)} 哈夫币`;
    overlayValue.className = 'result-value up';
    overlayTaunt.textContent = isNew ? '🎉 新的最佳撤离纪录' : `历史最佳: ${formatNum(best)} 哈夫币`;
  }
}

/* ---------- 新一局 ---------- */
function newRound() {
  state.candles = 0;
  state.lampDead = false;
  state.active = true;

  const startLoot = randomLoot('purple');
  state.currentRarity = startLoot.rarity;
  state.currentName = startLoot.name;
  state.currentValue = startLoot.value;

  ravenEl.classList.remove('gone');
  ravenTauntEl.textContent = '“把东西放下，让我看看你的诚意。”';
  overlay.classList.remove('show');

  renderCandles();
  renderLoot();
  renderButtons();
}

/* ---------- 事件绑定 ---------- */
btnFeed.addEventListener('click', feed);
btnCashout.addEventListener('click', cashout);
btnNew.addEventListener('click', newRound);

/* ---------- 启动 ---------- */
checkAuth();
newRound();
</script>
</body>
</html>
