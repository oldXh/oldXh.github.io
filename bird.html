<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 定位练习</title>
    <!-- 引入 Three.js 引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #050508;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        /* 统一导航栏 */
        .topbar {
            position: fixed; left: 0; top: 0; width: 100%; height: 42px;
            background: linear-gradient(90deg, rgba(30,58,138,0.6) 0%, rgba(37,99,235,0.7) 50%, rgba(30,58,138,0.6) 100%);
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        }
        .topbar a {
            color: #ffffff; text-decoration: none; font-size: 16px;
            font-family: "Songti SC", "SimSun", serif;
            letter-spacing: 0.15em; transition: transform 0.2s ease;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }
        .topbar a:hover { transform: scale(1.15); }

        /* 游戏画布 */
        #game-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0; left: 0;
            cursor: none; /* 隐藏默认鼠标，使用自定义准星 */
        }

        /* 自定义准星 */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 20px; height: 20px;
            pointer-events: none;
            z-index: 10;
            opacity: 0; /* 游戏开始时显示 */
            transition: opacity 0.3s;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: #60a5fa;
        }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
        #crosshair .dot {
            position: absolute; top: 8px; left: 8px; width: 4px; height: 4px;
            background: #fff; border-radius: 50%;
        }

        /* HUD 计分板 */
        #hud {
            position: absolute;
            top: 60px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
            pointer-events: none;
            z-index: 10;
            color: #f2ead8;
            font-size: 20px;
            opacity: 0; transition: opacity 0.3s;
        }
        #hud span { color: #60a5fa; font-weight: bold; font-size: 28px; }
        #accuracy { font-size: 14px; color: #cdbf9e; margin-top: 5px;}

        /* 开始 / 结算 遮罩 */
        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 5, 8, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #f2ead8;
            transition: opacity 0.3s;
        }
        #overlay.hidden { opacity: 0; pointer-events: none; }
        
        #overlay h1 { font-size: 36px; letter-spacing: 4px; margin-bottom: 10px; }
        #overlay p { color: #cdbf9e; margin-bottom: 30px; font-size: 16px; letter-spacing: 1px; text-align: center; line-height: 1.6; }
        
        .stats-box {
            display: flex; gap: 40px; margin-bottom: 30px;
            text-align: center;
        }
        .stats-box div { font-size: 16px; color: #8a8a96; }
        .stats-box strong { display: block; font-size: 32px; color: #60a5fa; margin-top: 5px; }

        .btn {
            padding: 14px 48px;
            background: rgba(37, 99, 235, 0.2);
            border: 1px solid rgba(96, 165, 250, 0.5);
            color: #60a5fa;
            border-radius: 30px;
            font-size: 18px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .btn:hover {
            background: rgba(37, 99, 235, 0.5);
            color: #fff;
            box-shadow: 0 0 20px rgba(96, 165, 250, 0.4);
        }

        .hit-marker {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(1);
            color: #ff453a; font-size: 24px; font-weight: bold;
            pointer-events: none; z-index: 11; opacity: 0;
            transition: opacity 0.1s, transform 0.1s;
        }
        .hit-marker.active { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    </style>
</head>
<body>

<div class="topbar">
    <a href="index.html">← 返回首页</a>
</div>

<div id="game-container"></div>

<div id="crosshair"><div class="dot"></div></div>
<div class="hit-marker" id="hit-marker">×</div>

<div id="hud">
    <div>
        命中: <span id="score">0</span>
        <div id="accuracy">准确率: 100%</div>
    </div>
    <div>时间: <span id="time">30</span>s</div>
</div>

<div id="overlay">
    <h1>3D 定位训练</h1>
    <p>移动鼠标控制视角，<strong>点击鼠标左键</strong>射击蓝色靶子。<br>建议使用电脑游玩，移动端体验受限。</p>
    <div id="result-stats" class="stats-box" style="display:none;">
        <div>最终得分<strong id="final-score">0</strong></div>
        <div>命中率<strong id="final-accuracy">0%</strong></div>
    </div>
    <button class="btn" id="btn-start">点击开始</button>
</div>

<script>
    // ================= 基础变量 =================
    const container = document.getElementById('game-container');
    const overlay = document.getElementById('overlay');
    const btnStart = document.getElementById('btn-start');
    const crosshair = document.getElementById('crosshair');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const accEl = document.getElementById('accuracy');
    const hitMarker = document.getElementById('hit-marker');
    const finalScoreEl = document.getElementById('final-score');
    const finalAccuracyEl = document.getElementById('final-accuracy');
    const resultStats = document.getElementById('result-stats');

    let scene, camera, renderer, raycaster;
    let targets = [];
    let isPlaying = false;
    let score = 0;
    let shotsFired = 0;
    let shotsHit = 0;
    let timeLeft = 30;
    let timerInterval;

    // 视角控制变量
    let yaw = 0; // 左右
    let pitch = 0; // 上下
    const mouseSensitivity = 0.002;
    let isLocked = false;

    // ================= 初始化 Three.js =================
    function init() {
        // 1. 场景
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0c);
        // 添加一点雾效，让远处的靶子有纵深感
        scene.fog = new THREE.FogExp2(0x0a0a0c, 0.02);

        // 2. 相机 (FPS 视角)
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0); // 视觉高度 1.6m
        camera.rotation.order = 'YXZ'; // 防止视角翻滚

        // 3. 渲染器
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 4. 光线
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0x60a5fa, 1);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // 5. 地面网格 (增加空间感，符合你的网站风格)
        const gridHelper = new THREE.GridHelper(100, 100, 0x1c1c20, 0x111116);
        scene.add(gridHelper);

        // 6. 射线检测器 (用于射击判定)
        raycaster = new THREE.Raycaster();

        // 事件监听
        window.addEventListener('resize', onWindowResize);
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mousedown', onMouseDown);
        document.addEventListener('pointerlockchange', onPointerLockChange);
    }

    // ================= 尺寸适配 =================
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ================= 指针锁定 (FPS 视角核心) =================
    function onPointerLockChange() {
        if (document.pointerLockElement === renderer.domElement) {
            isLocked = true;
        } else {
            isLocked = false;
            // 如果游戏正在进行中，但退出了鼠标锁定，则暂停游戏
            if (isPlaying) {
                endGame();
            }
        }
    }

    // ================= 鼠标移动 =================
    function onMouseMove(e) {
        if (!isLocked || !isPlaying) return;

        const movementX = e.movementX || 0;
        const movementY = e.movementY || 0;

        yaw -= movementX * mouseSensitivity;
        pitch -= movementY * mouseSensitivity;

        // 限制上下视角，防止翻转（约 -85度 到 85度）
        pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));

        camera.rotation.y = yaw;
        camera.rotation.x = pitch;
    }

    // ================= 射击逻辑 =================
    function onMouseDown(e) {
        // 只有左键且处于锁定状态才射击
        if (e.button !== 0 || !isLocked || !isPlaying) return;

        shotsFired++;
        updateAccuracy();

        // 1. 设置射线起点和方向为屏幕正中心
        raycaster.setFromCamera({ x: 0, y: 0 }, camera);

        // 2. 检测射线是否与靶子相交
        const intersects = raycaster.intersectObjects(targets);

        if (intersects.length > 0) {
            // 命中
            shotsHit++;
            score++;
            scoreEl.textContent = score;
            updateAccuracy();

            // 显示击中特效
            hitMarker.classList.add('active');
            setTimeout(() => hitMarker.classList.remove('active'), 100);

            // 移除被击中的靶子
            const hitTarget = intersects[0].object;
            scene.remove(hitTarget);
            targets = targets.filter(t => t !== hitTarget);

            // 马上生成一个新的靶子补充
            spawnTarget();
        }
    }

    // ================= 靶子生成 =================
    function spawnTarget() {
        // 随机大小，增加难度层次
        const radius = Math.random() * 0.3 + 0.4; 
        
        const geometry = new THREE.SphereGeometry(radius, 32, 32);
        
        // 发光材质
        const material = new THREE.MeshStandardMaterial({
            color: 0x2e5bff,
            emissive: 0x60a5fa,
            emissiveIntensity: 0.8,
            roughness: 0.2,
            metalness: 0.8
        });

        const sphere = new THREE.Mesh(geometry, material);

        // 生成在玩家前方的半球形空间内
        // 距离 10 - 20 之间
        const distance = Math.random() * 10 + 10;
        // 左右角度 -45度 到 45度
        const angleY = (Math.random() - 0.5) * Math.PI / 2;
        // 上下角度 -20度 到 20度
        const angleX = (Math.random() - 0.5) * 0.8;

        // 计算位置 (基于相机的初始朝向)
        sphere.position.x = Math.sin(angleY) * Math.cos(angleX) * distance;
        sphere.position.y = Math.sin(angleX) * distance + 1.6; // +1.6 是视平线高度
        sphere.position.z = -Math.cos(angleY) * Math.cos(angleX) * distance; // 负数是前方

        scene.add(sphere);
        targets.push(sphere);
    }

    // ================= 游戏流程控制 =================
    function startGame() {
        // 重置数据
        score = 0;
        shotsFired = 0;
        shotsHit = 0;
        timeLeft = 30;
        scoreEl.textContent = score;
        timeEl.textContent = Math.ceil(timeLeft);
        updateAccuracy();
        
        // 清理场上残留的靶子
        targets.forEach(t => scene.remove(t));
        targets = [];

        // 重置视角
        yaw = 0; pitch = 0;
        camera.rotation.set(0, 0, 0);

        // 生成初始靶子
        for (let i = 0; i < 3; i++) {
            spawnTarget();
        }

        overlay.classList.add('hidden');
        crosshair.style.opacity = 1;
        hud.style.opacity = 1;
        isPlaying = true;

        // 锁定鼠标
        renderer.domElement.requestPointerLock();

        // 计时器
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!isPlaying) return;
            timeLeft -= 1;
            timeEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function endGame() {
        isPlaying = false;
        clearInterval(timerInterval);
        document.exitPointerLock(); // 释放鼠标
        
        crosshair.style.opacity = 0;
        hud.style.opacity = 0;
        
        // 显示结算
        overlay.classList.remove('hidden');
        overlay.querySelector('h1').textContent = '训练结束';
        overlay.querySelector('p').style.display = 'none';
        resultStats.style.display = 'flex';
        finalScoreEl.textContent = score;
        finalAccuracyEl.textContent = accEl.textContent.replace('准确率: ', '');
        
        btnStart.textContent = '再试一次';
    }

    function updateAccuracy() {
        if (shotsFired === 0) {
            accEl.textContent = '准确率: 100%';
            return;
        }
        const acc = Math.round((shotsHit / shotsFired) * 100);
        accEl.textContent = `准确率: ${acc}%`;
    }

    // ================= 渲染循环 =================
    function animate() {
        requestAnimationFrame(animate);
        
        // 让靶子有一点呼吸的浮动效果
        const time = Date.now() * 0.002;
        targets.forEach((t, index) => {
            t.position.y += Math.sin(time + index) * 0.002;
        });

        renderer.render(scene, camera);
    }

    // 事件绑定
    btnStart.addEventListener('click', startGame);

    // 启动初始化
    init();
    animate();

</script>
</body>
</html>
