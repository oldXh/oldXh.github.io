<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源库</title>
<!-- 引入更好看的字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  
  body {
    font-family: "Outfit", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 50% 50%, #1c1c20, #0b0b0d 70%);
    color: #f2ead8;
    padding: 30px 20px;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  .nav-bar {
    width: 100%;
    max-width: 650px;
    margin-bottom: 30px;
  }
  .nav-bar a {
    color: #cdbf9e;
    text-decoration: none;
    font-size: 16px;
    transition: all 0.3s ease;
  }
  .nav-bar a:hover { 
    color: #ffffff;
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
  }

  .search-box {
    width: 100%;
    max-width: 650px;
    margin-bottom: 30px;
  }

  .search-box input {
    width: 100%;
    padding: 16px 24px;
    font-size: 18px;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    outline: none;
    color: #ffffff;
    font-family: inherit;
    transition: all 0.3s ease;
  }
  .search-box input::placeholder { color: rgba(255, 255, 255, 0.3); }
  .search-box input:focus { 
    border-color: rgba(59, 130, 246, 0.8);
    box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
    background: rgba(255, 255, 255, 0.08);
  }

  .audio-list {
    width: 100%;
    max-width: 650px;
    list-style: none;
    padding: 0;
    margin: 0;
  }

  /* 保持你原来的行内排版 */
  .audio-item {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 24px;
    padding: 18px 10px;
    border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
    font-size: 22px;
    transition: background-color 0.3s;
  }
  .audio-item:hover {
    background: rgba(255, 255, 255, 0.03);
  }
  .audio-item.hidden { display: none; }

  .audio-name { 
    font-weight: 500; 
    letter-spacing: 0.02em;
  }

  .audio-actions { display: flex; gap: 24px; margin-left: auto; }

  .btn-link {
    color: #60a5fa;
    text-decoration: none;
    font-size: 20px;
    cursor: pointer;
    white-space: nowrap;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
    transition: all 0.3s ease;
  }
  .btn-link:hover { 
    color: #93c5fd;
    text-shadow: 0 0 10px rgba(147, 197, 253, 0.6);
  }

  /* 用来存放展开的视频 */
  .video-wrapper {
    display: none;
    width: 100%;
    margin-top: 15px;
  }
  
  .video-wrapper video {
    width: 100%;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }

  .empty-tip {
    display: none;
    color: rgba(255, 255, 255, 0.5);
    font-size: 18px;
    margin-top: 30px;
    text-align: center;
  }

  @media (max-width: 480px) {
    .audio-item { font-size: 18px; gap: 8px 16px; }
    .btn-link { font-size: 17px; }
    .search-box input { font-size: 16px; padding: 12px 16px; }
  }
</style>
</head>
<body>

  <div class="nav-bar">
    <a href="index.html">← 返回首页</a>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索内容（例如：wzy、吉他、Vicetone）...">
  </div>

  <ul class="audio-list" id="audioList">
    <!-- 第 1 项：替换为视频 -->
    <li class="audio-item" data-name="wzy弹吉他">
      <span class="audio-name">1. wzy弹吉他</span>
      <div class="audio-actions">
        <!-- 点击触发展开/收起函数 -->
        <button class="btn-link" onclick="toggleVideo('wzy', this)">(观看)</button>
      </div>
      
      <!-- 视频隐藏框（注意：因为外面是 flex 布局，设置 width: 100% 会让它自动掉到下一行显示） -->
      <div class="video-wrapper" id="wrapper-wzy">
        <!-- 💡【你需要修改的地方】💡 如果你上传的视频叫别的名字，请把 "wzy.mp4" 改成你的名字 -->
        <video id="video-wzy" src="0bcb4b8b3a3fa8d1cce10168a370317c.mp4" controls preload="none"></video>
      </div>
    </li>

    <!-- 第 2 项：保留原来的音频示例（如果你不需要可以删掉） -->
    <li class="audio-item" data-name="Vicetone - Over Too Soon">
      <span class="audio-name">2. Vicetone - Over Too Soon</span>
      <div class="audio-actions">
        <a class="btn-link" href="https://djs.od.ua/track/6045-vicetone_over_too_soon" target="_blank" rel="noopener">(收听)</a>
      </div>
    </li>
  </ul>

  <p class="empty-tip" id="emptyTip">没有找到匹配的内容，换个关键词试试～</p>

<script>
  // 搜索过滤
  const searchInput = document.getElementById('searchInput');
  const audioList = document.getElementById('audioList');
  const emptyTip = document.getElementById('emptyTip');
  const items = Array.from(audioList.querySelectorAll('.audio-item'));

  searchInput.addEventListener('input', function () {
    const keyword = this.value.trim().toLowerCase();
    let visibleCount = 0;

    items.forEach(item => {
      const name = (item.getAttribute('data-name') || '').toLowerCase();
      if (name.includes(keyword)) {
        item.classList.remove('hidden');
        visibleCount++;
      } else {
        item.classList.add('hidden');
      }
    });

    emptyTip.style.display = visibleCount === 0 ? 'block' : 'none';
  });

  // 视频观看/收起逻辑
  function toggleVideo(id, btn) {
    const wrapper = document.getElementById('wrapper-' + id);
    const video = document.getElementById('video-' + id);

    if (wrapper.style.display === 'none' || wrapper.style.display === '') {
      wrapper.style.display = 'block';
      // 尝试播放（如果浏览器拦截，用户点视频里的播放键即可）
      video.play().catch(e => console.log('等待用户手动播放'));
      btn.textContent = '(收起)';
    } else {
      wrapper.style.display = 'none';
      video.pause();
      video.currentTime = 0;
      btn.textContent = '(观看)';
    }
  }
</script>

</body>
</html>
