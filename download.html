<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vicetone 音频库</title>
<!-- 引入更好看的字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  
  body {
    /* 使用新引入的现代无衬线字体 */
    font-family: "Outfit", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    /* 与 index.html 同款的黑色径向渐变背景 */
    background: radial-gradient(circle at 50% 50%, #1c1c20, #0b0b0d 70%);
    color: #f2ead8; /* 同款的淡金/暖白色文字 */
    padding: 30px 20px;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  .nav-bar {
    width: 100%;
    max-width: 650px;
    margin-bottom: 30px;
  }
  .nav-bar a {
    color: #cdbf9e; /* 类似首页副标题的淡金色 */
    text-decoration: none;
    font-size: 16px;
    transition: all 0.3s ease;
  }
  .nav-bar a:hover { 
    color: #ffffff;
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
  }

  .search-box {
    width: 100%;
    max-width: 650px;
    margin-bottom: 30px;
  }

  .search-box input {
    width: 100%;
    padding: 16px 24px;
    font-size: 18px;
    /* 半透明毛玻璃质感的搜索框 */
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    outline: none;
    color: #ffffff;
    font-family: inherit;
    transition: all 0.3s ease;
  }
  .search-box input::placeholder { color: rgba(255, 255, 255, 0.3); }
  .search-box input:focus { 
    border-color: rgba(59, 130, 246, 0.8); /* 聚焦时变蓝 */
    box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); /* 蓝色光晕 */
    background: rgba(255, 255, 255, 0.08);
  }

  .audio-list {
    width: 100%;
    max-width: 650px;
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .audio-item {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 24px;
    padding: 18px 10px;
    border-bottom: 1px dashed rgba(255, 255, 255, 0.15); /* 调整为半透明暗色虚线 */
    font-size: 22px;
    transition: background-color 0.3s;
  }
  .audio-item:hover {
    background: rgba(255, 255, 255, 0.03); /* 鼠标悬停时微微提亮背景 */
  }
  .audio-item.hidden { display: none; }

  .audio-name { 
    font-weight: 500; 
    letter-spacing: 0.02em;
  }

  .audio-actions { display: flex; gap: 24px; margin-left: auto; }

  .btn-link {
    color: #60a5fa; /* 替换刺眼的红色，使用科技感亮蓝色 */
    text-decoration: none;
    font-size: 20px;
    cursor: pointer;
    white-space: nowrap;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
    transition: all 0.3s ease;
  }
  .btn-link:hover { 
    color: #93c5fd;
    text-shadow: 0 0 10px rgba(147, 197, 253, 0.6); /* 悬停发光 */
  }

  .empty-tip {
    display: none;
    color: rgba(255, 255, 255, 0.5);
    font-size: 18px;
    margin-top: 30px;
    text-align: center;
  }

  @media (max-width: 480px) {
    .audio-item { font-size: 18px; gap: 8px 16px; }
    .btn-link { font-size: 17px; }
    .search-box input { font-size: 16px; padding: 12px 16px; }
  }
</style>
</head>
<body>

  <div class="nav-bar">
    <a href="index.html">← 返回首页</a>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索音频名称（例如：Ensemble）...">
  </div>

  <ul class="audio-list" id="audioList">
    <!-- 示例曲目 1 -->
    <li class="audio-item" data-name="Vicetone - Ensemble (Original Mix)">
      <span class="audio-name">1. Vicetone - Ensemble (Original Mix)</span>
      <div class="audio-actions">
        <button class="btn-link" onclick="playAudio('ensemble')">(收听)</button>
        <button class="btn-link" onclick="downloadPlaceholder()">下载</button>
      </div>
      <!-- 隐藏的音频播放器 -->
      <audio id="audio-ensemble" src="http://up.yuedisk.com/wl/url/qJeEk5c6cp/204318/yuedisk.mp3" preload="none"></audio>
    </li>

    <!-- 示例曲目 2 -->
    <li class="audio-item" data-name="Vicetone - Over Too Soon">
      <span class="audio-name">2. Vicetone - Over Too Soon</span>
      <div class="audio-actions">
        <a class="btn-link" href="https://djs.od.ua/track/6045-vicetone_over_too_soon" target="_blank" rel="noopener">(收听)</a>
        <button class="btn-link" onclick="downloadPlaceholder()">下载</button>
      </div>
    </li>
  </ul>

  <p class="empty-tip" id="emptyTip">没有找到匹配的音频，换个关键词试试～</p>

<script>
  // 搜索过滤
  const searchInput = document.getElementById('searchInput');
  const audioList = document.getElementById('audioList');
  const emptyTip = document.getElementById('emptyTip');
  const items = Array.from(audioList.querySelectorAll('.audio-item'));

  searchInput.addEventListener('input', function () {
    const keyword = this.value.trim().toLowerCase();
    let visibleCount = 0;

    items.forEach(item => {
      const name = (item.getAttribute('data-name') || '').toLowerCase();
      if (name.includes(keyword)) {
        item.classList.remove('hidden');
        visibleCount++;
      } else {
        item.classList.add('hidden');
      }
    });

    emptyTip.style.display = visibleCount === 0 ? 'block' : 'none';
  });

  // 试听（播放/暂停切换）
  function playAudio(id) {
    const audio = document.getElementById('audio-' + id);
    if (!audio) return;

    document.querySelectorAll('audio').forEach(a => {
      if (a !== audio) { a.pause(); a.currentTime = 0; }
    });

    if (audio.paused) {
      audio.play().catch(err => {
        alert('无法直接播放，可能是链接失效或浏览器拦截。你可以尝试替换音频链接。');
      });
    } else {
      audio.pause();
      audio.currentTime = 0;
    }
  }

  // 下载占位提示功能
  function downloadPlaceholder() {
    alert('下载功能暂未开放，敬请期待！(目前仅支持在线收听)');
  }
</script>

</body>
</html>
