<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>解方程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100vh;
    background: #0f0f10;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, #1c1c20, #0b0b0d 70%);
    z-index: -1; pointer-events: none;
  }

  .topbar {
    position: absolute;
    left: 0; top: 0; width: 100%; height: 40px;
    background: linear-gradient(90deg, rgba(30,58,138,0.8) 0%, rgba(37,99,235,0.8) 50%, rgba(30,58,138,0.8) 100%);
    box-shadow: 0 2px 12px rgba(37, 99, 235, 0.35);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .topbar a {
    color: #ffffff; text-decoration: none; font-size: 15px; letter-spacing: 0.15em;
    transition: transform 0.2s ease;
  }
  .topbar a:hover { transform: scale(1.1); }

  .workspace {
    display: flex;
    width: 100%;
    height: 100%;
    padding-top: 40px;
  }

  /* --- 左侧输入区 --- */
  .input-panel {
    flex: 1.1; /* 稍微加宽以适应复杂的键盘 */
    display: flex;
    flex-direction: column;
    padding: 25px 30px;
    border-right: 1px solid rgba(255, 220, 150, 0.1);
  }

  .panel-title {
    font-family: "ZCOOL KuaiLe", "站酷快乐体", cursive;
    color: #cdbf9e;
    font-size: 26px;
    margin-bottom: 12px;
    letter-spacing: 0.05em;
  }

  .display-screen {
    width: 100%;
    height: 60px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 220, 150, 0.2);
    border-radius: 10px;
    padding: 0 15px;
    display: flex;
    align-items: center;
    margin-bottom: 20px;
    box-shadow: inset 0 4px 15px rgba(0,0,0,0.5);
  }

  #equation-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #f2ead8;
    font-family: "ZCOOL KuaiLe", "Fira Code", cursive, monospace;
    font-size: 28px;
    text-align: right;
  }
  #equation-input::placeholder { color: rgba(205, 191, 158, 0.3); font-size: 24px; }

  /* --- 软键盘区 (参考 Desmos) --- */
  .keyboard {
    display: grid;
    grid-template-columns: repeat(6, 1fr); /* 6列布局 */
    gap: 8px;
    flex-grow: 1;
    max-height: 520px;
  }

  .key-btn {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    color: #f2ead8;
    font-family: "Fira Code", monospace;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.1s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  
  .key-btn.math { font-family: "Songti SC", "SimSun", serif; font-style: italic; font-weight: 500; }
  .key-btn:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 220, 150, 0.3); }
  .key-btn:active { transform: scale(0.95); background: rgba(255, 220, 150, 0.15); }
  
  .key-operator { color: #60a5fa; }
  .key-action { color: #ef4444; }
  
  .key-submit {
    grid-column: span 6;
    background: rgba(37, 99, 235, 0.2);
    border-color: rgba(37, 99, 235, 0.5);
    color: #93c5fd;
    font-size: 18px;
    letter-spacing: 0.2em;
    margin-top: 5px;
    font-family: "ZCOOL KuaiLe", cursive;
  }
  .key-submit:hover { background: rgba(37, 99, 235, 0.4); color: #fff; }

  /* --- 右侧终端区 --- */
  .terminal-panel {
    flex: 1;
    background: rgba(0, 0, 0, 0.2);
    padding: 25px 30px;
    display: flex;
    flex-direction: column;
  }

  .terminal-header { display: flex; gap: 8px; margin-bottom: 20px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.red { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green { background: #27c93f; }

  #terminal-output {
    flex-grow: 1;
    overflow-y: auto;
    color: #cdbf9e; 
    font-family: "Fira Code", "Consolas", monospace;
    font-size: 15px;
    line-height: 1.8;
    white-space: pre-wrap;
  }
  #terminal-output::-webkit-scrollbar { width: 6px; }
  #terminal-output::-webkit-scrollbar-thumb { background: rgba(255, 220, 150, 0.2); border-radius: 4px; }

  .term-line { margin-bottom: 6px; animation: fadeIn 0.2s ease; }
  
  .term-answer { 
    color: #60a5fa; 
    font-weight: bold; 
    font-size: 17px; 
    margin-top: 12px;
    margin-bottom: 12px;
    text-shadow: 0 0 10px rgba(96, 165, 250, 0.3);
  }
  
  .term-error { color: #ef4444; }
  
  .term-cursor {
    display: inline-block; width: 8px; height: 15px; background: #cdbf9e;
    vertical-align: middle; margin-left: 5px; animation: blink 1s step-end infinite;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  @media (max-width: 900px) {
    .workspace { flex-direction: column; overflow-y: auto; }
    .input-panel, .terminal-panel { min-height: 50vh; border-right: none; padding: 20px; }
    .keyboard { grid-template-columns: repeat(4, 1fr); max-height: none; }
    .key-submit { grid-column: span 4; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <a href="index.html">← 返回首页</a>
  </div>

  <div class="workspace">
    
    <!-- 左侧：输入与高级键盘 -->
    <div class="input-panel">
      <div class="panel-title">输入方程</div>
      
      <div class="display-screen">
        <input type="text" id="equation-input" placeholder="例如: 3x - 1 = 0" autocomplete="off" spellcheck="false">
      </div>

      <div class="keyboard">
        <!-- 第1排：字母与代数 -->
        <div class="key-btn math" data-val="x">x</div>
        <div class="key-btn math" data-val="y">y</div>
        <div class="key-btn math" data-val="^2">a²</div>
        <div class="key-btn math" data-val="^">aᵇ</div>
        <div class="key-btn math" data-val="abs(">|a|</div>
        <div class="key-btn math" data-val="pi">π</div>

        <!-- 第2排：括号与比较符 -->
        <div class="key-btn math" data-val="(">(</div>
        <div class="key-btn math" data-val=")">)</div>
        <div class="key-btn math" data-val="<">&lt;</div>
        <div class="key-btn math" data-val=">">&gt;</div>
        <div class="key-btn math" data-val="<=">≤</div>
        <div class="key-btn math" data-val=">=">≥</div>

        <!-- 第3排：数字与基础运算 -->
        <div class="key-btn" data-val="7">7</div>
        <div class="key-btn" data-val="8">8</div>
        <div class="key-btn" data-val="9">9</div>
        <div class="key-btn key-operator" data-val="/">÷</div>
        <div class="key-btn key-action" id="btn-clear">C</div>
        <div class="key-btn key-action" id="btn-backspace">⌫</div>

        <!-- 第4排 -->
        <div class="key-btn" data-val="4">4</div>
        <div class="key-btn" data-val="5">5</div>
        <div class="key-btn" data-val="6">6</div>
        <div class="key-btn key-operator" data-val="*">×</div>
        <div class="key-btn key-operator" data-val="-">-</div>
        <div class="key-btn key-operator" data-val="+">+</div>

        <!-- 第5排 -->
        <div class="key-btn" data-val="1">1</div>
        <div class="key-btn" data-val="2">2</div>
        <div class="key-btn" data-val="3">3</div>
        <div class="key-btn" data-val="0">0</div>
        <div class="key-btn" data-val=".">.</div>
        <div class="key-btn key-operator" data-val="=">=</div>

        <!-- 第6排：提交 -->
        <div class="key-btn key-submit" id="btn-submit">开 始 求 解</div>
      </div>
    </div>

    <!-- 右侧：终端 -->
    <div class="terminal-panel">
      <div class="terminal-header">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
      <div id="terminal-output">
        <div class="term-line">系统就绪，等待输入方程...</div>
        <div class="term-line"><span class="term-cursor"></span></div>
      </div>
    </div>
  </div>

<script>
  const inputField = document.getElementById('equation-input');
  const terminal = document.getElementById('terminal-output');

  // 软键盘输入
  document.querySelectorAll('.key-btn[data-val]').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.getAttribute('data-val');
      const start = inputField.selectionStart;
      const end = inputField.selectionEnd;
      const text = inputField.value;
      inputField.value = text.substring(0, start) + val + text.substring(end);
      inputField.selectionStart = inputField.selectionEnd = start + val.length;
      inputField.focus();
    });
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    inputField.value = '';
    inputField.focus();
  });

  document.getElementById('btn-backspace').addEventListener('click', () => {
    const start = inputField.selectionStart;
    const end = inputField.selectionEnd;
    const text = inputField.value;
    if (start === end && start > 0) {
      inputField.value = text.substring(0, start - 1) + text.substring(start);
      inputField.selectionStart = inputField.selectionEnd = start - 1;
    } else {
      inputField.value = text.substring(0, start) + text.substring(end);
      inputField.selectionStart = inputField.selectionEnd = start;
    }
    inputField.focus();
  });

  document.getElementById('btn-submit').addEventListener('click', solveEquation);
  inputField.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') solveEquation();
  });

  function printToTerminal(text, className = '') {
    return new Promise(resolve => {
      const line = document.createElement('div');
      line.className = `term-line ${className}`;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
      
      let i = 0;
      const speed = 10;
      function type() {
        if (i < text.length) {
          line.textContent += text.charAt(i);
          i++;
          terminal.scrollTop = terminal.scrollHeight;
          setTimeout(type, speed);
        } else {
          resolve();
        }
      }
      type();
    });
  }

  // 核心辅助函数：将浮点数智能转换回分数（如果分母过大则保留小数）
  function formatResult(value) {
    if (Math.abs(value) < 1e-9) return "0"; // 处理极小的浮点误差
    try {
      const frac = math.fraction(value);
      // 如果分母太大（说明是无理数的近似值），则直接返回带4位小数的结果
      if (frac.d > 100) {
        return parseFloat(value.toFixed(4)).toString();
      }
      // 如果是整数，直接返回整数
      if (frac.d === 1) {
        return frac.n.toString();
      }
      // 否则返回分数格式
      return math.format(frac, { fraction: 'ratio' });
    } catch(e) {
      return parseFloat(value.toFixed(4)).toString();
    }
  }

  async function solveEquation() {
    const rawInput = inputField.value.trim();
    if (!rawInput) return;

    terminal.innerHTML = '';
    
    // 预处理：符号替换
    let eqStr = rawInput
      .replace(/\s+/g, '')
      .replace(/X/g, 'x')
      .replace(/²/g, '^2')
      .replace(/³/g, '^3')
      .replace(/√/g, 'sqrt')
      .replace(/π/g, 'pi')
      .replace(/×/g, '*')
      .replace(/÷/g, '/');
    
    // 处理比较符（如果是不等式，目前终端不支持完整解析，给个提示）
    if (eqStr.includes('<') || eqStr.includes('>') || eqStr.includes('<=') || eqStr.includes('>=')) {
      await printToTerminal(`[提示] 当前版本主要针对等式求解，不等式计算可能不准确。`, 'term-error');
    }

    await printToTerminal(`> 解析表达式: ${eqStr}`);
    
    if (!eqStr.includes('=')) {
      await printToTerminal(`[错误] 方程必须包含等号 '='`, 'term-error');
      return;
    }

    try {
      const parts = eqStr.split('=');
      if (parts.length !== 2) throw new Error("包含多个等号");
      
      let left = parts[0];
      let right = parts[1];

      const fExpr = `(${left}) - (${right})`;
      const f = math.compile(fExpr);
      
      // 测试方程是否合法
      const testVal = f.evaluate({ x: 123.456 });
      if (typeof testVal !== 'number' || isNaN(testVal)) {
        throw new Error("无法识别的数学表达式");
      }

      await printToTerminal(`> 移项整理得: f(x) = ${fExpr} = 0`);

      // 反推系数
      const c = f.evaluate({ x: 0 });
      const f1 = f.evaluate({ x: 1 });
      const f_1 = f.evaluate({ x: -1 });
      
      const a = (f1 + f_1 - 2 * c) / 2;
      const b = (f1 - f_1) / 2;

      const EPSILON = 1e-8;

      if (Math.abs(a) > EPSILON) {
        // 一元二次方程
        await printToTerminal(`> 识别为 [一元二次方程] ax² + bx + c = 0`);
        await printToTerminal(`  系数: a = ${formatResult(a)}, b = ${formatResult(b)}, c = ${formatResult(c)}`);
        
        const delta = b * b - 4 * a * c;
        await printToTerminal(`> 判别式: Δ = b² - 4ac = ${formatResult(delta)}`);

        if (delta > EPSILON) {
          const x1 = (-b + Math.sqrt(delta)) / (2 * a);
          const x2 = (-b - Math.sqrt(delta)) / (2 * a);
          await printToTerminal(`> Δ > 0，两个不相等的实数根。`);
          await printToTerminal(`\n[答案] x₁ = ${formatResult(x1)}`, 'term-answer');
          await printToTerminal(`[答案] x₂ = ${formatResult(x2)}`, 'term-answer');
        } else if (Math.abs(delta) <= EPSILON) {
          const x = -b / (2 * a);
          await printToTerminal(`> Δ = 0，两个相等的实数根。`);
          await printToTerminal(`\n[答案] x₁ = x₂ = ${formatResult(x)}`, 'term-answer');
        } else {
          await printToTerminal(`> Δ < 0，方程无实数根。`);
          await printToTerminal(`\n[答案] 无实数解`, 'term-answer');
        }
      } 
      else if (Math.abs(b) > EPSILON) {
        // 一元一次方程
        await printToTerminal(`> 识别为 [一元一次方程] bx + c = 0`);
        await printToTerminal(`> 移项得: ${formatResult(b)}x = ${formatResult(-c)}`);
        const x = -c / b;
        await printToTerminal(`\n[答案] x = ${formatResult(x)}`, 'term-answer');
      } 
      else {
        // 常数或更高次
        if (Math.abs(c) < EPSILON) {
          await printToTerminal(`> 恒等式，x 取任意实数。`);
          await printToTerminal(`\n[答案] x ∈ R`, 'term-answer');
        } else {
          await printToTerminal(`> 无法直接提取多项式系数，切换至 [牛顿迭代法]...`);
          let x0 = 1.0, iter = 0, solved = false;
          const h = 1e-6;
          const df = (x) => (f.evaluate({x: x + h}) - f.evaluate({x: x - h})) / (2 * h);

          while (iter < 15) {
            const fx = f.evaluate({ x: x0 });
            if (Math.abs(fx) < 1e-7) { solved = true; break; }
            const dfx = df(x0);
            if (Math.abs(dfx) < 1e-9) break;
            const x1 = x0 - fx / dfx;
            await printToTerminal(`  迭代 ${iter + 1}: x = ${formatResult(x1)}`);
            x0 = x1;
            iter++;
          }
          if (solved) await printToTerminal(`\n[答案] 找到近似解: x ≈ ${formatResult(x0)}`, 'term-answer');
          else await printToTerminal(`\n[答案] 未能在限定次数内找到实数解。`, 'term-error');
        }
      }
    } catch (error) {
      await printToTerminal(`[错误] 解析失败: ${error.message}`, 'term-error');
      await printToTerminal(`请检查格式（支持使用 x, pi, 括号及运算符）`, 'term-error');
    }
    
    const cursorLine = document.createElement('div');
    cursorLine.className = 'term-line';
    cursorLine.style.marginTop = '10px';
    cursorLine.innerHTML = '<span class="term-cursor"></span>';
    terminal.appendChild(cursorLine);
    terminal.scrollTop = terminal.scrollHeight;
  }
</script>
</body>
</html>
