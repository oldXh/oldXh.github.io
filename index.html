<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>oldXh.github.io (目前处于内侧中……)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #050508;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 深空背景容器 */
  .stage {
    position: relative;
    width: 1440px;
    height: 900px;
    flex: 0 0 auto;
    background: radial-gradient(circle at 50% 50%, #111116, #050508 80%);
    overflow: hidden;
    color: #f2ead8;
    perspective: 1200px;
  }

  /* 动态星空 Canvas */
  #starfield {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* --- 太阳系 3D 容器 --- */
  .solar-system {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    transform-style: preserve-3d;
    z-index: 1;
    transition: transform 0.1s ease-out;
  }

  /* ================== 太阳 ================== */
  .sun {
    position: absolute;
    top: 50%; left: 50%;
    width: 100px; height: 100px;
    transform: translate(-50%, -50%) translateZ(0);
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fff5cc, #ffb300 30%, #ff3d00 70%, #b30000 100%);
    box-shadow: 
      inset -10px -10px 30px rgba(150, 0, 0, 0.8),
      0 0 50px #ffb300,
      0 0 100px rgba(255, 61, 0, 0.6),
      0 0 200px rgba(255, 61, 0, 0.2);
    animation: sunPulse 4s infinite alternate;
  }

  @keyframes sunPulse {
    0% { box-shadow: inset -10px -10px 30px rgba(150,0,0,0.8), 0 0 50px #ffb300, 0 0 100px rgba(255, 61, 0, 0.6), 0 0 200px rgba(255, 61, 0, 0.2); }
    100% { box-shadow: inset -10px -10px 30px rgba(150,0,0,0.8), 0 0 70px #ffda00, 0 0 150px rgba(255, 61, 0, 0.8), 0 0 300px rgba(255, 61, 0, 0.4); }
  }

  /* 轨道 */
  .orbit {
    position: absolute;
    top: 50%; left: 50%;
    border: 1px dashed rgba(255, 255, 255, 0.08);
    border-radius: 50%;
    transform-style: preserve-3d;
    transform: translate(-50%, -50%) rotateX(75deg);
  }

  /* 行星通用基础 */
  .planet {
    position: absolute;
    top: 50%; left: 50%;
    border-radius: 50%;
    transform: translate(-50%, -50%) rotateX(-75deg);
    transform-style: preserve-3d;
    box-shadow: 
      inset -4px -4px 10px rgba(0,0,0,0.9),
      inset 2px 2px 6px rgba(255,255,255,0.4),
      0 0 10px rgba(0,0,0,0.5);
  }

  /* ================== 各星球材质 ================== */
  .mercury { width: 10px; height: 10px; background: radial-gradient(circle at 30% 30%, #a8a8a8, #555 80%); }
  .venus { width: 16px; height: 16px; background: radial-gradient(circle at 30% 30%, #ffe4a0, #d49a47 60%, #8c5b1a 100%); }
  
  /* 地球 */
  .earth {
    width: 18px; height: 18px;
    background: 
      radial-gradient(circle at 60% 40%, rgba(46, 204, 113, 0.8) 10%, transparent 20%), 
      radial-gradient(circle at 30% 70%, rgba(46, 204, 113, 0.6) 15%, transparent 25%),
      radial-gradient(circle at 30% 30%, #4fa3ff, #1d6eaa 60%, #0a3d62 100%); 
  }
  
  .mars { width: 14px; height: 14px; background: radial-gradient(circle at 30% 30%, #ff7b54, #9c2915 70%, #4a1005 100%); }
  
  /* 木星 */
  .jupiter {
    width: 46px; height: 46px;
    background: linear-gradient(
      to bottom,
      #d4c4a8 5%, #b89270 15%, #e8d5b5 25%, #a87755 35%, 
      #e8d5b5 45%, #b89270 55%, #e8d5b5 65%, #a87755 75%, 
      #d4c4a8 85%, #b89270 95%
    );
  }
  
  .saturn { width: 40px; height: 40px; background: radial-gradient(circle at 30% 30%, #f7e4b5, #c7a366 60%, #8f692d 100%); }
  .uranus { width: 28px; height: 28px; background: radial-gradient(circle at 30% 30%, #b0f2ef, #3d9e9b 60%, #165f5d 100%); }
  .neptune { width: 26px; height: 26px; background: radial-gradient(circle at 30% 30%, #6b9cff, #2b55ba 60%, #102c75 100%); }

  /* 土星环 */
  .saturn-ring {
    position: absolute;
    top: 50%; left: 50%;
    width: 85px; height: 22px;
    border: 4px solid rgba(210, 180, 140, 0.7);
    border-radius: 50%;
    transform: translate(-50%, -50%) rotateX(70deg) rotateY(-15deg);
    box-shadow: 0 0 10px rgba(210, 180, 140, 0.4), inset 0 0 10px rgba(0,0,0,0.5);
    pointer-events: none;
  }

  /* 地球的月球 */
  .moon-orbit {
    position: absolute;
    top: 50%; left: 50%;
    width: 45px; height: 45px;
    border: 1px dashed rgba(255,255,255,0.1);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: spinMoon 4s linear infinite;
    pointer-events: none;
  }
  .moon {
    position: absolute;
    top: 0; left: 50%;
    width: 6px; height: 6px;
    background: radial-gradient(circle at 30% 30%, #fff, #888);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: inset -1px -1px 3px rgba(0,0,0,0.8);
  }
  @keyframes spinMoon {
    from { transform: translate(-50%, -50%) rotateZ(0deg); }
    to { transform: translate(-50%, -50%) rotateZ(360deg); }
  }

  /* --- 顶部导航栏 --- */
  .topbar {
    position: absolute;
    left: 0;
    top: 70px; 
    width: 100%;
    height: 42px; 
    background: linear-gradient(90deg, rgba(30,58,138,0.6) 0%, rgba(37,99,235,0.7) 50%, rgba(30,58,138,0.6) 100%);
    box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(6px);
  }

  .topbar a, .dropdown > span {
    color: #ffffff;
    text-decoration: none;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 16px; 
    letter-spacing: 0.15em;
    display: inline-block;
    transition: transform 0.2s ease;
    cursor: pointer;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .topbar a:hover, .dropdown:hover > span { transform: scale(1.15); }
  .topbar > a:first-child { margin-right: 50px; }

  .dropdown { position: relative; display: inline-block; margin-left: 50px; }
  .dropdown::after { content: ''; position: absolute; left: 0; top: 100%; width: 100%; height: 15px; }
  .dropdown-menu {
    position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%) translateY(15px);
    background: rgba(20, 28, 48, 0.95);
    border: 1px solid rgba(59, 130, 246, 0.4);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px); list-style: none; padding: 8px 0; min-width: 140px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
    z-index: 101;
  }
  .dropdown:hover .dropdown-menu { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  .dropdown-menu li a { display: block; padding: 12px 24px; font-size: 15px; letter-spacing: 0.1em; text-align: center; white-space: nowrap; }
  .dropdown-menu li a:hover { background: rgba(37, 99, 235, 0.3); transform: none; }

  /* --- 中心文字 --- */
  .at {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
    transform-style: preserve-3d;
    translate: 0 0 120px; 
  }

  .title-time {
    font-family: "ZCOOL KuaiLe", "站酷快乐体", cursive;
    font-size: 110px;
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 50px rgba(96, 165, 250, 0.2);
    letter-spacing: 0.05em;
    color: #f2ead8;
  }

  .subtitle-date {
    margin-top: 10px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 30px;
    white-space: nowrap;
    letter-spacing: 0.1em;
    color: #cdbf9e;
    text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 10px rgba(96, 165, 250, 0.3);
  }
  
  .zoom-tip {
    position: absolute;
    bottom: 30px;
    left: 30px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.3);
    pointer-events: none;
    z-index: 10;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <!-- 动态星空画布 -->
    <canvas id="starfield"></canvas>

    <!-- 3D 太阳系 -->
    <div class="solar-system" id="solarSystem">
      <div class="sun"></div>
      <div id="planetContainer"></div>
    </div>

    <!-- 导航栏 -->
    <div class="topbar">
      <a href="download.html">下载📥</a>
      <a href="aboutus.html">公告📢</a>
      <div class="dropdown">
        <span>其他 ▾</span>
        <ul class="dropdown-menu">
          <li><a href="weather.html">天气预报 ☁️</a></li>
          <li><a href="eq.html">解方程 🧮</a></li>
        </ul>
      </div>
    </div>

    <!-- 时间文字 -->
    <div class="at">
      <div class="title-time" id="time-display">--:--:--</div>
      <div class="subtitle-date" id="date-display">加载中...</div>
    </div>

    <div class="zoom-tip">移动鼠标探索星系 / 滚轮缩放</div>
  </div>

<script>
  // ==========================================
  // 1. Canvas 动态星空背景
  // ==========================================
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let width, height;
  let stars = [];
  let mouseX = 0, mouseY = 0; // 用于视差效果

  // 初始化画布尺寸
  function resizeCanvas() {
    const stage = document.getElementById('stage');
    width = canvas.width = stage.clientWidth;
    height = canvas.height = stage.clientHeight;
    initStars();
  }

  // 生成星星数据
  function initStars() {
    stars = [];
    // 星星总数，可以根据需要调整
    const numStars = 300; 
    for (let i = 0; i < numStars; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.5 + 0.2, // 星星大小
        alpha: Math.random(), // 初始透明度
        twinkleSpeed: Math.random() * 0.02 + 0.005, // 闪烁速度
        vx: (Math.random() - 0.5) * 0.1, // X轴缓慢漂移
        vy: (Math.random() - 0.5) * 0.1, // Y轴缓慢漂移
        depth: Math.random() * 2 + 0.5 // 深度，用于鼠标视差
      });
    }
  }

  // 监听鼠标移动，更新全局鼠标坐标
  document.getElementById('stage').addEventListener('mousemove', (e) => {
    const rect = document.getElementById('stage').getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
  });

  // 绘制星空
  function drawStars() {
    ctx.clearRect(0, 0, width, height);

    stars.forEach(star => {
      // 闪烁逻辑
      star.alpha += star.twinkleSpeed;
      if (star.alpha > 1 || star.alpha < 0.1) {
        star.twinkleSpeed *= -1;
      }

      // 坐标漂移逻辑
      star.x += star.vx;
      star.y += star.vy;

      // 边界回绕
      if (star.x < 0) star.x = width;
      if (star.x > width) star.x = 0;
      if (star.y < 0) star.y = height;
      if (star.y > height) star.y = 0;

      // 鼠标视差偏移
      const offsetX = (mouseX - width / 2) * 0.02 * star.depth;
      const offsetY = (mouseY - height / 2) * 0.02 * star.depth;

      // 绘制星星
      ctx.beginPath();
      ctx.arc(star.x - offsetX, star.y - offsetY, star.radius, 0, Math.PI * 2);
      
      // 给部分较大的星星加一点颜色
      if (star.radius > 1.2) {
        ctx.fillStyle = `rgba(200, 230, 255, ${star.alpha})`; // 冷色亮星
      } else {
        ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`; // 普通白星
      }
      ctx.fill();
    });

    // 递归调用实现动画
    requestAnimationFrame(drawStars);
  }


  // ==========================================
  // 2. 太阳系行星逻辑
  // ==========================================
  const planetData = [
    { id: 'mercury', rx: 110, ry: 45, speed: 0.015 },
    { id: 'venus',   rx: 160, ry: 65, speed: 0.01 },
    { id: 'earth',   rx: 220, ry: 90, speed: 0.008, hasMoon: true },
    { id: 'mars',    rx: 280, ry: 115, speed: 0.006 },
    { id: 'jupiter', rx: 400, ry: 170, speed: 0.004 },
    { id: 'saturn',  rx: 520, ry: 220, speed: 0.003, hasRing: true },
    { id: 'uranus',  rx: 640, ry: 270, speed: 0.002 },
    { id: 'neptune', rx: 760, ry: 320, speed: 0.0015 }
  ];

  const container = document.getElementById('planetContainer');
  const planets = []; 

  // 初始化行星 DOM
  planetData.forEach(data => {
    const orbit = document.createElement('div');
    orbit.className = 'orbit';
    orbit.style.width = `${data.rx * 2}px`;
    orbit.style.height = `${data.ry * 2}px`;
    orbit.style.transform += ` rotateZ(${Math.random() * 10 - 5}deg)`;
    container.appendChild(orbit);

    const planet = document.createElement('div');
    planet.className = `planet ${data.id}`;
    
    if (data.hasRing) {
      const ring = document.createElement('div');
      ring.className = 'saturn-ring';
      planet.appendChild(ring);
    }
    
    if (data.hasMoon) {
      const moonOrbit = document.createElement('div');
      moonOrbit.className = 'moon-orbit';
      const moon = document.createElement('div');
      moon.className = 'moon';
      moonOrbit.appendChild(moon);
      planet.appendChild(moonOrbit);
    }
    
    container.appendChild(planet);

    planets.push({
      el: planet,
      rx: data.rx,
      ry: data.ry,
      speed: data.speed,
      angle: Math.random() * Math.PI * 2 
    });
  });

  let currentRotX = 60;
  let currentRotY = 0;
  let targetRotX = 60;
  let targetRotY = 0;
  let currentScale = 1;
  let targetScale = 1;

  const solarSystem = document.getElementById('solarSystem');
  const stage = document.getElementById('stage');

  // 鼠标控制太阳系旋转
  stage.addEventListener('mousemove', (e) => {
    const x = e.clientX / window.innerWidth - 0.5;
    const y = e.clientY / window.innerHeight - 0.5;
    targetRotX = 60 - (y * 60); 
    targetRotY = x * 60;        
  });

  stage.addEventListener('mouseleave', () => {
    targetRotX = 60;
    targetRotY = 0;
  });

  // 滚轮缩放
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    targetScale -= e.deltaY * 0.001;
    if (targetScale < 0.4) targetScale = 0.4;
    if (targetScale > 2.5) targetScale = 2.5;
  });

  let lastTime = performance.now();

  function animate(time) {
    const delta = (time - lastTime) / 16.66; 
    lastTime = time;

    currentRotX += (targetRotX - currentRotX) * 0.05;
    currentRotY += (targetRotY - currentRotY) * 0.05;
    currentScale += (targetScale - currentScale) * 0.05;

    solarSystem.style.transform = `scale(${currentScale}) rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;

    planets.forEach(p => {
      p.angle += p.speed * delta;
      const x = Math.cos(p.angle) * p.rx;
      const y = Math.sin(p.angle) * p.ry;
      
      p.el.style.transform = `translate(-50%, -50%) translate3d(${x}px, ${y}px, 0) rotateX(-75deg)`;
    });

    requestAnimationFrame(animate);
  }

  // ==========================================
  // 3. 时间显示与启动
  // ==========================================
  function updateTime() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false, timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('time-display').textContent = timeStr;
    const dateStr = now.toLocaleDateString('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    let lunarStr = '';
    try {
      const lunar = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric' }).format(now);
      const match = lunar.match(/(.*?年)(.*)/);
      lunarStr = match && match[2] ? `农历${match[2]}` : lunar;
    } catch(e) { lunarStr = '农历获取失败'; }
    document.getElementById('date-display').textContent = `${dateStr} · ${lunarStr}`;
  }

  // 启动所有动画
  window.addEventListener('load', () => {
    resizeCanvas();
    drawStars();
    requestAnimationFrame(animate);
    setInterval(updateTime, 1000);
    updateTime();
  });

  // 窗口大小变化时重置画布
  window.addEventListener('resize', resizeCanvas);
</script>
</body>
</html>
