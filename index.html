<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>oldXh.github.io(目前处于内侧中……)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #0f0f10;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
  }

  .stage {
    position: relative;
    width: 1440px;
    height: 900px;
    flex: 0 0 auto;
    background: radial-gradient(circle at 50% 50%, #1c1c20, #0b0b0d 70%);
    overflow: hidden;
    color: #f2ead8;
  }

  .topbar {
    position: absolute;
    left: 0;
    top: 80px;
    width: 100%;
    height: 30px;
    background: linear-gradient(90deg, rgba(30,58,138,0.8) 0%, rgba(37,99,235,0.8) 50%, rgba(30,58,138,0.8) 100%);
    box-shadow: 0 2px 12px rgba(37, 99, 235, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .topbar a, .dropdown > span {
    color: #ffffff;
    text-decoration: none;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 15px;
    letter-spacing: 0.15em;
    display: inline-block;
    transition: transform 0.2s ease, color 0.2s ease;
    cursor: pointer;
  }

  .topbar a:hover, .dropdown:hover > span {
    transform: scale(1.15);
  }

  .topbar > a:first-child {
    margin-right: 40px; 
  }

  /* 下拉菜单容器 */
  .dropdown {
    position: relative;
    display: inline-block;
    margin-left: 40px;
  }

  /* 透明过桥区，防止鼠标移向下拉框时菜单意外关闭 */
  .dropdown::after {
    content: '';
    position: absolute;
    left: 0;
    top: 100%;
    width: 100%;
    height: 15px;
  }

  /* 下拉列表 */
  .dropdown-menu {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(20, 28, 48, 0.95);
    border: 1px solid rgba(59, 130, 246, 0.4);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 12px rgba(37, 99, 235, 0.2);
    backdrop-filter: blur(8px);
    list-style: none;
    padding: 8px 0;
    min-width: 130px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
    z-index: 101;
  }

  .dropdown:hover .dropdown-menu {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
  }

  .dropdown-menu li a {
    display: block;
    padding: 10px 20px;
    font-size: 14px;
    letter-spacing: 0.1em;
    text-align: center;
    white-space: nowrap;
  }

  .dropdown-menu li a:hover {
    background: rgba(37, 99, 235, 0.3);
    transform: none;
  }

  .at {
    position: absolute;
    left: calc(50% + var(--x, 0px));
    top:  calc(50% - var(--y, 0px));
    transform: translate(-50%, -50%);
  }

  .title {
    --y: 80px;
    width: 556px;
    display: flex;
    justify-content: space-between;
    font-family: "ZCOOL KuaiLe", "站酷快乐体", cursive;
    font-size: 112px;
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0 0 24px rgba(255, 220, 150, .25);
  }

  .subtitle {
    --y: -55px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 48px;
    line-height: 1.2;
    white-space: nowrap;
    letter-spacing: 0.02em;
    color: #cdbf9e;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="topbar">
      <a href="download.html">下载📥</a>
      <a href="aboutus.html">公告📢</a>
      
      <!-- 可下拉的“其他”菜单 -->
      <div class="dropdown">
        <span>其他 ▾</span>
        <ul class="dropdown-menu">
          <li><a href="weather.html">天气预报 ☁️</a></li>
        </ul>
      </div>
    </div>

    <div class="at title">
      <span>欢</span><span>迎</span><span>光</span><span>临</span>
    </div>
    <div class="at subtitle">Happy new year~</div>
  </div>
</body>
</html>
