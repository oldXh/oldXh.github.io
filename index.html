<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>oldXh.github.io (目前处于内侧中……)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #050508;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    position: relative;
    width: 1440px;
    height: 900px;
    flex: 0 0 auto;
    background: radial-gradient(circle at 50% 50%, #111116, #050508 80%);
    overflow: hidden;
    color: #f2ead8;
  }

  /* 动态星空 Canvas */
  #starfield {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* --- 太阳系容器 (使用 2D 倾斜，避免 3D 拉伸) --- */
  .solar-system {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    z-index: 1;
    /* 整体倾斜，产生俯视椭圆的错觉 */
    transform: translate(-50%, -50%) rotateX(65deg);
    transform-style: preserve-3d;
    transition: transform 0.1s ease-out;
  }

  /* ================== 立体太阳 ================== */
  .sun {
    position: absolute;
    top: 50%; left: 50%;
    width: 120px; height: 120px;
    /* 抵消容器的倾斜 */
    transform: translate(-50%, -50%) rotateX(-65deg);
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffffff 0%, #fff5cc 10%, #ffb300 35%, #ff3d00 65%, #7a0000 100%);
    box-shadow: 
      inset -15px -15px 30px rgba(100, 0, 0, 0.9),
      inset 5px 5px 20px rgba(255, 255, 255, 0.5),
      0 0 50px #ffb300,
      0 0 150px rgba(255, 61, 0, 0.6),
      0 0 250px rgba(255, 61, 0, 0.3);
    animation: sunPulse 4s infinite alternate;
  }

  @keyframes sunPulse {
    0% { box-shadow: inset -15px -15px 30px rgba(100,0,0,0.9), inset 5px 5px 20px rgba(255,255,255,0.5), 0 0 50px #ffb300, 0 0 150px rgba(255, 61, 0, 0.6), 0 0 250px rgba(255, 61, 0, 0.3); }
    100% { box-shadow: inset -15px -15px 30px rgba(100,0,0,0.9), inset 5px 5px 20px rgba(255,255,255,0.5), 0 0 80px #ffda00, 0 0 200px rgba(255, 61, 0, 0.8), 0 0 350px rgba(255, 61, 0, 0.4); }
  }

  /* 轨道 */
  .orbit {
    position: absolute;
    top: 50%; left: 50%;
    border: 1px dashed rgba(255, 255, 255, 0.08);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  /* 行星通用基础 (抵消容器倾斜，保持立体正圆) */
  .planet {
    position: absolute;
    top: 50%; left: 50%;
    border-radius: 50%;
    transform: translate(-50%, -50%) rotateX(-65deg);
    /* 极其强烈的内阴影，制造立体球体感 */
    box-shadow: inset -6px -6px 15px rgba(0,0,0,0.95);
  }

  /* 高光层：所有行星共享的左侧受光点 */
  .planet::before {
    content: '';
    position: absolute;
    top: 15%; left: 15%;
    width: 40%; height: 40%;
    background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  /* ================== 极致立体的星球材质 ================== */
  
  /* 水星 (灰褐岩石) */
  .mercury {
    width: 14px; height: 14px;
    background: radial-gradient(circle at 30% 30%, #a8a8a8, #444 80%);
  }
  
  /* 金星 (厚重黄云) */
  .venus {
    width: 22px; height: 22px;
    background: radial-gradient(circle at 30% 30%, #fff0b3, #d49a47 60%, #5c350b 100%);
  }
  
  /* 地球 (海洋、陆地与大气层) */
  .earth {
    width: 24px; height: 24px;
    background: 
      /* 云层反光 */
      radial-gradient(circle at 65% 35%, rgba(255,255,255,0.5) 5%, transparent 20%),
      /* 陆地 (绿色斑块) */
      radial-gradient(circle at 25% 35%, #2ecc71 10%, #27ae60 20%, transparent 25%),
      radial-gradient(circle at 70% 65%, #2ecc71 15%, #27ae60 25%, transparent 35%),
      /* 海洋底色 */
      radial-gradient(circle at 30% 30%, #6bb9ff, #1d6eaa 60%, #051d33 100%);
    /* 地球独有的外圈蓝色大气层光晕 */
    box-shadow: 
      inset -6px -6px 15px rgba(0,0,0,0.9),
      0 0 10px rgba(79, 163, 255, 0.6);
  }
  
  /* 火星 (红褐荒漠) */
  .mars {
    width: 18px; height: 18px;
    background: radial-gradient(circle at 30% 30%, #ff8c66, #b03010 60%, #3d0800 100%);
  }
  
  /* 木星 (强烈的球面气流条纹) */
  .jupiter {
    width: 60px; height: 60px;
    background: 
      /* 球面暗角遮罩，让条纹产生弧度感 */
      radial-gradient(circle at 30% 30%, transparent 20%, rgba(0,0,0,0.8) 90%),
      /* 横向条纹 */
      linear-gradient(
        to bottom,
        #d4c4a8 5%, #b89270 15%, #e8d5b5 25%, #a87755 35%, 
        #e8d5b5 45%, #b89270 55%, #e8d5b5 65%, #a87755 75%, 
        #d4c4a8 85%, #b89270 95%
      );
    box-shadow: inset -8px -8px 20px rgba(0,0,0,0.95);
  }
  
  /* 土星 (淡黄气体) */
  .saturn {
    width: 50px; height: 50px;
    background: radial-gradient(circle at 30% 30%, #f7e4b5, #c7a366 60%, #5c4010 100%);
  }
  
  /* 天王星 (冰蓝) */
  .uranus {
    width: 36px; height: 36px;
    background: radial-gradient(circle at 30% 30%, #c4fdfb, #3d9e9b 60%, #0d3d3b 100%);
  }
  
  /* 海王星 (深蓝) */
  .neptune {
    width: 34px; height: 34px;
    background: radial-gradient(circle at 30% 30%, #85aaff, #2b55ba 60%, #08133d 100%);
  }

  /* 土星环 (具有遮挡关系的立体环) */
  .saturn-ring {
    position: absolute;
    top: 50%; left: 50%;
    width: 110px; height: 30px;
    border: 4px solid rgba(210, 180, 140, 0.7);
    border-radius: 50%;
    /* 倾斜形成透视 */
    transform: translate(-50%, -50%) rotateX(75deg) rotateY(-15deg);
    box-shadow: 0 0 10px rgba(210, 180, 140, 0.3), inset 0 0 10px rgba(0,0,0,0.6);
    pointer-events: none;
  }

  /* 地球的月球 (小立体球) */
  .moon-orbit {
    position: absolute;
    top: 50%; left: 50%;
    width: 45px; height: 45px;
    border: 1px dashed rgba(255,255,255,0.15);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: spinMoon 4s linear infinite;
    pointer-events: none;
  }
  .moon {
    position: absolute;
    top: 0; left: 50%;
    width: 6px; height: 6px;
    background: radial-gradient(circle at 30% 30%, #fff, #777);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: inset -1px -1px 3px rgba(0,0,0,0.9);
  }
  @keyframes spinMoon {
    from { transform: translate(-50%, -50%) rotateZ(0deg); }
    to { transform: translate(-50%, -50%) rotateZ(360deg); }
  }

  /* --- 顶部导航栏 --- */
  .topbar {
    position: absolute;
    left: 0;
    top: 70px; 
    width: 100%;
    height: 42px; 
    background: linear-gradient(90deg, rgba(30,58,138,0.6) 0%, rgba(37,99,235,0.7) 50%, rgba(30,58,138,0.6) 100%);
    box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(6px);
  }

  .topbar a, .dropdown > span {
    color: #ffffff;
    text-decoration: none;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 16px; 
    letter-spacing: 0.15em;
    display: inline-block;
    transition: transform 0.2s ease;
    cursor: pointer;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .topbar a:hover, .dropdown:hover > span { transform: scale(1.15); }
  .topbar > a:first-child { margin-right: 50px; }

  .dropdown { position: relative; display: inline-block; margin-left: 50px; }
  .dropdown::after { content: ''; position: absolute; left: 0; top: 100%; width: 100%; height: 15px; }
  .dropdown-menu {
    position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%) translateY(15px);
    background: rgba(20, 28, 48, 0.95);
    border: 1px solid rgba(59, 130, 246, 0.4);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px); list-style: none; padding: 8px 0; min-width: 140px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
    z-index: 101;
  }
  .dropdown:hover .dropdown-menu { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  .dropdown-menu li a { display: block; padding: 12px 24px; font-size: 15px; letter-spacing: 0.1em; text-align: center; white-space: nowrap; }
  .dropdown-menu li a:hover { background: rgba(37, 99, 235, 0.3); transform: none; }

  /* --- 中心文字 (浮在最上层) --- */
  .at {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }

  .title-time {
    font-family: "ZCOOL KuaiLe", "站酷快乐体", cursive;
    font-size: 110px;
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 50px rgba(96, 165, 250, 0.2);
    letter-spacing: 0.05em;
    color: #f2ead8;
  }

  .subtitle-date {
    margin-top: 10px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 30px;
    white-space: nowrap;
    letter-spacing: 0.1em;
    color: #cdbf9e;
    text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 10px rgba(96, 165, 250, 0.3);
  }
  
  .zoom-tip {
    position: absolute;
    bottom: 30px;
    left: 30px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.3);
    pointer-events: none;
    z-index: 10;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="starfield"></canvas>

    <div class="solar-system" id="solarSystem">
      <div class="sun"></div>
      <div id="planetContainer"></div>
    </div>

    <div class="topbar">
      <a href="download.html">下载📥</a>
      <a href="aboutus.html">公告📢</a>
      <div class="dropdown">
        <span>其他 ▾</span>
        <ul class="dropdown-menu">
          <li><a href="weather.html">天气预报 ☁️</a></li>
          <li><a href="eq.html">解方程 🧮</a></li>
        </ul>
      </div>
    </div>

    <div class="at">
      <div class="title-time" id="time-display">--:--:--</div>
      <div class="subtitle-date" id="date-display">加载中...</div>
    </div>

    <div class="zoom-tip">移动鼠标探索星系 / 滚轮缩放</div>
  </div>

<script>
  // ==========================================
  // 1. Canvas 动态星空背景
  // ==========================================
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let width, height;
  let stars = [];
  let mouseX = 0, mouseY = 0;

  function resizeCanvas() {
    const stage = document.getElementById('stage');
    width = canvas.width = stage.clientWidth;
    height = canvas.height = stage.clientHeight;
    initStars();
  }

  function initStars() {
    stars = [];
    const numStars = 300; 
    for (let i = 0; i < numStars; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.5 + 0.2,
        alpha: Math.random(),
        twinkleSpeed: Math.random() * 0.02 + 0.005,
        vx: (Math.random() - 0.5) * 0.1,
        vy: (Math.random() - 0.5) * 0.1,
        depth: Math.random() * 2 + 0.5
      });
    }
  }

  document.getElementById('stage').addEventListener('mousemove', (e) => {
    const rect = document.getElementById('stage').getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
  });

  function drawStars() {
    ctx.clearRect(0, 0, width, height);

    stars.forEach(star => {
      star.alpha += star.twinkleSpeed;
      if (star.alpha > 1 || star.alpha < 0.1) star.twinkleSpeed *= -1;
      star.x += star.vx;
      star.y += star.vy;

      if (star.x < 0) star.x = width;
      if (star.x > width) star.x = 0;
      if (star.y < 0) star.y = height;
      if (star.y > height) star.y = 0;

      const offsetX = (mouseX - width / 2) * 0.02 * star.depth;
      const offsetY = (mouseY - height / 2) * 0.02 * star.depth;

      ctx.beginPath();
      ctx.arc(star.x - offsetX, star.y - offsetY, star.radius, 0, Math.PI * 2);
      ctx.fillStyle = star.radius > 1.2 ? `rgba(200, 230, 255, ${star.alpha})` : `rgba(255, 255, 255, ${star.alpha})`;
      ctx.fill();
    });

    requestAnimationFrame(drawStars);
  }


  // ==========================================
  // 2. 太阳系行星逻辑
  // ==========================================
  const planetData = [
    { id: 'mercury', rx: 140, ry: 60, speed: 0.015 },
    { id: 'venus',   rx: 210, ry: 90, speed: 0.01 },
    { id: 'earth',   rx: 290, ry: 125, speed: 0.008, hasMoon: true },
    { id: 'mars',    rx: 370, ry: 160, speed: 0.006 },
    { id: 'jupiter', rx: 520, ry: 225, speed: 0.004 },
    { id: 'saturn',  rx: 660, ry: 285, speed: 0.003, hasRing: true },
    { id: 'uranus',  rx: 790, ry: 340, speed: 0.002 },
    { id: 'neptune', rx: 920, ry: 400, speed: 0.0015 }
  ];

  const container = document.getElementById('planetContainer');
  const planets = []; 

  planetData.forEach(data => {
    const orbit = document.createElement('div');
    orbit.className = 'orbit';
    orbit.style.width = `${data.rx * 2}px`;
    orbit.style.height = `${data.ry * 2}px`;
    container.appendChild(orbit);

    const planet = document.createElement('div');
    planet.className = `planet ${data.id}`;
    
    if (data.hasRing) {
      const ring = document.createElement('div');
      ring.className = 'saturn-ring';
      planet.appendChild(ring);
    }
    
    if (data.hasMoon) {
      const moonOrbit = document.createElement('div');
      moonOrbit.className = 'moon-orbit';
      const moon = document.createElement('div');
      moon.className = 'moon';
      moonOrbit.appendChild(moon);
      planet.appendChild(moonOrbit);
    }
    
    container.appendChild(planet);

    planets.push({
      el: planet,
      rx: data.rx,
      ry: data.ry,
      speed: data.speed,
      angle: Math.random() * Math.PI * 2 
    });
  });

  // 交互变量
  let currentRotX = 65;
  let currentRotY = 0;
  let targetRotX = 65;
  let targetRotY = 0;
  let currentScale = 1;
  let targetScale = 1;

  const solarSystem = document.getElementById('solarSystem');
  const stage = document.getElementById('stage');

  stage.addEventListener('mousemove', (e) => {
    const x = e.clientX / window.innerWidth - 0.5;
    const y = e.clientY / window.innerHeight - 0.5;
    // 鼠标控制整个系统的倾斜角和旋转
    targetRotX = 65 - (y * 40); 
    targetRotY = x * 40;        
  });

  stage.addEventListener('mouseleave', () => {
    targetRotX = 65;
    targetRotY = 0;
  });

  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    targetScale -= e.deltaY * 0.001;
    if (targetScale < 0.4) targetScale = 0.4;
    if (targetScale > 2.5) targetScale = 2.5;
  });

  let lastTime = performance.now();

  function animate(time) {
    const delta = (time - lastTime) / 16.66; 
    lastTime = time;

    // 平滑过渡鼠标造成的倾斜
    currentRotX += (targetRotX - currentRotX) * 0.05;
    currentRotY += (targetRotY - currentRotY) * 0.05;
    currentScale += (targetScale - currentScale) * 0.05;

    // 整体缩放和旋转
    solarSystem.style.transform = `translate(-50%, -50%) rotateX(${currentRotX}deg) rotateY(${currentRotY}deg) scale(${currentScale})`;

    planets.forEach(p => {
      p.angle += p.speed * delta;
      const x = Math.cos(p.angle) * p.rx;
      const y = Math.sin(p.angle) * p.ry;
      
      // 行星位移，并抵消父级的 X 轴倾斜，让其永远面向屏幕（保持立体）
      p.el.style.transform = `translate(-50%, -50%) translate3d(${x}px, ${y}px, 0) rotateX(-65deg)`;
    });

    requestAnimationFrame(animate);
  }

  // ==========================================
  // 3. 时间显示与启动
  // ==========================================
  function updateTime() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false, timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('time-display').textContent = timeStr;
    const dateStr = now.toLocaleDateString('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    let lunarStr = '';
    try {
      const lunar = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric' }).format(now);
      const match = lunar.match(/(.*?年)(.*)/);
      lunarStr = match && match[2] ? `农历${match[2]}` : lunar;
    } catch(e) { lunarStr = '农历获取失败'; }
    document.getElementById('date-display').textContent = `${dateStr} · ${lunarStr}`;
  }

  window.addEventListener('load', () => {
    resizeCanvas();
    drawStars();
    requestAnimationFrame(animate);
    setInterval(updateTime, 1000);
    updateTime();
  });

  window.addEventListener('resize', resizeCanvas);
</script>
</body>
</html>
