<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>oldXh.github.io (目前处于内侧中……)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #050508;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 深空背景与星尘 */
  .stage {
    position: relative;
    width: 1440px;
    height: 900px;
    flex: 0 0 auto;
    background: radial-gradient(circle at 50% 50%, #111116, #050508 80%);
    overflow: hidden;
    color: #f2ead8;
    /* 开启 3D 视角 */
    perspective: 1200px;
  }

  /* 缓慢旋转的星空背景 */
  .stars-bg {
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background-image: 
      radial-gradient(1px 1px at 10% 10%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 20% 40%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 40% 70%, #fff, transparent),
      radial-gradient(2px 2px at 60% 20%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 80% 50%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 90% 80%, rgba(255,255,255,0.9), transparent);
    background-size: 300px 300px;
    opacity: 0.3;
    animation: rotateBg 120s linear infinite;
    z-index: 0;
  }

  @keyframes rotateBg {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* --- 太阳系 3D 容器 --- */
  .solar-system {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    /* 开启子元素的 3D 空间保留 */
    transform-style: preserve-3d;
    z-index: 1;
    /* 鼠标交互时的平滑过渡 */
    transition: transform 0.1s ease-out;
  }

  /* 太阳 */
  .sun {
    position: absolute;
    top: 50%; left: 50%;
    width: 80px; height: 80px;
    transform: translate(-50%, -50%) translateZ(0);
    background: radial-gradient(circle at 30% 30%, #fff7b0, #ffb300 40%, #ff3d00 80%);
    border-radius: 50%;
    box-shadow: 
      0 0 40px #ffb300,
      0 0 100px rgba(255, 61, 0, 0.6),
      0 0 200px rgba(255, 61, 0, 0.2);
    animation: sunPulse 4s infinite alternate;
  }

  @keyframes sunPulse {
    0% { box-shadow: 0 0 40px #ffb300, 0 0 100px rgba(255, 61, 0, 0.6), 0 0 200px rgba(255, 61, 0, 0.2); }
    100% { box-shadow: 0 0 60px #ffda00, 0 0 150px rgba(255, 61, 0, 0.8), 0 0 300px rgba(255, 61, 0, 0.4); }
  }

  /* 轨道盘面 (倾斜成椭圆) */
  .orbit {
    position: absolute;
    top: 50%; left: 50%;
    border: 1px dashed rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    transform-style: preserve-3d;
    /* 稍微倾斜，产生 3D 景深 */
    transform: translate(-50%, -50%) rotateX(75deg);
  }

  /* 行星通用样式 */
  .planet {
    position: absolute;
    top: 50%; left: 50%;
    border-radius: 50%;
    /* 抵消轨道的旋转，让行星本身保持竖直 */
    transform: translate(-50%, -50%) rotateX(-75deg);
    box-shadow: inset -2px -2px 6px rgba(0,0,0,0.8);
    transform-style: preserve-3d;
  }

  /* 具体星球尺寸与材质 */
  .mercury {
    width: 8px; height: 8px;
    background: radial-gradient(circle at 30% 30%, #a8a8a8, #555);
  }
  .venus {
    width: 14px; height: 14px;
    background: radial-gradient(circle at 30% 30%, #ffe4a0, #c28a34);
  }
  .earth {
    width: 16px; height: 16px;
    background: radial-gradient(circle at 30% 30%, #4fa3ff, #1d6eaa 60%, #0a3d62);
  }
  .mars {
    width: 12px; height: 12px;
    background: radial-gradient(circle at 30% 30%, #ff7b54, #9c2915);
  }
  .jupiter {
    width: 40px; height: 40px;
    background: radial-gradient(circle at 30% 30%, #e8d5b5, #b68764 60%, #7a4b2e);
  }
  .saturn {
    width: 34px; height: 34px;
    background: radial-gradient(circle at 30% 30%, #f7e4b5, #c7a366 60%, #8f692d);
  }
  .uranus {
    width: 24px; height: 24px;
    background: radial-gradient(circle at 30% 30%, #b0f2ef, #3d9e9b 60%, #165f5d);
  }
  .neptune {
    width: 22px; height: 22px;
    background: radial-gradient(circle at 30% 30%, #6b9cff, #2b55ba 60%, #102c75);
  }

  /* 土星环 */
  .saturn-ring {
    position: absolute;
    top: 50%; left: 50%;
    width: 70px; height: 18px;
    border: 3px solid rgba(210, 180, 140, 0.6);
    border-radius: 50%;
    transform: translate(-50%, -50%) rotateX(75deg) rotateY(15deg);
    box-shadow: 0 0 10px rgba(210, 180, 140, 0.3);
  }

  /* 月球 (绕地球) */
  .moon-orbit {
    position: absolute;
    top: 50%; left: 50%;
    width: 40px; height: 40px;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: spinMoon 3s linear infinite;
  }
  .moon {
    position: absolute;
    top: 0; left: 50%;
    width: 5px; height: 5px;
    background: #ccc;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  @keyframes spinMoon {
    from { transform: translate(-50%, -50%) rotateZ(0deg); }
    to { transform: translate(-50%, -50%) rotateZ(360deg); }
  }

  /* --- 顶部导航栏 --- */
  .topbar {
    position: absolute;
    left: 0;
    top: 70px; 
    width: 100%;
    height: 42px; 
    background: linear-gradient(90deg, rgba(30,58,138,0.6) 0%, rgba(37,99,235,0.7) 50%, rgba(30,58,138,0.6) 100%);
    box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(6px);
  }

  .topbar a, .dropdown > span {
    color: #ffffff;
    text-decoration: none;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 16px; 
    letter-spacing: 0.15em;
    display: inline-block;
    transition: transform 0.2s ease;
    cursor: pointer;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .topbar a:hover, .dropdown:hover > span { transform: scale(1.15); }
  .topbar > a:first-child { margin-right: 50px; }

  .dropdown { position: relative; display: inline-block; margin-left: 50px; }
  .dropdown::after { content: ''; position: absolute; left: 0; top: 100%; width: 100%; height: 15px; }
  .dropdown-menu {
    position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%) translateY(15px);
    background: rgba(20, 28, 48, 0.95);
    border: 1px solid rgba(59, 130, 246, 0.4);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px); list-style: none; padding: 8px 0; min-width: 140px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
    z-index: 101;
  }
  .dropdown:hover .dropdown-menu { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  .dropdown-menu li a { display: block; padding: 12px 24px; font-size: 15px; letter-spacing: 0.1em; text-align: center; white-space: nowrap; }
  .dropdown-menu li a:hover { background: rgba(37, 99, 235, 0.3); transform: none; }

  /* --- 中心文字 (时间/日期) --- */
  .at {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
    transform-style: preserve-3d;
    /* 让文字浮在星系上方 */
    translate: 0 0 100px;
  }

  .title-time {
    font-family: "ZCOOL KuaiLe", "站酷快乐体", cursive;
    font-size: 100px;
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 50px rgba(96, 165, 250, 0.2);
    letter-spacing: 0.05em;
    color: #f2ead8;
  }

  .subtitle-date {
    margin-top: 10px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 28px;
    white-space: nowrap;
    letter-spacing: 0.1em;
    color: #cdbf9e;
    text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 10px rgba(96, 165, 250, 0.3);
  }
  
  .zoom-tip {
    position: absolute;
    bottom: 30px;
    left: 30px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.3);
    pointer-events: none;
    z-index: 10;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="stars-bg"></div>

    <!-- 3D 太阳系 -->
    <div class="solar-system" id="solarSystem">
      <div class="sun"></div>

      <!-- 轨道与行星的容器 -->
      <div id="planetContainer"></div>
    </div>

    <!-- 导航栏 -->
    <div class="topbar">
      <a href="download.html">下载📥</a>
      <a href="aboutus.html">公告📢</a>
      <div class="dropdown">
        <span>其他 ▾</span>
        <ul class="dropdown-menu">
          <li><a href="weather.html">天气预报 ☁️</a></li>
          <li><a href="eq.html">解方程 🧮</a></li>
        </ul>
      </div>
    </div>

    <!-- 时间文字 (浮在星图上方) -->
    <div class="at">
      <div class="title-time" id="time-display">--:--:--</div>
      <div class="subtitle-date" id="date-display">加载中...</div>
    </div>

    <div class="zoom-tip">移动鼠标探索星系 / 滚轮缩放</div>
  </div>

<script>
  // 行星数据定义 (半径 rx, ry 比例生成椭圆；速度为公转相对速度)
  const planetData = [
    { id: 'mercury', rx: 100, ry: 40, size: 8, speed: 0.015, color: '#a8a8a8' },
    { id: 'venus',   rx: 150, ry: 60, size: 14, speed: 0.01, color: '#ffe4a0' },
    { id: 'earth',   rx: 210, ry: 85, size: 16, speed: 0.008, color: '#4fa3ff', hasMoon: true },
    { id: 'mars',    rx: 270, ry: 110, size: 12, speed: 0.006, color: '#ff7b54' },
    { id: 'jupiter', rx: 380, ry: 160, size: 40, speed: 0.004, color: '#e8d5b5' },
    { id: 'saturn',  rx: 500, ry: 210, size: 34, speed: 0.003, color: '#f7e4b5', hasRing: true },
    { id: 'uranus',  rx: 620, ry: 260, size: 24, speed: 0.002, color: '#b0f2ef' },
    { id: 'neptune', rx: 740, ry: 310, size: 22, speed: 0.0015, color: '#6b9cff' }
  ];

  const container = document.getElementById('planetContainer');
  const planets = []; // 保存行星 DOM 和当前角度

  // 初始化 DOM
  planetData.forEach(data => {
    // 创建轨道
    const orbit = document.createElement('div');
    orbit.className = 'orbit';
    orbit.style.width = `${data.rx * 2}px`;
    orbit.style.height = `${data.ry * 2}px`;
    // 随机给轨道一点点 Z 轴倾斜，增加错落感
    orbit.style.transform += ` rotateZ(${Math.random() * 10 - 5}deg)`;
    container.appendChild(orbit);

    // 创建行星
    const planet = document.createElement('div');
    planet.className = `planet ${data.id}`;
    // 为土星添加光环
    if (data.hasRing) {
      const ring = document.createElement('div');
      ring.className = 'saturn-ring';
      planet.appendChild(ring);
    }
    // 为地球添加月球
    if (data.hasMoon) {
      const moonOrbit = document.createElement('div');
      moonOrbit.className = 'moon-orbit';
      const moon = document.createElement('div');
      moon.className = 'moon';
      moonOrbit.appendChild(moon);
      planet.appendChild(moonOrbit);
    }
    
    container.appendChild(planet);

    // 保存状态
    planets.push({
      el: planet,
      rx: data.rx,
      ry: data.ry,
      speed: data.speed,
      angle: Math.random() * Math.PI * 2 // 初始角度随机
    });
  });

  // 动画变量
  let currentRotX = 60;
  let currentRotY = 0;
  let targetRotX = 60;
  let targetRotY = 0;
  let currentScale = 1;
  let targetScale = 1;

  const solarSystem = document.getElementById('solarSystem');
  const stage = document.querySelector('.stage');

  // 鼠标移动：改变星系 3D 旋转视角
  stage.addEventListener('mousemove', (e) => {
    const x = e.clientX / window.innerWidth - 0.5;
    const y = e.clientY / window.innerHeight - 0.5;
    
    // 鼠标移动控制旋转幅度
    targetRotX = 60 - (y * 60); // X轴倾斜
    targetRotY = x * 60;        // Y轴左右旋转
  });

  stage.addEventListener('mouseleave', () => {
    targetRotX = 60;
    targetRotY = 0;
  });

  // 滚轮缩放
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    targetScale -= e.deltaY * 0.001;
    // 限制缩放范围
    if (targetScale < 0.4) targetScale = 0.4;
    if (targetScale > 2.5) targetScale = 2.5;
  });

  // 动画循环
  let lastTime = performance.now();

  function animate(time) {
    const delta = (time - lastTime) / 16.66; // 归一化到 60fps
    lastTime = time;

    // 平滑插值：星系旋转
    currentRotX += (targetRotX - currentRotX) * 0.05;
    currentRotY += (targetRotY - currentRotY) * 0.05;
    currentScale += (targetScale - currentScale) * 0.05;

    // 应用整体的 3D 变换
    solarSystem.style.transform = `scale(${currentScale}) rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;

    // 计算每个行星的实时公转位置
    planets.forEach(p => {
      p.angle += p.speed * delta;
      // 根据椭圆方程计算 X 和 Y
      const x = Math.cos(p.angle) * p.rx;
      const y = Math.sin(p.angle) * p.ry;
      
      // 为了防止行星在椭圆轨道两端发生缩放（因为透视），直接使用 2D 位移
      // 但要抵消父级轨道的 rotateX 旋转，让行星保持立体的圆形
      p.el.style.transform = `translate(-50%, -50%) translate3d(${x}px, ${y}px, 0) rotateX(-75deg)`;
    });

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);

  // --- 时间和农历更新 ---
  function updateTime() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false, timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('time-display').textContent = timeStr;
    const dateStr = now.toLocaleDateString('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    let lunarStr = '';
    try {
      const lunar = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric' }).format(now);
      const match = lunar.match(/(.*?年)(.*)/);
      lunarStr = match && match[2] ? `农历${match[2]}` : lunar;
    } catch(e) { lunarStr = '农历获取失败'; }
    document.getElementById('date-display').textContent = `${dateStr} · ${lunarStr}`;
  }
  setInterval(updateTime, 1000);
  updateTime();
</script>
</body>
</html>
