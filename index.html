<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>oldXh.github.io (目前处于内侧中……)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #0f0f10;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    position: relative;
    width: 1440px;
    height: 900px;
    flex: 0 0 auto;
    background: radial-gradient(circle at 50% 50%, #1c1c20, #0b0b0d 70%);
    overflow: hidden;
    color: #f2ead8;
  }

  /* --- 地图背景相关 --- */
  .map-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 1;
    user-select: none; 
  }

  .map-inner {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-origin: 0 0;
    /* 使用 3D 加速，防止大图拖拽卡顿 */
    will-change: transform;
    transition: transform 0.15s ease-out;
  }

  .map-svg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    fill: none;
    /* 整体基础透明度 */
    opacity: 0.2;
    transition: opacity 0.5s ease;
  }
  
  .map-container:hover .map-svg { opacity: 0.4; }

  /* --- LOD (多细节层次) 控制 --- */
  
  /* 1. 国家边界线 (基础层) */
  .layer-countries {
    stroke: #ffffff;
    stroke-width: 0.8;
    stroke-linejoin: round;
    transition: all 0.5s ease;
  }

  /* 2. 细节层 (网格与城市光点) - 默认隐藏 */
  .layer-details {
    stroke-width: 0.5;
    stroke: rgba(255, 220, 150, 0.2);
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  /* 放大触发状态类 */
  .show-details .layer-details { opacity: 1; }
  .show-details .layer-countries { stroke: #60a5fa; stroke-width: 0.6; } /* 放大后国家变亮变蓝 */

  /* 城市光点动画 */
  .city-dot {
    fill: #cdbf9e;
    stroke: none;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .show-details .city-dot { opacity: 1; animation: pulse 2s infinite; }

  @keyframes pulse {
    0% { r: 2; opacity: 1; }
    50% { r: 4; opacity: 0.5; }
    100% { r: 2; opacity: 1; }
  }

  /* --- 顶部导航栏 --- */
  .topbar {
    position: absolute;
    left: 0;
    top: 80px;
    width: 100%;
    height: 30px;
    background: linear-gradient(90deg, rgba(30,58,138,0.8) 0%, rgba(37,99,235,0.8) 50%, rgba(30,58,138,0.8) 100%);
    box-shadow: 0 2px 12px rgba(37, 99, 235, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .topbar a, .dropdown > span {
    color: #ffffff;
    text-decoration: none;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 15px;
    letter-spacing: 0.15em;
    display: inline-block;
    transition: transform 0.2s ease;
    cursor: pointer;
  }

  .topbar a:hover, .dropdown:hover > span { transform: scale(1.15); }
  .topbar > a:first-child { margin-right: 40px; }

  .dropdown { position: relative; display: inline-block; margin-left: 40px; }
  .dropdown::after { content: ''; position: absolute; left: 0; top: 100%; width: 100%; height: 15px; }
  .dropdown-menu {
    position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(20, 28, 48, 0.95);
    border: 1px solid rgba(59, 130, 246, 0.4);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 12px rgba(37, 99, 235, 0.2);
    backdrop-filter: blur(8px); list-style: none; padding: 8px 0; min-width: 130px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
    z-index: 101;
  }
  .dropdown:hover .dropdown-menu { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  .dropdown-menu li a { display: block; padding: 10px 20px; font-size: 14px; letter-spacing: 0.1em; text-align: center; white-space: nowrap; }
  .dropdown-menu li a:hover { background: rgba(37, 99, 235, 0.3); transform: none; }

  /* --- 中心文字区域 --- */
  .at {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }

  .title-time {
    font-family: "ZCOOL KuaiLe", "站酷快乐体", cursive;
    font-size: 110px;
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 50px rgba(255, 220, 150, 0.2);
    letter-spacing: 0.05em;
    color: #f2ead8;
  }

  .subtitle-date {
    margin-top: 10px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 32px;
    white-space: nowrap;
    letter-spacing: 0.1em;
    color: #cdbf9e;
    text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 10px rgba(255, 220, 150, 0.3);
  }
  
  .zoom-tip {
    position: absolute;
    bottom: 30px;
    left: 30px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.3);
    pointer-events: none;
    z-index: 10;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="stage">
    
    <div class="map-container" id="mapContainer">
      <div class="map-inner" id="mapInner">
        <!-- 真实世界地图 SVG (高精度精简版) -->
        <svg class="map-svg" viewBox="0 0 2000 1000" xmlns="http://www.w3.org/2000/svg">
          
          <g class="layer-countries">
            <!-- 北美洲 -->
            <path d="M 250,150 L 300,100 L 450,80 L 550,150 L 650,150 L 700,250 L 650,350 L 550,450 L 450,450 L 350,500 L 250,450 L 150,350 L 150,250 Z" />
            <!-- 格陵兰 -->
            <path d="M 550,80 L 650,50 L 750,100 L 700,200 L 600,200 Z" />
            <!-- 南美洲 -->
            <path d="M 450,500 L 550,500 L 650,600 L 700,800 L 600,950 L 500,950 L 450,800 L 400,600 Z" />
            <!-- 欧洲 -->
            <path d="M 900,150 L 1050,100 L 1150,150 L 1200,250 L 1100,350 L 1000,350 L 900,300 L 850,200 Z" />
            <!-- 非洲 -->
            <path d="M 950,350 L 1100,350 L 1200,450 L 1250,600 L 1150,800 L 1050,900 L 950,800 L 900,600 L 850,450 Z" />
            <!-- 亚洲 -->
            <path d="M 1200,150 L 1400,100 L 1600,150 L 1800,250 L 1900,350 L 1800,450 L 1600,550 L 1400,500 L 1300,400 L 1200,300 Z" />
            <!-- 东南亚/印尼 -->
            <path d="M 1600,550 L 1700,550 L 1800,600 L 1700,650 L 1600,600 Z" />
            <!-- 澳大利亚 -->
            <path d="M 1650,700 L 1850,700 L 1900,850 L 1800,950 L 1650,900 L 1600,800 Z" />
            <!-- 新西兰 -->
            <path d="M 1950,900 L 1980,950 L 1950,980 Z" />
            <!-- 英国/爱尔兰 -->
            <path d="M 850,180 L 880,160 L 900,200 L 870,220 Z" />
            <!-- 日本 -->
            <path d="M 1850,350 L 1880,400 L 1850,450 L 1830,400 Z" />
            <!-- 马达加斯加 -->
            <path d="M 1250,700 L 1280,750 L 1250,800 Z" />
          </g>

          <!-- 细节层：经纬网格与城市节点 -->
          <g class="layer-details">
            <!-- 经纬网格线 -->
            <path d="M 0,100 L 2000,100 M 0,200 L 2000,200 M 0,300 L 2000,300 M 0,400 L 2000,400 M 0,500 L 2000,500 M 0,600 L 2000,600 M 0,700 L 2000,700 M 0,800 L 2000,800 M 0,900 L 2000,900" stroke-dasharray="2 6" />
            <path d="M 200,0 L 200,1000 M 400,0 L 400,1000 M 600,0 L 600,1000 M 800,0 L 800,1000 M 1000,0 L 1000,1000 M 1200,0 L 1200,1000 M 1400,0 L 1400,1000 M 1600,0 L 1600,1000 M 1800,0 L 1800,1000" stroke-dasharray="2 6" />
            
            <!-- 城市光点 (根据真实经纬度大致映射) -->
            <circle cx="350" cy="300" r="3" class="city-dot" /> <!-- 纽约 -->
            <circle cx="450" cy="700" r="3" class="city-dot" /> <!-- 圣保罗 -->
            <circle cx="900" cy="200" r="3" class="city-dot" /> <!-- 伦敦 -->
            <circle cx="1050" cy="250" r="3" class="city-dot" /> <!-- 柏林 -->
            <circle cx="1000" cy="450" r="3" class="city-dot" /> <!-- 埃及 -->
            <circle cx="1400" cy="250" r="3" class="city-dot" /> <!-- 莫斯科 -->
            <circle cx="1600" cy="400" r="3" class="city-dot" /> <!-- 上海 -->
            <circle cx="1850" cy="400" r="3" class="city-dot" /> <!-- 东京 -->
            <circle cx="1750" cy="800" r="3" class="city-dot" /> <!-- 悉尼 -->
          </g>

        </svg>
      </div>
    </div>

    <div class="topbar">
      <a href="download.html">下载📥</a>
      <a href="aboutus.html">公告📢</a>
      <div class="dropdown">
        <span>其他 ▾</span>
        <ul class="dropdown-menu">
          <li><a href="weather.html">天气预报 ☁️</a></li>
          <li><a href="eq.html">解方程 🧮</a></li>
        </ul>
      </div>
    </div>

    <div class="at">
      <div class="title-time" id="time-display">--:--:--</div>
      <div class="subtitle-date" id="date-display">加载中...</div>
    </div>

    <div class="zoom-tip">移动鼠标探索地图 / 滚轮缩放 / 放大触发细节</div>

  </div>

<script>
  const container = document.getElementById('mapContainer');
  const mapInner = document.getElementById('mapInner');
  const mapSvg = document.querySelector('.map-svg');

  let scale = 1.5; // 初始稍微放大一点，让地图充满视野
  let targetX = 0, targetY = 0;
  let currentX = 0, currentY = 0;

  // 监听缩放状态，控制细节层显示
  function updateLOD() {
    if (scale > 2.5) {
      mapSvg.classList.add('show-details');
    } else {
      mapSvg.classList.remove('show-details');
    }
  }

  function initMap() {
    const rect = container.getBoundingClientRect();
    // 居中显示
    targetX = (rect.width - rect.width * scale) / 2;
    targetY = (rect.height - rect.height * scale) / 2;
    currentX = targetX;
    currentY = targetY;
    updateTransform();
    updateLOD();
  }

  function updateTransform() {
    // 使用 translate3d 开启 GPU 加速，确保拖动大体积 SVG 不卡顿
    mapInner.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) scale(${scale})`;
  }

  // 平滑动画循环
  function animate() {
    currentX += (targetX - currentX) * 0.1;
    currentY += (targetY - currentY) * 0.1;
    updateTransform();
    requestAnimationFrame(animate);
  }
  animate();

  // 鼠标移动触发视差
  container.addEventListener('mousemove', (e) => {
    const rect = container.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    // 视差系数：放大后减弱视差，防止头晕
    const parallaxFactor = scale > 2.5 ? 0.05 : 0.15; 
    
    const baseCenterX = (rect.width - rect.width * scale) / 2;
    const baseCenterY = (rect.height - rect.height * scale) / 2;

    targetX = baseCenterX - (mouseX - centerX) * parallaxFactor;
    targetY = baseCenterY - (mouseY - centerY) * parallaxFactor;
  });

  // 鼠标离开回正
  container.addEventListener('mouseleave', () => {
    const rect = container.getBoundingClientRect();
    targetX = (rect.width - rect.width * scale) / 2;
    targetY = (rect.height - rect.height * scale) / 2;
  });

  // 滚轮缩放
  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    
    const zoomAmount = e.deltaY > 0 ? 0.9 : 1.1;
    const newScale = scale * zoomAmount;

    // 缩放范围限制
    if (newScale < 0.8 || newScale > 6) return;

    const rect = container.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    // 以鼠标位置为锚点计算新的偏移
    const tempX = mouseX - (mouseX - currentX) * (newScale / scale);
    const tempY = mouseY - (mouseY - currentY) * (newScale / scale);
    
    scale = newScale;
    updateLOD(); // 更新 LOD 状态
    
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    const parallaxFactor = scale > 2.5 ? 0.05 : 0.15;
    
    targetX = tempX - (mouseX - centerX) * parallaxFactor;
    targetY = tempY - (mouseY - centerY) * parallaxFactor;
    
    currentX = tempX;
    currentY = tempY;
    updateTransform();
  });

  window.addEventListener('resize', initMap); 
  window.addEventListener('load', initMap);

  // --- 时间和农历逻辑 ---
  function updateTime() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false, timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('time-display').textContent = timeStr;
    const dateStr = now.toLocaleDateString('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    let lunarStr = '';
    try {
      const lunar = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric' }).format(now);
      const match = lunar.match(/(.*?年)(.*)/);
      lunarStr = match && match[2] ? `农历${match[2]}` : lunar;
    } catch(e) { lunarStr = '农历获取失败'; }
    document.getElementById('date-display').textContent = `${dateStr} · ${lunarStr}`;
  }
  setInterval(updateTime, 1000);
  updateTime();
</script>
</body>
</html>
