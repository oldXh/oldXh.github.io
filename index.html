<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>oldXh.github.io(目前处于内侧中……)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #0f0f10;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
  }

  .stage {
    position: relative;
    width: 1440px;
    height: 900px;
    flex: 0 0 auto;
    background: radial-gradient(circle at 50% 50%, #1c1c20, #0b0b0d 70%);
    overflow: hidden;
    color: #f2ead8;
  }

  .topbar {
    position: absolute;
    left: 0;
    top: 80px;    /* 整体往下移了 */
    width: 100%;
    height: 30px;
    background: linear-gradient(90deg, rgba(30,58,138,0.8) 0%, rgba(37,99,235,0.8) 50%, rgba(30,58,138,0.8) 100%);
    box-shadow: 0 2px 12px rgba(37, 99, 235, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  .topbar a {
    color: #ffffff;
    text-decoration: none;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 15px;
    letter-spacing: 0.15em;
    display: inline-block;
    transition: transform 0.2s ease; 
  }

  .topbar a:hover {
    transform: scale(1.15);
  }

  /* 增加一个间距样式，避免两个链接紧挨在一起 */
  .topbar a:first-child {
    margin-right: 40px; 
  }

  .at {
    position: absolute;
    left: calc(50% + var(--x, 0px));
    top:  calc(50% - var(--y, 0px));
    transform: translate(-50%, -50%);
  }

  .title {
    /* 删除了 --x: 50px; 实现水平居中 */
    --y: 80px;
    width: 556px;
    display: flex;
    justify-content: space-between;
    font-family: "ZCOOL KuaiLe", "站酷快乐体", cursive;
    font-size: 112px;
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0 0 24px rgba(255, 220, 150, .25);
  }

  .subtitle {
    /* 删除了 --x: 50px; 实现水平居中 */
    --y: -55px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 48px;
    line-height: 1.2;
    white-space: nowrap;
    letter-spacing: 0.02em;
    color: #cdbf9e;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="topbar">
      <!-- 新增的下载链接 -->
      <a href="download.html">下载📥</a>
      <!-- 原有的公告链接 -->
      <a href="aboutus.html">公告📢</a>
    </div>

    <div class="at title">
      <span>欢</span><span>迎</span><span>光</span><span>临</span>
    </div>
    <div class="at subtitle">Happy new year~</div>
  </div>
</body>
</html>
