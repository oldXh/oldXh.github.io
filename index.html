<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>oldXh.github.io (目前处于内侧中……)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #0f0f10;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    position: relative;
    width: 1440px;
    height: 900px;
    flex: 0 0 auto;
    background: radial-gradient(circle at 50% 50%, #1c1c20, #0b0b0d 70%);
    overflow: hidden;
    color: #f2ead8;
  }

  /* --- 地图背景容器 --- */
  .map-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 1;
    user-select: none; 
  }

  .map-inner {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-origin: 0 0;
    will-change: transform;
  }

  .map-svg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.9; 
  }

  /* --- 图层样式 --- */
  
  /* 道路 */
  .map-road {
    fill: none;
    stroke: rgba(255, 255, 255, 0.05);
    stroke-width: 14;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .map-road-line {
    fill: none;
    stroke: rgba(255, 255, 255, 0.15);
    stroke-width: 1;
    stroke-dasharray: 8 8;
  }

  /* 简欧红砖风建筑填充 */
  .map-building {
    fill: rgba(160, 80, 60, 0.08); /* 极淡的红砖暖色 */
    stroke: rgba(255, 255, 255, 0.3);
    stroke-width: 1.5;
    transition: all 0.5s ease;
  }
  
  /* 连廊与特殊建筑 */
  .map-corridor {
    fill: rgba(160, 80, 60, 0.05);
    stroke: rgba(255, 255, 255, 0.2);
    stroke-width: 1;
  }

  .map-building-highlight {
    fill: rgba(205, 191, 158, 0.1);
    stroke: rgba(205, 191, 158, 0.4);
  }

  /* 操场纵向样式 */
  .track-red {
    fill: rgba(231, 76, 60, 0.12);
    stroke: rgba(231, 76, 60, 0.3);
    stroke-width: 1;
  }
  .track-green {
    fill: rgba(46, 204, 113, 0.12);
    stroke: rgba(46, 204, 113, 0.25);
    stroke-width: 1;
  }
  .court-blue {
    fill: rgba(52, 152, 219, 0.15);
    stroke: rgba(52, 152, 219, 0.4);
    stroke-width: 1;
  }

  .map-label {
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 15px;
    fill: #ffffff;
    opacity: 0.4; 
    text-anchor: middle;
    letter-spacing: 2px;
    pointer-events: none;
    transition: all 0.5s ease;
  }

  /* --- 缩放 LOD 细节 (放大变科技蓝) --- */
  .show-details .map-building { 
    stroke: #60a5fa; 
    fill: rgba(59, 130, 246, 0.1); 
  }
  .show-details .map-corridor {
    stroke: rgba(96, 165, 250, 0.5); 
  }
  .show-details .map-label { 
    opacity: 0.95; 
    fill: #cdbf9e; 
    text-shadow: 0 0 8px #000;
  }
  .show-details .map-road { stroke: rgba(96, 165, 250, 0.15); }
  .show-details .track-red { stroke: #ef4444; }
  .show-details .court-blue { stroke: #3b82f6; }

  /* --- 顶部导航栏 (加宽加高) --- */
  .topbar {
    position: absolute;
    left: 0;
    top: 20px; 
    width: 100%;
    height: 42px; /* 变宽变高 */
    background: linear-gradient(90deg, rgba(30,58,138,0.85) 0%, rgba(37,99,235,0.85) 50%, rgba(30,58,138,0.85) 100%);
    box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }

  .topbar a, .dropdown > span {
    color: #ffffff;
    text-decoration: none;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 16px; /* 字体稍微放大 */
    letter-spacing: 0.15em;
    display: inline-block;
    transition: transform 0.2s ease;
    cursor: pointer;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .topbar a:hover, .dropdown:hover > span { transform: scale(1.15); }
  .topbar > a:first-child { margin-right: 50px; }

  .dropdown { position: relative; display: inline-block; margin-left: 50px; }
  .dropdown::after { content: ''; position: absolute; left: 0; top: 100%; width: 100%; height: 15px; }
  .dropdown-menu {
    position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%) translateY(15px);
    background: rgba(20, 28, 48, 0.95);
    border: 1px solid rgba(59, 130, 246, 0.4);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 12px rgba(37, 99, 235, 0.2);
    backdrop-filter: blur(8px); list-style: none; padding: 8px 0; min-width: 140px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
    z-index: 101;
  }
  .dropdown:hover .dropdown-menu { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  .dropdown-menu li a { display: block; padding: 12px 24px; font-size: 15px; letter-spacing: 0.1em; text-align: center; white-space: nowrap; }
  .dropdown-menu li a:hover { background: rgba(37, 99, 235, 0.3); transform: none; }

  /* --- 中心文字 --- */
  .at {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }

  .title-time {
    font-family: "ZCOOL KuaiLe", "站酷快乐体", cursive;
    font-size: 110px;
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 50px rgba(255, 220, 150, 0.2);
    letter-spacing: 0.05em;
    color: #f2ead8;
  }

  .subtitle-date {
    margin-top: 10px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 32px;
    white-space: nowrap;
    letter-spacing: 0.1em;
    color: #cdbf9e;
    text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 10px rgba(255, 220, 150, 0.3);
  }
  
  .zoom-tip {
    position: absolute;
    bottom: 30px;
    left: 30px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.3);
    pointer-events: none;
    z-index: 10;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="stage">
    
    <div class="map-container" id="mapContainer">
      <div class="map-inner" id="mapInner">
        <!-- 金山世外真实布局图 (无外框版) -->
        <svg class="map-svg" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
          
          <!-- 道路与连廊网络 -->
          <g>
            <!-- 西门入口道路 -->
            <path class="map-road" d="M 0,400 L 250,400 Q 350,400 400,350" />
            <path class="map-road-line" d="M 0,400 L 250,400 Q 350,400 400,350" />
            
            <!-- 教学区内部连廊线路 (S型) -->
            <path class="map-road" d="M 800,340 L 800,640" stroke-dasharray="4 4" stroke-width="8" />
          </g>

          <!-- 左侧大操场 (纵向) -->
          <g>
            <rect class="track-red" x="100" y="150" width="300" height="650" rx="150" />
            <rect class="track-green" x="140" y="220" width="220" height="510" rx="110" />
            <!-- 跑道内圈线 -->
            <line x1="100" y1="350" x2="400" y2="350" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
            <line x1="100" y1="600" x2="400" y2="600" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
          </g>

          <!-- 右侧小操场 (纵向) -->
          <g>
            <rect class="track-red" x="1100" y="150" width="250" height="450" rx="125" />
            <rect class="track-green" x="1130" y="210" width="190" height="330" rx="95" />
          </g>

          <!-- 核心建筑群 -->
          <g>
            <!-- 西北角：艺体馆、食堂、小剧场 (红砖建筑) -->
            <!-- 艺体馆/食堂大轮廓 -->
            <path class="map-building" d="M 80,50 L 320,30 L 420,130 L 180,190 Z" />
            <!-- 内部看台/活动区域 -->
            <ellipse cx="200" cy="100" rx="50" ry="25" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
            <!-- 小剧场 -->
            <path class="map-building" d="M 380,140 L 460,120 L 490,190 L 410,210 Z" />

            <!-- 明理楼 (左侧偏中) -->
            <rect class="map-building map-building-highlight" x="440" y="240" width="180" height="60" rx="5" />

            <!-- 右侧偏上：宿舍区 (两栋平行) -->
            <path class="map-building" d="M 950,80 L 1300,80 L 1350,130 L 1350,160 L 900,160 Z" />
            <path class="map-building" d="M 980,190 L 1300,190 L 1350,240 L 1350,270 L 930,270 Z" />

            <!-- 核心教学群：三栋连体建筑，风雨长廊贯通 (红砖色) -->
            <g class="map-building">
              <!-- 第一栋（顶），偏右 -->
              <rect x="620" y="340" width="380" height="60" rx="4" />
              <!-- 第二栋（中），偏左 -->
              <rect x="480" y="460" width="380" height="60" rx="4" />
              <!-- 第三栋（底），偏右 -->
              <rect x="620" y="580" width="380" height="60" rx="4" />
            </g>
            <!-- 贯穿南北的连廊体系 (明显加粗突出) -->
            <g class="map-corridor">
              <!-- 顶到中连廊 (靠左) -->
              <rect x="520" y="340" width="30" height="120" />
              <!-- 中到底连廊 (靠右) -->
              <rect x="860" y="460" width="30" height="120" />
              <!-- 内部连通的小走廊 -->
              <rect x="700" y="460" width="30" height="60" />
            </g>
            
            <!-- 中轴线景观广场 (喷泉等) -->
            <ellipse cx="800" cy="240" rx="60" ry="30" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
          </g>

          <!-- 左下角室外球场 -->
          <g>
            <rect class="court-blue" x="100" y="720" width="350" height="230" rx="5" />
            <line x1="187" y1="720" x2="187" y2="950" stroke="rgba(52, 152, 219, 0.4)" stroke-width="2" />
            <line x1="274" y1="720" x2="274" y2="950" stroke="rgba(52, 152, 219, 0.4)" stroke-width="2" />
            <line x1="361" y1="720" x2="361" y2="950" stroke="rgba(52, 152, 219, 0.4)" stroke-width="2" />
            <line x1="100" y1="835" x2="450" y2="835" stroke="rgba(52, 152, 219, 0.4)" stroke-width="2" />
          </g>

          <!-- 右下角：东侧操场南面的室外球场 (不再画幼儿园) -->
          <g>
            <!-- 蓝绿相间的球场 -->
            <rect class="court-blue" x="1100" y="650" width="250" height="80" rx="4" />
            <line x1="1225" y1="650" x2="1225" y2="730" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
            <!-- 球场旁的附属小建筑 -->
            <rect class="map-building" x="1100" y="750" width="80" height="40" />
          </g>

          <!-- 南门中轴广场 -->
          <g>
            <!-- 几何图案广场 -->
            <ellipse class="map-building" cx="800" cy="780" rx="80" ry="120" />
            <ellipse cx="800" cy="780" rx="50" ry="80" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
            <ellipse cx="800" cy="780" rx="20" ry="40" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
          </g>

          <!-- 文字标签 -->
          <g>
            <text class="map-label" x="80" y="400">西门</text>
            <text class="map-label" x="800" y="950">南门</text>
            
            <text class="map-label" x="250" y="480">大操场</text>
            <text class="map-label" x="1225" y="380">小操场</text>
            <text class="map-label" x="270" y="700">室外球场</text>
            <text class="map-label" x="1225" y="620">蓝球场</text>
            
            <!-- 西北区标签 -->
            <text class="map-label" x="230" y="100">艺体馆/食堂</text>
            <text class="map-label" x="430" y="170">小剧场</text>
            <text class="map-label" x="1150" y="130">宿舍</text>
            
            <!-- 核心教学区标签 -->
            <text class="map-label" x="530" y="270">明理楼</text>
            <text class="map-label" x="810" y="375">核心教学群 (连廊贯通)</text>
            <text class="map-label" x="800" y="780" style="opacity: 0.2;">中轴广场</text>
          </g>

        </svg>
      </div>
    </div>

    <!-- 加宽加高的导航栏 -->
    <div class="topbar">
      <a href="download.html">下载📥</a>
      <a href="aboutus.html">公告📢</a>
      <div class="dropdown">
        <span>其他 ▾</span>
        <ul class="dropdown-menu">
          <li><a href="weather.html">天气预报 ☁️</a></li>
          <li><a href="eq.html">解方程 🧮</a></li>
        </ul>
      </div>
    </div>

    <div class="at">
      <div class="title-time" id="time-display">--:--:--</div>
      <div class="subtitle-date" id="date-display">加载中...</div>
    </div>

    <div class="zoom-tip">移动鼠标探索校园 / 滚轮缩放 / 放大查看建筑细节</div>

  </div>

<script>
  const container = document.getElementById('mapContainer');
  const mapInner = document.getElementById('mapInner');
  const mapSvg = document.querySelector('.map-svg');

  let scale = 1.2; 
  
  let panX = 0, panY = 0;
  let targetPanX = 0, targetPanY = 0;

  let parallaxX = 0, parallaxY = 0;
  let targetParallaxX = 0, targetParallaxY = 0;

  function updateLOD() {
    if (scale > 1.5) {
      mapSvg.classList.add('show-details');
    } else {
      mapSvg.classList.remove('show-details');
    }
  }

  function initMap() {
    const rect = container.getBoundingClientRect();
    targetPanX = (rect.width - rect.width * scale) / 2;
    targetPanY = (rect.height - rect.height * scale) / 2;
    panX = targetPanX;
    panY = targetPanY;
    
    targetParallaxX = 0;
    targetParallaxY = 0;
    parallaxX = 0;
    parallaxY = 0;
    
    updateTransform();
    updateLOD();
  }

  function updateTransform() {
    const finalX = panX + parallaxX;
    const finalY = panY + parallaxY;
    mapInner.style.transform = `translate3d(${finalX}px, ${finalY}px, 0) scale(${scale})`;
  }

  function animate() {
    panX += (targetPanX - panX) * 0.15;
    panY += (targetPanY - panY) * 0.15;
    
    parallaxX += (targetParallaxX - parallaxX) * 0.1;
    parallaxY += (targetParallaxY - parallaxY) * 0.1;
    
    updateTransform();
    requestAnimationFrame(animate);
  }
  animate();

  container.addEventListener('mousemove', (e) => {
    const rect = container.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    const parallaxFactor = scale > 1.5 ? 0.02 : 0.08; 
    
    targetParallaxX = -(mouseX - centerX) * parallaxFactor;
    targetParallaxY = -(mouseY - centerY) * parallaxFactor;
  });

  container.addEventListener('mouseleave', () => {
    targetParallaxX = 0;
    targetParallaxY = 0;
  });

  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    
    const zoomAmount = e.deltaY > 0 ? 0.9 : 1.1;
    const newScale = scale * zoomAmount;

    if (newScale < 0.6 || newScale > 6) return;

    const rect = container.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const currentX = panX + parallaxX;
    const currentY = panY + parallaxY;
    
    const mapPointX = (mouseX - currentX) / scale;
    const mapPointY = (mouseY - currentY) / scale;

    scale = newScale;

    targetPanX = mouseX - mapPointX * scale;
    targetPanY = mouseY - mapPointY * scale;

    panX = targetPanX;
    panY = targetPanY;

    updateLOD(); 
    updateTransform();
  });

  window.addEventListener('resize', initMap); 
  window.addEventListener('load', initMap);

  function updateTime() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false, timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('time-display').textContent = timeStr;
    const dateStr = now.toLocaleDateString('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    let lunarStr = '';
    try {
      const lunar = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric' }).format(now);
      const match = lunar.match(/(.*?年)(.*)/);
      lunarStr = match && match[2] ? `农历${match[2]}` : lunar;
    } catch(e) { lunarStr = '农历获取失败'; }
    document.getElementById('date-display').textContent = `${dateStr} · ${lunarStr}`;
  }
  setInterval(updateTime, 1000);
  updateTime();
</script>
</body>
</html>
