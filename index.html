<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>oldXh.github.io (目前处于内侧中……)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #0f0f10;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    position: relative;
    width: 1440px;
    height: 900px;
    flex: 0 0 auto;
    background: radial-gradient(circle at 50% 50%, #1c1c20, #0b0b0d 70%);
    overflow: hidden;
    color: #f2ead8;
  }

  /* --- 地图背景容器 --- */
  .map-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 1;
    user-select: none; 
  }

  .map-inner {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-origin: 0 0;
    will-change: transform;
  }

  .map-svg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.9; 
  }

  /* --- 图层样式 --- */
  
  /* 道路 */
  .map-road {
    fill: none;
    stroke: rgba(255, 255, 255, 0.05);
    stroke-width: 14;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .map-road-line {
    fill: none;
    stroke: rgba(255, 255, 255, 0.15);
    stroke-width: 1;
    stroke-dasharray: 8 8;
  }

  /* 建筑底色 (简欧红砖风) */
  .map-building {
    fill: rgba(160, 80, 60, 0.08); 
    stroke: rgba(255, 255, 255, 0.3);
    stroke-width: 1.5;
    transition: all 0.5s ease;
  }
  
  /* 高中部特殊标记 (对应你涂的蓝色) */
  .building-high {
    fill: rgba(52, 152, 219, 0.12);
    stroke: rgba(52, 152, 219, 0.5);
  }
  /* 初中部特殊标记 (对应你涂的绿色) */
  .building-middle {
    fill: rgba(46, 204, 113, 0.12);
    stroke: rgba(46, 204, 113, 0.5);
  }
  /* 小学部特殊标记 (对应你涂的白色) */
  .building-primary {
    fill: rgba(205, 191, 158, 0.12);
    stroke: rgba(205, 191, 158, 0.6);
  }

  /* 操场纵向样式 */
  .track-red {
    fill: rgba(231, 76, 60, 0.12);
    stroke: rgba(231, 76, 60, 0.3);
    stroke-width: 1;
  }
  .track-green {
    fill: rgba(46, 204, 113, 0.12);
    stroke: rgba(46, 204, 113, 0.25);
    stroke-width: 1;
  }
  .court-blue {
    fill: rgba(52, 152, 219, 0.15);
    stroke: rgba(52, 152, 219, 0.4);
    stroke-width: 1;
  }

  .map-label {
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 15px;
    fill: #ffffff;
    opacity: 0.4; 
    text-anchor: middle;
    letter-spacing: 2px;
    pointer-events: none;
    transition: all 0.5s ease;
  }

  /* --- 缩放 LOD 细节 (放大变科技蓝) --- */
  .show-details .map-building { 
    stroke: #60a5fa; 
    fill: rgba(59, 130, 246, 0.1); 
  }
  .show-details .building-high { stroke: #3b82f6; fill: rgba(59, 130, 246, 0.2); }
  .show-details .building-middle { stroke: #10b981; fill: rgba(16, 185, 129, 0.2); }
  .show-details .building-primary { stroke: #fcd34d; fill: rgba(252, 211, 77, 0.2); }

  .show-details .map-label { 
    opacity: 0.95; 
    fill: #f2ead8; 
    text-shadow: 0 0 8px #000;
  }
  .show-details .map-road { stroke: rgba(96, 165, 250, 0.15); }
  .show-details .track-red { stroke: #ef4444; }
  .show-details .court-blue { stroke: #3b82f6; }

  /* --- 顶部导航栏 --- */
  .topbar {
    position: absolute;
    left: 0;
    top: 70px; 
    width: 100%;
    height: 42px; 
    background: linear-gradient(90deg, rgba(30,58,138,0.85) 0%, rgba(37,99,235,0.85) 50%, rgba(30,58,138,0.85) 100%);
    box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }

  .topbar a, .dropdown > span {
    color: #ffffff;
    text-decoration: none;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 16px; 
    letter-spacing: 0.15em;
    display: inline-block;
    transition: transform 0.2s ease;
    cursor: pointer;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .topbar a:hover, .dropdown:hover > span { transform: scale(1.15); }
  .topbar > a:first-child { margin-right: 50px; }

  .dropdown { position: relative; display: inline-block; margin-left: 50px; }
  .dropdown::after { content: ''; position: absolute; left: 0; top: 100%; width: 100%; height: 15px; }
  .dropdown-menu {
    position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%) translateY(15px);
    background: rgba(20, 28, 48, 0.95);
    border: 1px solid rgba(59, 130, 246, 0.4);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 12px rgba(37, 99, 235, 0.2);
    backdrop-filter: blur(8px); list-style: none; padding: 8px 0; min-width: 140px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
    z-index: 101;
  }
  .dropdown:hover .dropdown-menu { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  .dropdown-menu li a { display: block; padding: 12px 24px; font-size: 15px; letter-spacing: 0.1em; text-align: center; white-space: nowrap; }
  .dropdown-menu li a:hover { background: rgba(37, 99, 235, 0.3); transform: none; }

  /* --- 中心文字 --- */
  .at {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }

  .title-time {
    font-family: "ZCOOL KuaiLe", "站酷快乐体", cursive;
    font-size: 110px;
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 50px rgba(255, 220, 150, 0.2);
    letter-spacing: 0.05em;
    color: #f2ead8;
  }

  .subtitle-date {
    margin-top: 10px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 32px;
    white-space: nowrap;
    letter-spacing: 0.1em;
    color: #cdbf9e;
    text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 10px rgba(255, 220, 150, 0.3);
  }
  
  .zoom-tip {
    position: absolute;
    bottom: 30px;
    left: 30px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.3);
    pointer-events: none;
    z-index: 10;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="stage">
    
    <div class="map-container" id="mapContainer">
      <div class="map-inner" id="mapInner">
        <!-- 金山世外真实布局图 (精准比例修正版) -->
        <svg class="map-svg" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
          
          <!-- 道路 -->
          <g>
            <path class="map-road" d="M 0,420 L 280,420 Q 380,420 430,360" />
            <path class="map-road-line" d="M 0,420 L 280,420 Q 380,420 430,360" />
          </g>

          <!-- 左侧大操场 (纵向) -->
          <g>
            <rect class="track-red" x="80" y="150" width="320" height="700" rx="160" />
            <rect class="track-green" x="120" y="220" width="240" height="560" rx="120" />
            <line x1="80" y1="360" x2="400" y2="360" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
            <line x1="80" y1="640" x2="400" y2="640" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
          </g>

          <!-- 右侧小操场 (纵向) -->
          <g>
            <rect class="track-red" x="1150" y="180" width="240" height="450" rx="120" />
            <rect class="track-green" x="1180" y="240" width="180" height="330" rx="90" />
          </g>

          <!-- ================= 核心建筑群 (严格按你的红线图比例) ================= -->
          <g>
            <!-- 左上角：食堂&体育馆 (大面积不规则) -->
            <path class="map-building" d="M 100,60 L 300,40 L 380,160 L 260,200 L 150,200 Z" />
            <!-- 内部看台/场地线条 -->
            <ellipse cx="200" cy="110" rx="40" ry="20" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
            <line x1="160" y1="150" x2="320" y2="120" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
            
            <!-- 小剧场 (紧挨食堂右侧) -->
            <path class="map-building" d="M 340,170 L 400,150 L 440,210 L 380,230 Z" />

            <!-- 右上角：宿舍 (横向长条) -->
            <path class="map-building" d="M 950,60 L 1350,60 L 1400,110 L 1400,150 L 900,150 Z" />

            <!-- ================= 三大教学部连体建筑 ================= -->
            
            <!-- 1. 小学部/明理楼 (白色标注 - 顶部，不规则折线) -->
            <g class="building-primary">
              <!-- 主楼上半部 -->
              <path class="map-building" d="M 480,220 L 680,220 L 680,280 L 560,280 Z" />
              <!-- 主楼右翼向右下延伸 -->
              <path class="map-building" d="M 680,220 L 850,220 L 850,280 L 680,280 Z" />
              <!-- 连廊向下连接初中部 -->
              <rect class="map-building" x="680" y="280" width="40" height="150" />
            </g>

            <!-- 2. 初中部 (绿色标注 - 中部，宽大H型/日字型) -->
            <g class="building-middle">
              <!-- 上排教学楼 -->
              <rect class="map-building" x="480" y="430" width="400" height="60" rx="4" />
              <!-- 下排教学楼 -->
              <rect class="map-building" x="480" y="530" width="400" height="60" rx="4" />
              <!-- 左侧连廊 -->
              <rect class="map-building" x="480" y="430" width="50" height="160" />
              <!-- 中间天井/活动区 -->
              <rect class="map-building" x="600" y="490" width="100" height="40" fill="rgba(0,0,0,0.1)"/>
              <!-- 右侧连廊延伸 -->
              <rect class="map-building" x="830" y="430" width="50" height="160" />
            </g>

            <!-- 3. 高中部 (蓝色标注 - 底部，宽大连体建筑) -->
            <g class="building-high">
              <!-- 上排教学楼 -->
              <rect class="map-building" x="550" y="630" width="480" height="60" rx="4" />
              <!-- 下排教学楼 -->
              <rect class="map-building" x="550" y="730" width="480" height="60" rx="4" />
              <!-- 左侧连廊 -->
              <rect class="map-building" x="550" y="630" width="40" height="160" />
              <!-- 右侧连廊 -->
              <rect class="map-building" x="990" y="630" width="40" height="160" />
            </g>

            <!-- 连接初中部与高中部的中央核心连廊 -->
            <rect class="map-building" x="700" y="590" width="40" height="40" />
          </g>
          <!-- ========================================================== -->

          <!-- 左下角室外球场 -->
          <g>
            <rect class="court-blue" x="80" y="750" width="350" height="220" rx="5" />
            <line x1="167" y1="750" x2="167" y2="970" stroke="rgba(52, 152, 219, 0.4)" stroke-width="2" />
            <line x1="254" y1="750" x2="254" y2="970" stroke="rgba(52, 152, 219, 0.4)" stroke-width="2" />
            <line x1="341" y1="750" x2="341" y2="970" stroke="rgba(52, 152, 219, 0.4)" stroke-width="2" />
            <line x1="80" y1="860" x2="430" y2="860" stroke="rgba(52, 152, 219, 0.4)" stroke-width="2" />
          </g>

          <!-- 右下角：东侧操场南面的蓝色球场 -->
          <g>
            <rect class="court-blue" x="1150" y="680" width="240" height="80" rx="4" />
            <line x1="1270" y1="680" x2="1270" y2="760" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
          </g>

          <!-- 南门中轴广场 -->
          <g>
            <ellipse class="map-building" cx="750" cy="850" rx="80" ry="100" />
            <ellipse cx="750" cy="850" rx="50" ry="70" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
            <ellipse cx="750" cy="850" rx="20" ry="30" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
          </g>

          <!-- 文字标签 -->
          <g>
            <text class="map-label" x="60" y="420">西门</text>
            <text class="map-label" x="750" y="980">南门</text>
            
            <text class="map-label" x="240" y="500">大操场</text>
            <text class="map-label" x="1270" y="400">小操场</text>
            <text class="map-label" x="250" y="720">室外球场</text>
            <text class="map-label" x="1270" y="650">蓝球场</text>
            
            <text class="map-label" x="220" y="110">食堂&体育馆</text>
            <text class="map-label" x="390" y="190">小剧场</text>
            <text class="map-label" x="1150" y="110">宿舍</text>
            
            <!-- 核心教学群精细化标签 -->
            <text class="map-label" x="750" y="250">明理楼 (小学部)</text>
            <text class="map-label" x="680" y="510">初中部</text>
            <text class="map-label" x="790" y="710">高中部</text>
            
            <text class="map-label" x="750" y="850" style="opacity: 0.2;">中轴广场</text>
          </g>

        </svg>
      </div>
    </div>

    <div class="topbar">
      <a href="download.html">下载📥</a>
      <a href="aboutus.html">公告📢</a>
      <div class="dropdown">
        <span>其他 ▾</span>
        <ul class="dropdown-menu">
          <li><a href="weather.html">天气预报 ☁️</a></li>
          <li><a href="eq.html">解方程 🧮</a></li>
        </ul>
      </div>
    </div>

    <div class="at">
      <div class="title-time" id="time-display">--:--:--</div>
      <div class="subtitle-date" id="date-display">加载中...</div>
    </div>

    <div class="zoom-tip">移动鼠标探索校园 / 滚轮缩放 / 放大查看建筑细节</div>

  </div>

<script>
  const container = document.getElementById('mapContainer');
  const mapInner = document.getElementById('mapInner');
  const mapSvg = document.querySelector('.map-svg');

  let scale = 1.2; 
  
  let panX = 0, panY = 0;
  let targetPanX = 0, targetPanY = 0;

  let parallaxX = 0, parallaxY = 0;
  let targetParallaxX = 0, targetParallaxY = 0;

  function updateLOD() {
    if (scale > 1.5) {
      mapSvg.classList.add('show-details');
    } else {
      mapSvg.classList.remove('show-details');
    }
  }

  function initMap() {
    const rect = container.getBoundingClientRect();
    targetPanX = (rect.width - rect.width * scale) / 2;
    targetPanY = (rect.height - rect.height * scale) / 2;
    panX = targetPanX;
    panY = targetPanY;
    
    targetParallaxX = 0;
    targetParallaxY = 0;
    parallaxX = 0;
    parallaxY = 0;
    
    updateTransform();
    updateLOD();
  }

  function updateTransform() {
    const finalX = panX + parallaxX;
    const finalY = panY + parallaxY;
    mapInner.style.transform = `translate3d(${finalX}px, ${finalY}px, 0) scale(${scale})`;
  }

  function animate() {
    panX += (targetPanX - panX) * 0.15;
    panY += (targetPanY - panY) * 0.15;
    
    parallaxX += (targetParallaxX - parallaxX) * 0.1;
    parallaxY += (targetParallaxY - parallaxY) * 0.1;
    
    updateTransform();
    requestAnimationFrame(animate);
  }
  animate();

  container.addEventListener('mousemove', (e) => {
    const rect = container.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    const parallaxFactor = scale > 1.5 ? 0.02 : 0.08; 
    
    targetParallaxX = -(mouseX - centerX) * parallaxFactor;
    targetParallaxY = -(mouseY - centerY) * parallaxFactor;
  });

  container.addEventListener('mouseleave', () => {
    targetParallaxX = 0;
    targetParallaxY = 0;
  });

  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    
    const zoomAmount = e.deltaY > 0 ? 0.9 : 1.1;
    const newScale = scale * zoomAmount;

    if (newScale < 0.6 || newScale > 6) return;

    const rect = container.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const currentX = panX + parallaxX;
    const currentY = panY + parallaxY;
    
    const mapPointX = (mouseX - currentX) / scale;
    const mapPointY = (mouseY - currentY) / scale;

    scale = newScale;

    targetPanX = mouseX - mapPointX * scale;
    targetPanY = mouseY - mapPointY * scale;

    panX = targetPanX;
    panY = targetPanY;

    updateLOD(); 
    updateTransform();
  });

  window.addEventListener('resize', initMap); 
  window.addEventListener('load', initMap);

  function updateTime() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false, timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('time-display').textContent = timeStr;
    const dateStr = now.toLocaleDateString('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    let lunarStr = '';
    try {
      const lunar = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric' }).format(now);
      const match = lunar.match(/(.*?年)(.*)/);
      lunarStr = match && match[2] ? `农历${match[2]}` : lunar;
    } catch(e) { lunarStr = '农历获取失败'; }
    document.getElementById('date-display').textContent = `${dateStr} · ${lunarStr}`;
  }
  setInterval(updateTime, 1000);
  updateTime();
</script>
</body>
</html>
