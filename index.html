<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>oldXh.github.io (目前处于内侧中……)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #0f0f10;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    position: relative;
    width: 1440px;
    height: 900px;
    flex: 0 0 auto;
    background: radial-gradient(circle at 50% 50%, #1c1c20, #0b0b0d 70%);
    overflow: hidden;
    color: #f2ead8;
  }

  /* --- 校园地图背景 --- */
  .map-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 1;
    user-select: none; 
  }

  .map-inner {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-origin: 0 0;
    will-change: transform;
  }

  .map-svg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    /* 建筑填充色与描边 */
    fill: rgba(255, 255, 255, 0.03); 
    stroke: rgba(255, 255, 255, 0.4);
    stroke-width: 1.5; 
    opacity: 0.4; 
    transition: opacity 0.5s ease, stroke 0.5s ease, fill 0.5s ease;
  }
  
  .map-container:hover .map-svg {
    opacity: 0.7;
  }

  /* --- LOD (多细节层次) 控制 --- */
  .layer-buildings { transition: all 0.5s ease; }

  .layer-details {
    stroke-width: 1;
    stroke: rgba(96, 165, 250, 0.4); /* 科技蓝道路 */
    fill: none;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .layer-labels {
    opacity: 0;
    transition: opacity 0.5s ease;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    fill: #60a5fa;
    font-size: 14px;
    text-anchor: middle;
    font-weight: bold;
    letter-spacing: 2px;
    pointer-events: none;
  }

  .layer-trees {
    fill: #cdbf9e;
    stroke: none;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  /* 放大触发状态：细节浮现，建筑变蓝 */
  .show-details .layer-details { opacity: 1; }
  .show-details .layer-labels { opacity: 1; }
  .show-details .layer-trees { opacity: 0.6; }
  
  .show-details .map-svg { 
    stroke: #60a5fa; 
    fill: rgba(59, 130, 246, 0.05); 
    opacity: 1; 
  }

  /* --- 顶部导航栏 --- */
  .topbar {
    position: absolute;
    left: 0;
    top: 80px;
    width: 100%;
    height: 30px;
    background: linear-gradient(90deg, rgba(30,58,138,0.8) 0%, rgba(37,99,235,0.8) 50%, rgba(30,58,138,0.8) 100%);
    box-shadow: 0 2px 12px rgba(37, 99, 235, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .topbar a, .dropdown > span {
    color: #ffffff;
    text-decoration: none;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 15px;
    letter-spacing: 0.15em;
    display: inline-block;
    transition: transform 0.2s ease;
    cursor: pointer;
  }

  .topbar a:hover, .dropdown:hover > span { transform: scale(1.15); }
  .topbar > a:first-child { margin-right: 40px; }

  .dropdown { position: relative; display: inline-block; margin-left: 40px; }
  .dropdown::after { content: ''; position: absolute; left: 0; top: 100%; width: 100%; height: 15px; }
  .dropdown-menu {
    position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(20, 28, 48, 0.95);
    border: 1px solid rgba(59, 130, 246, 0.4);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 12px rgba(37, 99, 235, 0.2);
    backdrop-filter: blur(8px); list-style: none; padding: 8px 0; min-width: 130px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
    z-index: 101;
  }
  .dropdown:hover .dropdown-menu { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  .dropdown-menu li a { display: block; padding: 10px 20px; font-size: 14px; letter-spacing: 0.1em; text-align: center; white-space: nowrap; }
  .dropdown-menu li a:hover { background: rgba(37, 99, 235, 0.3); transform: none; }

  /* --- 中心文字区域 --- */
  .at {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }

  .title-time {
    font-family: "ZCOOL KuaiLe", "站酷快乐体", cursive;
    font-size: 110px;
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 50px rgba(255, 220, 150, 0.2);
    letter-spacing: 0.05em;
    color: #f2ead8;
  }

  .subtitle-date {
    margin-top: 10px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 32px;
    white-space: nowrap;
    letter-spacing: 0.1em;
    color: #cdbf9e;
    text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 10px rgba(255, 220, 150, 0.3);
  }
  
  .zoom-tip {
    position: absolute;
    bottom: 30px;
    left: 30px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.3);
    pointer-events: none;
    z-index: 10;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="stage">
    
    <div class="map-container" id="mapContainer">
      <div class="map-inner" id="mapInner">
        <!-- 细节丰富的金山世外校园平面图 SVG -->
        <svg class="map-svg" viewBox="0 0 2000 1000" xmlns="http://www.w3.org/2000/svg">
          
          <!-- 基础建筑层 -->
          <g class="layer-buildings">
            <!-- 学校主边界围墙 -->
            <path d="M 200,200 L 1800,200 L 1800,800 L 200,800 Z" stroke-dasharray="10 5" stroke-width="2" />
            
            <!-- 教学楼 (L型) -->
            <path d="M 300,300 L 700,300 L 700,450 L 500,450 L 500,600 L 300,600 Z" />
            <!-- 实验楼 -->
            <rect x="750" y="300" width="200" height="150" />
            <!-- 图书馆 (圆形/多边形) -->
            <path d="M 1050,375 L 1100,300 L 1200,300 L 1250,375 L 1200,450 L 1100,450 Z" />
            <!-- 行政楼 -->
            <rect x="1350" y="300" width="250" height="120" />
            <!-- 食堂 -->
            <rect x="300" y="650" width="300" height="100" />
            <!-- 学生宿舍楼群 -->
            <rect x="700" y="650" width="80" height="120" />
            <rect x="820" y="650" width="80" height="120" />
            <rect x="940" y="650" width="80" height="120" />
            <!-- 体育馆 -->
            <rect x="1300" y="600" width="300" height="150" />
            
            <!-- 操场 (标准跑道) -->
            <!-- 外圈跑道 -->
            <path d="M 1350,480 L 1650,480 A 60 60 0 0 1 1650 600 L 1350,600 A 60 60 0 0 1 1350 480 Z" />
            <!-- 内圈草坪 -->
            <path d="M 1380,500 L 1620,500 A 40 40 0 0 1 1620 580 L 1380,580 A 40 40 0 0 1 1380 500 Z" />
          </g>

          <!-- 细节层 (放大时显示) -->
          <g class="layer-details">
            <!-- 校园道路主干道 -->
            <path d="M 200,620 L 1800,620" stroke-width="15" stroke-linecap="round" />
            <path d="M 720,200 L 720,620" stroke-width="10" stroke-linecap="round" />
            <path d="M 1280,200 L 1280,800" stroke-width="10" stroke-linecap="round" />
            <path d="M 720,480 L 1280,480" stroke-width="8" stroke-linecap="round" />
            
            <!-- 跑道细节线 -->
            <path d="M 1360,490 L 1640,490 M 1360,590 L 1640,590" stroke="#ef4444" stroke-width="2" />
            <line x1="1480" y1="480" x2="1480" y2="600" stroke="#60a5fa" stroke-width="2" />
            <line x1="1520" y1="480" x2="1520" y2="600" stroke="#60a5fa" stroke-width="2" />
          </g>

          <!-- 树木绿化层 (放大时显示) -->
          <g class="layer-trees">
            <!-- 主路两旁的树木 -->
            <circle cx="250" cy="610" r="8" />
            <circle cx="350" cy="610" r="8" />
            <circle cx="450" cy="610" r="8" />
            <circle cx="550" cy="610" r="8" />
            <circle cx="1000" cy="610" r="8" />
            <circle cx="1100" cy="610" r="8" />
            <circle cx="1200" cy="610" r="8" />
            <!-- 操场周围树木 -->
            <circle cx="1300" cy="480" r="10" />
            <circle cx="1300" cy="540" r="10" />
            <circle cx="1300" cy="600" r="10" />
            <circle cx="1700" cy="480" r="10" />
            <circle cx="1700" cy="540" r="10" />
            <circle cx="1700" cy="600" r="10" />
            <!-- 教学楼前广场 -->
            <circle cx="400" cy="250" r="12" />
            <circle cx="500" cy="250" r="12" />
            <circle cx="600" cy="250" r="12" />
          </g>

          <!-- 建筑标签层 (放大时显示) -->
          <g class="layer-labels">
            <text x="450" y="450">教 学 楼</text>
            <text x="850" y="385">实 验 楼</text>
            <text x="1150" y="385">图 书 馆</text>
            <text x="1475" y="370">行 政 楼</text>
            <text x="450" y="710">食 堂</text>
            <text x="810" y="720">宿 舍 区</text>
            <text x="1450" y="685">体 育 馆</text>
            <text x="1500" y="550" fill="#ef4444">操 场</text>
            <text x="1000" y="240" font-size="20" fill="#cdbf9e">金山世外校园</text>
          </g>

        </svg>
      </div>
    </div>

    <div class="topbar">
      <a href="download.html">下载📥</a>
      <a href="aboutus.html">公告📢</a>
      <div class="dropdown">
        <span>其他 ▾</span>
        <ul class="dropdown-menu">
          <li><a href="weather.html">天气预报 ☁️</a></li>
          <li><a href="eq.html">解方程 🧮</a></li>
        </ul>
      </div>
    </div>

    <div class="at">
      <div class="title-time" id="time-display">--:--:--</div>
      <div class="subtitle-date" id="date-display">加载中...</div>
    </div>

    <div class="zoom-tip">移动鼠标探索校园 / 滚轮缩放 / 放大查看建筑细节</div>

  </div>

<script>
  const container = document.getElementById('mapContainer');
  const mapInner = document.getElementById('mapInner');
  const mapSvg = document.querySelector('.map-svg');

  // 初始缩放设为 1.2，展示全貌
  let scale = 1.2; 
  
  let panX = 0, panY = 0;
  let targetPanX = 0, targetPanY = 0;

  let parallaxX = 0, parallaxY = 0;
  let targetParallaxX = 0, targetParallaxY = 0;

  // LOD 细节控制，校园地图放大到 1.8 倍就显示文字和树木
  function updateLOD() {
    if (scale > 1.8) {
      mapSvg.classList.add('show-details');
    } else {
      mapSvg.classList.remove('show-details');
    }
  }

  function initMap() {
    const rect = container.getBoundingClientRect();
    targetPanX = (rect.width - rect.width * scale) / 2;
    targetPanY = (rect.height - rect.height * scale) / 2;
    panX = targetPanX;
    panY = targetPanY;
    
    targetParallaxX = 0;
    targetParallaxY = 0;
    parallaxX = 0;
    parallaxY = 0;
    
    updateTransform();
    updateLOD();
  }

  function updateTransform() {
    const finalX = panX + parallaxX;
    const finalY = panY + parallaxY;
    mapInner.style.transform = `translate3d(${finalX}px, ${finalY}px, 0) scale(${scale})`;
  }

  function animate() {
    panX += (targetPanX - panX) * 0.15;
    panY += (targetPanY - panY) * 0.15;
    
    parallaxX += (targetParallaxX - parallaxX) * 0.1;
    parallaxY += (targetParallaxY - parallaxY) * 0.1;
    
    updateTransform();
    requestAnimationFrame(animate);
  }
  animate();

  // 鼠标移动视差
  container.addEventListener('mousemove', (e) => {
    const rect = container.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    // 校园地图视差幅度稍小一点，更符合平面图感觉
    const parallaxFactor = scale > 1.8 ? 0.03 : 0.1; 
    
    targetParallaxX = -(mouseX - centerX) * parallaxFactor;
    targetParallaxY = -(mouseY - centerY) * parallaxFactor;
  });

  // 鼠标离开回正
  container.addEventListener('mouseleave', () => {
    targetParallaxX = 0;
    targetParallaxY = 0;
  });

  // 滚轮缩放
  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    
    const zoomAmount = e.deltaY > 0 ? 0.9 : 1.1;
    const newScale = scale * zoomAmount;

    // 校园地图缩放范围稍微收紧，最大放 5 倍
    if (newScale < 0.6 || newScale > 5) return;

    const rect = container.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const currentX = panX + parallaxX;
    const currentY = panY + parallaxY;
    
    // 计算鼠标在地图上的真实比例坐标
    const mapPointX = (mouseX - currentX) / scale;
    const mapPointY = (mouseY - currentY) / scale;

    scale = newScale;

    // 固定鼠标位置进行缩放
    targetPanX = mouseX - mapPointX * scale;
    targetPanY = mouseY - mapPointY * scale;

    panX = targetPanX;
    panY = targetPanY;

    updateLOD(); 
    updateTransform();
  });

  window.addEventListener('resize', initMap); 
  window.addEventListener('load', initMap);

  // --- 时间和农历更新 ---
  function updateTime() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false, timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('time-display').textContent = timeStr;
    const dateStr = now.toLocaleDateString('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    let lunarStr = '';
    try {
      const lunar = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric' }).format(now);
      const match = lunar.match(/(.*?年)(.*)/);
      lunarStr = match && match[2] ? `农历${match[2]}` : lunar;
    } catch(e) { lunarStr = '农历获取失败'; }
    document.getElementById('date-display').textContent = `${dateStr} · ${lunarStr}`;
  }
  setInterval(updateTime, 1000);
  updateTime();
</script>
</body>
