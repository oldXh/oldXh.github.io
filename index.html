<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>oldXh.github.io (目前处于内侧中……)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #0f0f10;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    position: relative;
    width: 1440px;
    height: 900px;
    flex: 0 0 auto;
    background: radial-gradient(circle at 50% 50%, #1c1c20, #0b0b0d 70%);
    overflow: hidden;
    color: #f2ead8;
  }

  /* --- 地图背景容器 --- */
  .map-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 1;
    user-select: none; 
  }

  .map-inner {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-origin: 0 0;
    will-change: transform;
  }

  .map-svg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.9; 
  }

  /* --- 图层样式定义 --- */
  .map-green {
    fill: rgba(39, 174, 96, 0.05);
    stroke: rgba(39, 174, 96, 0.15);
    stroke-width: 1;
  }
  
  .map-road {
    fill: none;
    stroke: rgba(255, 255, 255, 0.08);
    stroke-width: 16;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .map-road-line {
    fill: none;
    stroke: rgba(255, 255, 255, 0.2);
    stroke-width: 1;
    stroke-dasharray: 10 10;
  }

  .map-building {
    fill: rgba(255, 255, 255, 0.05);
    stroke: rgba(255, 255, 255, 0.3);
    stroke-width: 1.5;
    transition: all 0.5s ease;
  }
  .map-building-highlight {
    fill: rgba(255, 255, 255, 0.08);
    stroke: rgba(205, 191, 158, 0.5);
  }

  .track-red {
    fill: rgba(231, 76, 60, 0.15);
    stroke: rgba(231, 76, 60, 0.4);
    stroke-width: 1;
  }
  .track-green {
    fill: rgba(46, 204, 113, 0.15);
    stroke: rgba(46, 204, 113, 0.3);
    stroke-width: 1;
  }
  .court-blue {
    fill: rgba(52, 152, 219, 0.15);
    stroke: rgba(52, 152, 219, 0.4);
    stroke-width: 1;
  }

  .water {
    fill: rgba(96, 165, 250, 0.15);
    stroke: rgba(96, 165, 250, 0.4);
    stroke-width: 1;
  }

  .map-label {
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 14px;
    fill: #ffffff;
    opacity: 0.4; 
    text-anchor: middle;
    letter-spacing: 2px;
    pointer-events: none;
    transition: all 0.5s ease;
  }
  .map-label-title {
    font-size: 20px;
    font-weight: bold;
    opacity: 0.6;
    fill: #cdbf9e;
  }

  .show-details .map-building { 
    stroke: #60a5fa; 
    fill: rgba(59, 130, 246, 0.1); 
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
  }
  .show-details .map-label { 
    opacity: 0.9; 
    fill: #cdbf9e; 
    text-shadow: 0 0 5px #000;
  }
  .show-details .map-road { stroke: rgba(96, 165, 250, 0.2); }
  .show-details .track-red { stroke: #ef4444; }
  .show-details .court-blue { stroke: #3b82f6; }
  .show-details .water { stroke: #60a5fa; }

  /* --- 顶部导航栏 --- */
  .topbar {
    position: absolute;
    left: 0;
    top: 0; /* 修改为贴合顶部 */
    width: 100%;
    height: 30px;
    background: linear-gradient(90deg, rgba(30,58,138,0.8) 0%, rgba(37,99,235,0.8) 50%, rgba(30,58,138,0.8) 100%);
    box-shadow: 0 2px 12px rgba(37, 99, 235, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .topbar a, .dropdown > span {
    color: #ffffff;
    text-decoration: none;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 15px;
    letter-spacing: 0.15em;
    display: inline-block;
    transition: transform 0.2s ease;
    cursor: pointer;
  }

  .topbar a:hover, .dropdown:hover > span { transform: scale(1.15); }
  .topbar > a:first-child { margin-right: 40px; }

  .dropdown { position: relative; display: inline-block; margin-left: 40px; }
  .dropdown::after { content: ''; position: absolute; left: 0; top: 100%; width: 100%; height: 15px; }
  .dropdown-menu {
    position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(20, 28, 48, 0.95);
    border: 1px solid rgba(59, 130, 246, 0.4);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 12px rgba(37, 99, 235, 0.2);
    backdrop-filter: blur(8px); list-style: none; padding: 8px 0; min-width: 130px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
    z-index: 101;
  }
  .dropdown:hover .dropdown-menu { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  .dropdown-menu li a { display: block; padding: 10px 20px; font-size: 14px; letter-spacing: 0.1em; text-align: center; white-space: nowrap; }
  .dropdown-menu li a:hover { background: rgba(37, 99, 235, 0.3); transform: none; }

  /* --- 中心文字区域 --- */
  .at {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }

  .title-time {
    font-family: "ZCOOL KuaiLe", "站酷快乐体", cursive;
    font-size: 110px;
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 50px rgba(255, 220, 150, 0.2);
    letter-spacing: 0.05em;
    color: #f2ead8;
  }

  .subtitle-date {
    margin-top: 10px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 32px;
    white-space: nowrap;
    letter-spacing: 0.1em;
    color: #cdbf9e;
    text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 10px rgba(255, 220, 150, 0.3);
  }
  
  .zoom-tip {
    position: absolute;
    bottom: 30px;
    left: 30px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.3);
    pointer-events: none;
    z-index: 10;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="stage">
    
    <div class="map-container" id="mapContainer">
      <div class="map-inner" id="mapInner">
        <!-- 金山世外真实布局图 -->
        <svg class="map-svg" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
          
          <rect x="0" y="0" width="1600" height="1000" fill="rgba(30,40,30,0.2)" />
          
          <!-- 1. 道路网络 -->
          <g>
            <path class="map-road" d="M 800,0 L 800,1000" />
            <path class="map-road-line" d="M 800,0 L 800,1000" />
            
            <path class="map-road" d="M 0,680 L 1600,680" />
            <path class="map-road-line" d="M 0,680 L 1600,680" />
            
            <path class="map-road" d="M 0,550 L 200,550 L 300,450" />
            <path class="map-road-line" d="M 0,550 L 200,550 L 300,450" />
            
            <path class="map-road" d="M 300,450 Q 500,300 700,300 L 1000,300 Q 1100,400 1100,500 L 1100,650" />
          </g>

          <!-- 2. 左侧大型操场 -->
          <g>
            <path class="track-red" d="M 150,280 L 450,280 A 150,150 0 0 1 450,580 L 150,580 A 150,150 0 0 1 150,280 Z" />
            <path class="track-green" d="M 180,310 L 420,310 A 120,120 0 0 1 420,550 L 180,550 A 120,120 0 0 1 180,310 Z" />
            <line x1="200" y1="280" x2="200" y2="580" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
            <line x1="400" y1="280" x2="400" y2="580" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
          </g>

          <!-- 3. 右侧操场 -->
          <g>
            <path class="track-red" d="M 1150,220 L 1350,220 A 130,130 0 0 1 1350,480 L 1150,480 A 130,130 0 0 1 1150,220 Z" />
            <path class="track-green" d="M 1180,250 L 1320,250 A 100,100 0 0 1 1320,450 L 1180,450 A 100,100 0 0 1 1180,250 Z" />
          </g>

          <!-- 4. 建筑群 -->
          <g>
            <path class="map-building" d="M 120,150 L 400,120 L 450,220 L 400,320 L 120,320 Z" />
            <rect class="map-building" x="250" y="250" width="100" height="40" />
            
            <path class="map-building" d="M 600,120 L 900,120 L 900,200 L 600,200 Z" />
            <path class="map-building" d="M 950,120 L 1150,120 L 1150,200 L 950,200 Z" />

            <path class="map-building map-building-highlight" d="M 650,240 L 950,240 L 950,350 L 650,350 Z" />
            <rect x="700" y="270" width="200" height="50" fill="rgba(0,0,0,0.3)" />

            <path class="map-building" d="M 600,420 L 1100,420 L 1100,500 L 600,500 Z" />
            <path class="map-building" d="M 600,530 L 1100,530 L 1100,610 L 600,610 Z" />
            <rect class="map-building" x="750" y="490" width="200" height="40" />
            
            <rect class="map-green" x="620" y="510" width="120" height="10" />
          </g>

          <!-- 5. 左下角大型球场区 -->
          <g>
            <rect class="court-blue" x="100" y="750" width="350" height="180" rx="5" />
            <line x1="200" y1="750" x2="200" y2="930" stroke="rgba(52, 152, 219, 0.4)" stroke-width="2" />
            <line x1="300" y1="750" x2="300" y2="930" stroke="rgba(52, 152, 219, 0.4)" stroke-width="2" />
            <line x1="100" y1="840" x2="450" y2="840" stroke="rgba(52, 152, 219, 0.4)" stroke-width="2" />
          </g>

          <!-- 6. 右下角幼儿园与蓝色球场 -->
          <g>
            <path class="map-building" d="M 1000,750 L 1350,750 L 1350,850 L 1000,850 Z" />
            <path class="water" d="M 1050,880 Q 1150,850 1250,880 Q 1300,920 1200,950 Q 1100,930 1050,880 Z" />
            <rect class="court-blue" x="1150" y="580" width="200" height="80" rx="5" />
            <line x1="1250" y1="580" x2="1250" y2="660" stroke="rgba(52, 152, 219, 0.4)" stroke-width="2" />
          </g>

          <!-- 7. 南门及中轴广场 -->
          <g>
            <ellipse class="map-building" cx="800" cy="800" rx="80" ry="120" />
            <ellipse cx="800" cy="800" rx="50" ry="90" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
            <ellipse cx="800" cy="800" rx="20" ry="40" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
          </g>

          <!-- 8. 文字标签 -->
          <g>
            <text class="map-label" x="100" y="540">西门</text>
            <text class="map-label" x="800" y="960">南门</text>
            
            <text class="map-label" x="300" y="640">大操场</text>
            <text class="map-label" x="1250" y="520">操场</text>
            <text class="map-label" x="270" y="950">室外球场</text>
            
            <text class="map-label" x="280" y="220">宿舍/生活区</text>
            <text class="map-label" x="750" y="160">教学区</text>
            <text class="map-label" x="800" y="290">明理楼</text>
            <text class="map-label" x="850" y="470">上海金山区世外学校</text>
            <text class="map-label" x="850" y="570">核心教学群</text>
            <text class="map-label" x="1250" y="620">蓝球场</text>
            <text class="map-label" x="1175" y="800">上海金山区世界外国语幼儿园</text>
            <text class="map-label" x="800" y="800" style="opacity: 0.2;">中轴广场</text>
          </g>

        </svg>
      </div>
    </div>

    <div class="topbar">
      <a href="download.html">下载📥</a>
      <a href="aboutus.html">公告📢</a>
      <div class="dropdown">
        <span>其他 ▾</span>
        <ul class="dropdown-menu">
          <li><a href="weather.html">天气预报 ☁️</a></li>
          <li><a href="eq.html">解方程 🧮</a></li>
        </ul>
      </div>
    </div>

    <div class="at">
      <div class="title-time" id="time-display">--:--:--</div>
      <div class="subtitle-date" id="date-display">加载中...</div>
    </div>

    <div class="zoom-tip">移动鼠标探索校园 / 滚轮缩放 / 放大查看建筑细节</div>

  </div>

<script>
  const container = document.getElementById('mapContainer');
  const mapInner = document.getElementById('mapInner');
  const mapSvg = document.querySelector('.map-svg');

  let scale = 1.2; 
  
  let panX = 0, panY = 0;
  let targetPanX = 0, targetPanY = 0;

  let parallaxX = 0, parallaxY = 0;
  let targetParallaxX = 0, targetParallaxY = 0;

  function updateLOD() {
    if (scale > 1.5) {
      mapSvg.classList.add('show-details');
    } else {
      mapSvg.classList.remove('show-details');
    }
  }

  function initMap() {
    const rect = container.getBoundingClientRect();
    targetPanX = (rect.width - rect.width * scale) / 2;
    targetPanY = (rect.height - rect.height * scale) / 2;
    panX = targetPanX;
    panY = targetPanY;
    
    targetParallaxX = 0;
    targetParallaxY = 0;
    parallaxX = 0;
    parallaxY = 0;
    
    updateTransform();
    updateLOD();
  }

  function updateTransform() {
    const finalX = panX + parallaxX;
    const finalY = panY + parallaxY;
    mapInner.style.transform = `translate3d(${finalX}px, ${finalY}px, 0) scale(${scale})`;
  }

  function animate() {
    panX += (targetPanX - panX) * 0.15;
    panY += (targetPanY - panY) * 0.15;
    
    parallaxX += (targetParallaxX - parallaxX) * 0.1;
    parallaxY += (targetParallaxY - parallaxY) * 0.1;
    
    updateTransform();
    requestAnimationFrame(animate);
  }
  animate();

  container.addEventListener('mousemove', (e) => {
    const rect = container.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    const parallaxFactor = scale > 1.5 ? 0.02 : 0.08; 
    
    targetParallaxX = -(mouseX - centerX) * parallaxFactor;
    targetParallaxY = -(mouseY - centerY) * parallaxFactor;
  });

  container.addEventListener('mouseleave', () => {
    targetParallaxX = 0;
    targetParallaxY = 0;
  });

  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    
    const zoomAmount = e.deltaY > 0 ? 0.9 : 1.1;
    const newScale = scale * zoomAmount;

    if (newScale < 0.6 || newScale > 6) return;

    const rect = container.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const currentX = panX + parallaxX;
    const currentY = panY + parallaxY;
    
    const mapPointX = (mouseX - currentX) / scale;
    const mapPointY = (mouseY - currentY) / scale;

    scale = newScale;

    targetPanX = mouseX - mapPointX * scale;
    targetPanY = mouseY - mapPointY * scale;

    panX = targetPanX;
    panY = targetPanY;

    updateLOD(); 
    updateTransform();
  });

  window.addEventListener('resize', initMap); 
  window.addEventListener('load', initMap);

  function updateTime() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false, timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('time-display').textContent = timeStr;
    const dateStr = now.toLocaleDateString('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    let lunarStr = '';
    try {
      const lunar = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric' }).format(now);
      const match = lunar.match(/(.*?年)(.*)/);
      lunarStr = match && match[2] ? `农历${match[2]}` : lunar;
    } catch(e) { lunarStr = '农历获取失败'; }
    document.getElementById('date-display').textContent = `${dateStr} · ${lunarStr}`;
  }
  setInterval(updateTime, 1000);
  updateTime();
</script>
</body>
</html>
