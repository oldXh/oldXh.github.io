<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天气预报 - 上海</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    min-height: 100vh;
    background: #0f0f10;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 140px 20px 60px;
    position: relative;
  }

  /* 复刻首页径向渐变背景 */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 50%, #1c1c20, #0b0b0d 70%);
    z-index: -1;
    pointer-events: none;
  }

  /* 顶部导航栏 */
  .topbar {
    position: absolute;
    left: 0;
    top: 80px;
    width: 100%;
    height: 30px;
    background: linear-gradient(90deg, rgba(30,58,138,0.8) 0%, rgba(37,99,235,0.8) 50%, rgba(30,58,138,0.8) 100%);
    box-shadow: 0 2px 12px rgba(37, 99, 235, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .topbar a {
    color: #ffffff;
    text-decoration: none;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 15px;
    letter-spacing: 0.15em;
    display: inline-block;
    transition: transform 0.2s ease; 
  }

  .topbar a:hover {
    transform: scale(1.15);
  }

  /* 标题区域 */
  .header {
    text-align: center;
    margin-bottom: 40px;
    z-index: 1;
  }

  .header h1 {
    font-family: "ZCOOL KuaiLe", "站酷快乐体", cursive;
    font-size: 46px;
    font-weight: normal;
    color: #f2ead8;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
    text-shadow: 0 0 24px rgba(255, 220, 150, .25);
  }

  .header p {
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 15px;
    color: #cdbf9e;
    letter-spacing: 0.1em;
    opacity: 0.8;
  }

  /* 核心布局：Flexbox 强制 4+3 换行并居中 */
  .calendar-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px 20px;
    width: 100%;
    max-width: 960px;
    z-index: 1;
  }

  /* 天气卡片 */
  .weather-card {
    flex: 0 0 calc(25% - 15px); /* 确保一行正好四个 */
    min-width: 160px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 220, 150, 0.15);
    border-radius: 12px;
    padding: 28px 10px;
    text-align: center;
    position: relative;
    cursor: default;
    transition: all 0.3s ease;
  }

  .weather-card:hover {
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 220, 150, 0.4);
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 220, 150, 0.08);
    z-index: 200;
  }

  /* 当前日高亮 */
  .weather-card.today {
    background: rgba(255, 220, 150, 0.06);
    border-color: rgba(255, 220, 150, 0.6);
    box-shadow: 0 0 20px rgba(255, 220, 150, 0.1);
  }
  
  .weather-card.today::before {
    content: '今天';
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    background: #cdbf9e;
    color: #0f0f10;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 13px;
    font-weight: bold;
    padding: 2px 10px;
    border-radius: 10px;
    letter-spacing: 0.1em;
    white-space: nowrap;
  }

  .card-date {
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 14px;
    color: #cdbf9e;
    margin-bottom: 6px;
    letter-spacing: 0.05em;
  }

  .card-weekday {
    font-family: "ZCOOL KuaiLe", "站酷快乐体", cursive;
    font-size: 22px;
    color: #f2ead8;
    margin-bottom: 20px;
    letter-spacing: 0.05em;
  }

  .card-icon {
    font-size: 46px;
    line-height: 1;
    margin-bottom: 16px;
    filter: drop-shadow(0 0 10px rgba(255, 220, 150, 0.2));
  }

  .card-temp {
    font-family: "ZCOOL KuaiLe", "站酷快乐体", cursive;
    font-size: 26px;
    color: #f2ead8;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  
  .card-temp span {
    font-size: 15px;
    color: rgba(205, 191, 158, 0.6);
    margin-left: 2px;
  }

  .card-condition {
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 15px;
    color: #cdbf9e;
    margin-top: 10px;
    letter-spacing: 0.05em;
  }

  /* --- Tooltip 提示框通用基础样式 --- */
  .tooltip {
    position: absolute;
    left: 50%;
    width: 260px;
    background: rgba(15, 15, 16, 0.98);
    border: 1px solid rgba(255, 220, 150, 0.35);
    border-radius: 12px;
    padding: 20px 22px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 220, 150, 0.1);
    
    opacity: 0;
    visibility: hidden;
    
    transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.25s;
    pointer-events: none;
    z-index: 210;
    text-align: left;
  }

  .tooltip::after {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-width: 8px;
    border-style: solid;
  }

  .tooltip-title {
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 16px;
    font-weight: bold;
    color: #f2ead8;
    margin-bottom: 12px;
    border-bottom: 1px dashed rgba(255, 220, 150, 0.2);
    padding-bottom: 10px;
    letter-spacing: 0.05em;
    text-align: center;
  }

  .tooltip-row {
    display: flex;
    justify-content: space-between;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 14px;
    margin-bottom: 8px;
    color: #f2ead8;
  }
  
  .tooltip-row:last-child { margin-bottom: 0; }
  .tooltip-row span:first-child { color: #cdbf9e; }

  .tooltip-tip {
    margin-top: 12px; 
    padding-top: 10px; 
    border-top: 1px dashed rgba(255, 220, 150, 0.2); 
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 13px; 
    color: #cdbf9e; 
    line-height: 1.6;
    text-align: justify;
  }

  /* --- 默认（下排）：向上弹出 --- */
  .weather-card .tooltip {
    bottom: calc(100% + 16px);
    transform: translateX(-50%) translateY(10px);
  }
  .weather-card .tooltip::after {
    top: 100%;
    border-color: rgba(255, 220, 150, 0.35) transparent transparent transparent;
  }
  .weather-card:hover .tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
  }

  /* --- 上排卡片 (.tooltip-down)：向下弹出，避开导航栏 --- */
  .weather-card.tooltip-down .tooltip {
    top: calc(100% + 16px);
    bottom: auto;
    transform: translateX(-50%) translateY(-10px);
  }
  .weather-card.tooltip-down .tooltip::after {
    bottom: 100%;
    top: auto;
    border-color: transparent transparent rgba(255, 220, 150, 0.35) transparent;
  }
  .weather-card.tooltip-down:hover .tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
  }

  .source-tip {
    margin-top: 50px;
    font-family: "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 14px;
    color: rgba(205, 191, 158, 0.4);
    text-align: center;
    letter-spacing: 0.05em;
    z-index: 1;
  }
  .source-tip a {
    color: rgba(205, 191, 158, 0.7);
    text-decoration: none;
  }

  /* 小屏幕适配 */
  @media (max-width: 860px) {
    .weather-card { flex: 0 0 calc(33.33% - 14px); }
    .weather-card.tooltip-down .tooltip {
      top: auto;
      bottom: calc(100% + 16px);
      transform: translateX(-50%) translateY(10px);
    }
    .weather-card.tooltip-down .tooltip::after {
      top: 100%;
      bottom: auto;
      border-color: rgba(255, 220, 150, 0.35) transparent transparent transparent;
    }
    .weather-card.tooltip-down:hover .tooltip {
      transform: translateX(-50%) translateY(0);
    }
  }

  @media (max-width: 600px) {
    .weather-card { flex: 0 0 calc(50% - 10px); }
    .weather-card { padding: 20px 8px; }
    .tooltip { width: 220px; left: 0; transform: translateX(0) translateY(10px) !important; }
    .tooltip::after { left: 30%; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <a href="index.html">← 返回首页</a>
  </div>

  <div class="header">
    <h1>上海 · 未来一周天气</h1>
    <p id="updateTime">正在为您加载最新气象数据...</p>
  </div>

  <div class="calendar-grid" id="weatherGrid"></div>

  <div class="source-tip">
    预报数据引自 <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a> 开源气象接口，当前为极速加载模式。
  </div>

<script>
  const LAT = 31.19;
  const LON = 121.44;

  const weatherCodeMap = {
    0: { text: '晴', icon: '☀️' }, 1: { text: '大部晴朗', icon: '🌤️' }, 2: { text: '多云', icon: '⛅' }, 3: { text: '阴', icon: '☁️' },
    45: { text: '雾', icon: '🌫️' }, 48: { text: '雾凇', icon: '🌫️' }, 51: { text: '毛毛雨', icon: '🌦️' }, 53: { text: '毛毛雨', icon: '🌦️' },
    55: { text: '强毛毛雨', icon: '🌧️' }, 61: { text: '小雨', icon: '🌧️' }, 63: { text: '中雨', icon: '🌧️' }, 65: { text: '大雨', icon: '🌧️' },
    71: { text: '小雪', icon: '🌨️' }, 73: { text: '中雪', icon: '🌨️' }, 75: { text: '大雪', icon: '❄️' }, 80: { text: '阵雨', icon: '🌦️' },
    81: { text: '强阵雨', icon: '🌧️' }, 82: { text: '暴雨', icon: '⛈️' }, 95: { text: '雷阵雨', icon: '⛈️' }, 96: { text: '雷阵雨伴冰雹', icon: '⛈️' }
  };

  const weekMap = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const grid = document.getElementById('weatherGrid');
  const updateTimeEl = document.getElementById('updateTime');

  // 渲染卡片的主函数
  function renderCards(dataList, isRealtime = false) {
    grid.innerHTML = '';
    
    dataList.forEach((day, index) => {
      const isToday = index === 0;
      const codeInfo = weatherCodeMap[day.code] || { text: '未知', icon: '❓' };
      const isTopRow = index < 4;
      const tooltipClass = isTopRow ? ' tooltip-down' : '';

      const card = document.createElement('div');
      card.className = 'weather-card' + (isToday ? ' today' : '') + tooltipClass;

      card.innerHTML = `
        <div class="card-date">${day.month}月${day.day}日</div>
        <div class="card-weekday">${weekMap[day.weekday]}</div>
        <div class="card-icon">${codeInfo.icon}</div>
        <div class="card-temp">${Math.round(day.tempMax)}°<span> / ${Math.round(day.tempMin)}°C</span></div>
        <div class="card-condition">${codeInfo.text}</div>

        <div class="tooltip">
          <div class="tooltip-title">${day.month}月${day.day}日 · ${codeInfo.text}</div>
          <div class="tooltip-row"><span>风向风力</span><span>${day.windDir} ${day.windSpeed}km/h</span></div>
          <div class="tooltip-row"><span>相对湿度</span><span>${day.humidity}%</span></div>
          <div class="tooltip-row"><span>日出 / 日落</span><span>${day.sunrise} / ${day.sunset}</span></div>
          <div class="tooltip-row"><span>紫外线指数</span><span>${day.uvIndex}</span></div>
          <div class="tooltip-tip">${day.tip}</div>
        </div>
      `;
      grid.appendChild(card);
    });

    const now = new Date();
    const timeStr = `${now.getMonth()+1}月${now.getDate()}日 ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    
    if (isRealtime) {
      updateTimeEl.textContent = `实时数据 · 更新于 ${timeStr}`;
      updateTimeEl.style.color = '#cdbf9e';
    } else {
      updateTimeEl.textContent = `离线气象数据 · 更新于 ${timeStr}`;
      updateTimeEl.style.color = 'rgba(205, 191, 158, 0.5)';
    }
  }

  // 生成当前日期的7天离线数据（用于秒开兜底）
  function generateFallbackData() {
    const data = [];
    const today = new Date();
    const sampleWeather = [
      { code: 2, tMax: 19, tMin: 13, wDir: '北风', wSpeed: 15, hum: 80, uv: '中等' },
      { code: 3, tMax: 18, tMin: 13, wDir: '东北风', wSpeed: 10, hum: 75, uv: '较弱' },
      { code: 61, tMax: 17, tMin: 11, wDir: '北风', wSpeed: 18, hum: 90, uv: '较弱' },
      { code: 3, tMax: 15, tMin: 6, wDir: '西北风', wSpeed: 20, hum: 65, uv: '中等' },
      { code: 1, tMax: 11, tMin: 5, wDir: '西北风', wSpeed: 12, hum: 55, uv: '较强' },
      { code: 0, tMax: 12, tMin: 5, wDir: '西风', wSpeed: 8, hum: 50, uv: '中等' },
      { code: 0, tMax: 14, tMin: 8, wDir: '北风', wSpeed: 10, hum: 60, uv: '中等' }
    ];

    for (let i = 0; i < 7; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() + i);
      const s = sampleWeather[i];
      data.push({
        month: d.getMonth() + 1, day: d.getDate(), weekday: d.getDay(),
        code: s.code, tempMax: s.tMax, tempMin: s.tMin,
        windDir: s.wDir, windSpeed: s.wSpeed, humidity: s.hum,
        sunrise: '06:20', sunset: '16:56', uvIndex: s.uv,
        tip: `${s.wDir} ${s.wSpeed}km/h，紫外线${s.uv}，相对湿度${s.hum}%。`
      });
    }
    return data;
  }

  // 发起真实网络请求
  async function fetchWeather() {
    // 创建 AbortController 用于超时中断（避免卡死等太久）
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 3000); // 3秒超时

    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
        `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,` +
        `wind_speed_10m_max,wind_direction_10m_dominant,relative_humidity_2m_max,uv_index_max` +
        `&timezone=Asia/Shanghai&forecast_days=7`;

      const response = await fetch(url, { signal: controller.signal });
      clearTimeout(timeoutId);
      
      if (!response.ok) throw new Error('网络请求失败');
      const data = await response.json();
      
      const daily = data.daily;
      const weatherList = daily.time.map((timeStr, i) => {
        const d = new Date(timeStr);
        
        const windDirDeg = daily.wind_direction_10m_dominant[i];
        let windDirText = '北风';
        if (windDirDeg >= 22.5 && windDirDeg < 67.5) windDirText = '东北风';
        else if (windDirDeg >= 67.5 && windDirDeg < 112.5) windDirText = '东风';
        else if (windDirDeg >= 112.5 && windDirDeg < 157.5) windDirText = '东南风';
        else if (windDirDeg >= 157.5 && windDirDeg < 202.5) windDirText = '南风';
        else if (windDirDeg >= 202.5 && windDirDeg < 247.5) windDirText = '西南风';
        else if (windDirDeg >= 247.5 && windDirDeg < 292.5) windDirText = '西风';
        else if (windDirDeg >= 292.5 && windDirDeg < 337.5) windDirText = '西北风';

        const formatTime = (isoStr) => isoStr.split('T')[1]?.substring(0, 5) || '--:--';
        const uv = Math.round(daily.uv_index_max[i] || 0);
        let uvTip = uv <= 2 ? '较弱' : uv <= 5 ? '中等' : uv <= 7 ? '较强' : '很强';

        return {
          month: d.getMonth() + 1, day: d.getDate(), weekday: d.getDay(),
          code: daily.weather_code[i], tempMax: daily.temperature_2m_max[i], tempMin: daily.temperature_2m_min[i],
          sunrise: formatTime(daily.sunrise[i]), sunset: formatTime(daily.sunset[i]),
          humidity: Math.round(daily.relative_humidity_2m_max[i] || 0), windDir: windDirText,
          windSpeed: Math.round(daily.wind_speed_10m_max[i] || 0), uvIndex: uvTip,
          tip: `${windDirText} ${Math.round(daily.wind_speed_10m_max[i] || 0)}km/h，紫外线${uvTip}，相对湿度${Math.round(daily.relative_humidity_2m_max[i] || 0)}%。`
        };
      });

      // 获取成功，覆盖渲染为真实数据
      renderCards(weatherList, true);
    } catch (error) {
      console.warn('获取实时数据失败或超时，保持离线数据展示:', error);
      // 超时或失败，什么都不做，保留页面上的兜底数据
    }
  }

  // 页面初始化流程
  // 1. 立刻用生成的数据渲染，实现秒开！
  renderCards(generateFallbackData(), false);
  
  // 2. 后台静默请求真实数据
  fetchWeather();
</script>

</body>
</html>
